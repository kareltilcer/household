      operationId: getRemindersByReminderId
      tags: [reminders]
      summary: One reminder
      responses:
        '200': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: The reminder, content: { application/json: { schema: { $ref: '#/components/schemas/Reminder' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    patch:
      operationId: patchRemindersByReminderId
      tags: [reminders]
      summary: Update a reminder
