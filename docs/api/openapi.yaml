      responses:
        '201': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Property' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/property/properties/{property_id}:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { name: property_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }]
    get:
      operationId: getPropertyPropertiesByPropertyId
