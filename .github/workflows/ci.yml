name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  go:
    name: Go — build, vet, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # The image docker-compose.yml runs; tooling/src/workspace.test.ts fails when the
        # two disagree.
        image: postgres:17.11-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: household
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=postgres --dbname=household"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      HOUSEHOLD_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/household?sslmode=disable
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: |
            server/go.sum
            server/tools/*.sum
      - name: Modules are tidy and verified
        run: |
          go mod tidy -diff
          go mod verify
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Lint and format (golangci-lint)
        run: go tool -modfile=tools/golangci-lint.mod golangci-lint run
      - name: Test
        run: go test ./...

  typescript:
    name: TypeScript — typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true
      - name: Typecheck, lint and test
        run: pnpm exec turbo run typecheck lint test
      - name: Format (Prettier)
        run: pnpm run format:check

  openapi:
    name: OpenAPI — openapi-spec-validator and Redocly
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: docs/api/requirements.txt
      - name: openapi-spec-validator
        run: |
          python -m pip install --requirement docs/api/requirements.txt
          python -c "import yaml; from openapi_spec_validator import validate; validate(yaml.safe_load(open('docs/api/openapi.yaml', encoding='utf-8'))); print('valid')"
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true
      - name: Redocly
        run: pnpm run lint:api

  supply-chain:
    name: Supply chain — govulncheck, pnpm audit, gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # gitleaks reads the whole history, not only the tip.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: |
            server/go.sum
            server/tools/*.sum
      - name: govulncheck
        working-directory: server
        run: go tool -modfile=tools/govulncheck.mod govulncheck ./...
      - name: gitleaks
        working-directory: server
        run: go tool -modfile=tools/gitleaks.mod gitleaks git --redact --no-banner --verbose ..
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true
      - name: pnpm audit
        run: pnpm run audit:ts
