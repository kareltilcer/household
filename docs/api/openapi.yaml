      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [action, reason], properties: { action: { type: string, enum: [resend_verification, send_password_reset, clear_rate_limit, unlock] }, reason: { type: string } } } } }
      responses:
        '202': { description: Done }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '404': { $ref: '#/components/responses/NotFound' }

  /platform/diagnostics/{bundle_id}:
    parameters: [{ name: bundle_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }]
    get:
      operationId: getPlatformDiagnosticsByBundleId
