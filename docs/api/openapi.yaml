      responses:
        '204': { description: Disconnected }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/calendar/connections/{connection_id}/calendars/{remote_calendar_id}:
    parameters:
      - { $ref: '#/components/parameters/HouseholdId' }
      - { $ref: '#/components/parameters/ConnectionId' }
      - { name: remote_calendar_id, in: path, required: true, schema: { type: string } }
    put:
      operationId: putCalendarConnectionsByConnectionIdCalendarsByRemoteCalendarId
      tags: [calendar]
      summary: Set the direction and detail level for one remote calendar
      description: |
        `direction` is `off`, `import` or `two_way`; `detail` is `full` or `busy_only`.
