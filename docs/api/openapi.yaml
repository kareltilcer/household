    get:
      operationId: getChoresByChoreId
      tags: [chores]
      summary: One chore with its rotation and recent history
      responses:
        '200': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: The chore, content: { application/json: { schema: { $ref: '#/components/schemas/ChoreDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    patch:
      operationId: patchChoresByChoreId
      tags: [chores]
      summary: Update a chore
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ChoreUpdate' } } }
      responses:
        '200': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Chore' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      operationId: deleteChoresByChoreId
      tags: [chores]
      summary: Delete a chore
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/chores/board:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    get:
      operationId: getChoresBoard
      tags: [chores]
      summary: The weekly grid — members across, days down
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: The board, content: { application/json: { schema: { $ref: '#/components/schemas/ChoreBoard' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/chores/occurrences:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    get:
      operationId: getChoresOccurrences
      tags: [chores]
      summary: Due and overdue occurrences
      parameters:
        - { name: from, in: query, required: false, schema: { type: string, format: date } }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
        - { name: assignee_id, in: query, required: false, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/ChoreOccurrenceStatus' } }
      responses:
        '200': { description: Occurrences, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/ChoreOccurrence' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/chores/occurrences/{occurrence_id}/complete:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/OccurrenceId' }]
    post:
      operationId: postChoresOccurrencesByOccurrenceIdComplete
      tags: [chores]
      summary: Complete a chore occurrence
      description: |
        Idempotent per (occurrence, member). Rotation advancement is **server-authoritative** and
        driven by the occurrence, so two offline completions advance the rotation once.
        Points are awarded here unless the chore requires verification.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: false
        content: { application/json: { schema: { type: object, properties: { note: { type: string }, client_time: { type: string, format: date-time }, via: { $ref: '#/components/schemas/Via' } } } } }
      responses:
        '200': { description: Completed, content: { application/json: { schema: { $ref: '#/components/schemas/ChoreOccurrence' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/chores/occurrences/{occurrence_id}/skip:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/OccurrenceId' }]
    post:
      operationId: postChoresOccurrencesByOccurrenceIdSkip
      tags: [chores]
      summary: Skip an occurrence
      description: No points. Advances a `weekly_rotation` but not a `rotating` chore.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: false
        content: { application/json: { schema: { type: object, properties: { reason: { type: string } } } } }
      responses:
        '200': { description: Skipped, content: { application/json: { schema: { $ref: '#/components/schemas/ChoreOccurrence' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/chores/occurrences/{occurrence_id}/snooze:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/OccurrenceId' }]
    post:
      operationId: postChoresOccurrencesByOccurrenceIdSnooze
      tags: [chores]
      summary: Snooze an occurrence
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [days], properties: { days: { type: integer, minimum: 1, maximum: 90 } } } } }
      responses:
        '200': { description: Snoozed, content: { application/json: { schema: { $ref: '#/components/schemas/ChoreOccurrence' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/chores/occurrences/{occurrence_id}/verify:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/OccurrenceId' }]
    post:
      operationId: postChoresOccurrencesByOccurrenceIdVerify
      tags: [chores]
      summary: Confirm or return a completion awaiting verification
      description: Requires `manage`. Points are awarded on confirmation. Verification is **off** by default on every chore.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [approved], properties: { approved: { type: boolean }, note: { type: string } } } } }
      responses:
        '200': { description: Recorded, content: { application/json: { schema: { $ref: '#/components/schemas/ChoreOccurrence' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

