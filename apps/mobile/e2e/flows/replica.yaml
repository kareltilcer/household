# A member's replica on a device, against the real stack (D-93, D-105, D-178): signed in, the
# replica of their household opens, the sync service's stream comes up and the device says it
# receives, with nothing waiting in its inbox; asked to, it reports itself, which is what the
# household's clients are read off; and with the connection taken away the device says it is
# offline and the household's own bar comes, and goes when the connection is back. It is what
# nothing on a developer's machine can show: none opens the replica's SQLite.
#
# It reads the live section of the dev screen for sync (src/dev/sync), which says each of
# these in a line whose `testID` is how it stands, narrowed to that section so that the only
# offline bar on the screen is the real replica's. Reached by a link, which Android opens for a
# member as for a visitor. After the flows the job asks the server for the household's
# clients, which must name `mobile/<version>` for this replica (`pnpm run e2e:stack clients`).
appId: com.kareltilcer.household.dev
tags:
  - stack
  - android
# Whatever became of the flow, the emulator has its connection back for the flows after it.
onFlowComplete:
  - setAirplaneMode: disabled
---
- launchApp:
    clearState: true
- runFlow: parts/sign-in.yaml
- extendedWaitUntil:
    visible:
      id: 'route:household'
    timeout: 60000
- openLink: household-dev:///dev/sync
- extendedWaitUntil:
    visible:
      id: 'household-dev-screen:sync'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'sync:only:live'
    direction: DOWN
- tapOn:
    id: 'sync:only:live'
# The lines are there once the member's households are read, the device's own word among
# them. Scrolled to once: what follows is waited for where it stands, and not scrolled after,
# since a line that has not come yet is no place to scroll to.
- scrollUntilVisible:
    element:
      id: 'sync:live:online:yes'
    direction: DOWN
    timeout: 60000
# The replica is opened, and then it receives: its stream is up and has not failed.
- extendedWaitUntil:
    visible:
      id: 'sync:live:replica:open'
    timeout: 120000
- extendedWaitUntil:
    visible:
      id: 'sync:live:receiving:yes'
    timeout: 120000
- extendedWaitUntil:
    visible:
      id: 'sync:live:inbox:0'
    timeout: 30000
- takeScreenshot: replica-receiving
# It reports itself once it has caught up, and the server takes the report: while everything
# is reachable, so that what the job asks the server afterwards does not hang on the
# emulator's way back from no connection.
- scrollUntilVisible:
    element:
      id: 'sync:live:report'
    direction: DOWN
    timeout: 30000
- tapOn:
    id: 'sync:live:report'
- extendedWaitUntil:
    visible:
      id: 'sync:live:reported:sent'
    timeout: 120000
# The connection taken away: the device says so, and the household's bar comes.
- setAirplaneMode: enabled
- extendedWaitUntil:
    visible:
      id: 'sync:live:online:no'
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: 'offline-bar'
    timeout: 60000
- takeScreenshot: replica-offline
# And back: the device says it is online, and the bar goes.
- setAirplaneMode: disabled
- extendedWaitUntil:
    visible:
      id: 'sync:live:online:yes'
    timeout: 120000
- extendedWaitUntil:
    notVisible:
      id: 'offline-bar'
    timeout: 120000
