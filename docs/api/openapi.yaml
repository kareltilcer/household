        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/DashboardLayout' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
