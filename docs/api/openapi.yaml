      responses:
        '200': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/UtilityPreset' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
