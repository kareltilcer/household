        '200': { description: Households, content: { application/json: { schema: { $ref: '#/components/schemas/PlatformHouseholdPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /platform/households/{household_id}:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    get:
      operationId: getPlatformHouseholdsByHouseholdId
      tags: [platform]
      summary: One household's metadata
      description: |
        Name, ids, member count, roles, plan, subscription state, storage totals per module, module
        enablement, delivery outcomes, and audit **action keys** — with no summaries and no diffs.
