        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/calendar/calendars/{calendar_id}:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/CalendarId' }]
    get:
      operationId: getCalendarCalendarsByCalendarId
      tags: [calendar]
      summary: One calendar
      responses:
        '200': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: The calendar, content: { application/json: { schema: { $ref: '#/components/schemas/Calendar' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    patch:
      operationId: patchCalendarCalendarsByCalendarId
      tags: [calendar]
      summary: Update a calendar
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CalendarUpdate' } } }
      responses:
        '200': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Calendar' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
