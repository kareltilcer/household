      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CalendarConnectionCalendarUpdate' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/CalendarConnectionCalendar' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/calendar/connections/{connection_id}/sync:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/ConnectionId' }]
    post:
      operationId: postCalendarConnectionsByConnectionIdSync
      tags: [calendar]
      summary: Trigger a synchronisation now
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '202': { description: Queued }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/calendar/conflicts:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' }]
    get:
      operationId: getCalendarConflicts
      tags: [calendar]
      summary: Unresolved external-sync conflicts
      description: |
        Where both sides changed, the owning system wins and the losing version is preserved here
        for the member to resolve. Calendar events are **never** merged field-by-field.
      responses:
        '200': { description: Conflicts, content: { application/json: { schema: { $ref: '#/components/schemas/CalendarConflictPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/calendar/conflicts/{conflict_id}/resolve:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { name: conflict_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }]
    post:
      operationId: postCalendarConflictsByConflictIdResolve
      tags: [calendar]
      summary: Resolve a conflict by choosing a side
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [keep], properties: { keep: { type: string, enum: [local, remote] } } } } }
      responses:
        '204': { description: Resolved }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

