      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UtilityBillCreate' } } }
      responses:
        '201': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/UtilityBill' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/utilities/bills/{bill_id}:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { name: bill_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }]
    patch:
      operationId: patchUtilitiesBillsByBillId
      tags: [utilities]
      summary: Update a bill
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UtilityBillUpdate' } } }
      responses:
        '200': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/UtilityBill' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      operationId: deleteUtilitiesBillsByBillId
      tags: [utilities]
      summary: Delete a bill
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /households/{household_id}/garden/settings:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    get:
      operationId: getGardenSettings
      tags: [garden]
      summary: Tier, climate profile, frost dates and per-check configuration
      responses:
        '200': { description: Settings, content: { application/json: { schema: { $ref: '#/components/schemas/GardenSettings' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    patch:
      operationId: patchGardenSettings
      tags: [garden]
      summary: Update settings, including changing tier
      description: |
        Tier changes are **non-destructive in both directions**. Dropping from `plot` to `beds`
        hides seasons; it does not delete them, and the data returns intact on the way back up.

        The location resolves the climate profile — last-spring-frost, first-autumn-frost, hardiness
        zone and season length — all of which are shown and all of which are editable, because a
        member knows their own frost pocket better than a dataset does. **Device location is never
        read**; the member names a place or drops a pin, stored at reduced precision.
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GardenSettingsUpdate' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/GardenSettings' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/garden/catalog/crops:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    get:
      operationId: getGardenCatalogCrops
      tags: [garden]
      summary: Search the curated crop catalog, resolved against the household's climate
      description: |
        The catalog is **shipped and owned by the platform** — versioned, multi-language, and with
        timings expressed **relative to local frost dates and hardiness zone** rather than as
        absolute calendar weeks. A crop's resolved windows are therefore correct in Bavaria and in
        Andalusia at once.

        Resolution order is **variety → household override → catalog**, implemented in one function.
      parameters:
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: family, in: query, required: false, schema: { type: string } }
        - { name: shortlist_only, in: query, required: false, schema: { type: boolean, default: false } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { description: Crops, content: { application/json: { schema: { $ref: '#/components/schemas/CropPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/garden/catalog/crops/{crop_id}:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/CropId' }]
    get:
      operationId: getGardenCatalogCropsByCropId
      tags: [garden]
      summary: One crop, fully resolved, with its provenance and any household override
      responses:
        '200': { description: The crop, content: { application/json: { schema: { $ref: '#/components/schemas/CropDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/garden/catalog/crops/{crop_id}/override:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/CropId' }]
    put:
      operationId: putGardenCatalogCropsByCropIdOverride
      tags: [garden]
      summary: Override catalog fields for this household
      description: Overrides survive catalog updates and are shown **as overrides**, never merged silently.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CropOverride' } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/CropDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      operationId: deleteGardenCatalogCropsByCropIdOverride
      tags: [garden]
      summary: Remove the household's override, reverting to the catalog
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/garden/crops:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    post:
      operationId: postGardenCrops
      tags: [garden]
      summary: Add a household's own crop
