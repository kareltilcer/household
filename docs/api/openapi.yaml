    ChoreRedemption:
      type: object
      required: [id]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        reward: { $ref: '#/components/schemas/ChoreReward' }
        user: { $ref: '#/components/schemas/ActorRef' }
        status: { type: string, enum: [requested, approved, declined] }
        note: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }

    Note:
      type: object
      required: [id, version]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, format: int64 }
        folder_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        title: { type: string }
        slug: { type: string }
        slug_path: { type: string, description: 'Not permanent — renaming or moving changes it, and the old path `404`s. There are no redirects.' }
        excerpt: { type: [string, 'null'] }
        language: { type: [string, 'null'] }
        visibility: { type: string, enum: [shared, private] }
        owner: { oneOf: [{ $ref: '#/components/schemas/ActorRef' }, { type: 'null' }] }
        position: { type: string }
        archived: { type: boolean }
        pinned: { $ref: '#/components/schemas/PinState' }
        created_by: { $ref: '#/components/schemas/ActorRef' }
        updated_at: { type: string, format: date-time }

    NoteDetail:
      allOf:
        - { $ref: '#/components/schemas/Note' }
        - type: object
          properties:
            body_md: { type: string }
            path: { type: array, items: { $ref: '#/components/schemas/Folder' } }
            superseded_body:
              oneOf:
                - { type: 'null' }
                - type: object
                  description: The version an overwriting save displaced, preserved for 30 days and offered on the conflict banner — the difference between "you lost your paragraph" and "here it is".
                  properties:
                    body_md: { type: string }
                    by: { $ref: '#/components/schemas/ActorRef' }
                    at: { type: string, format: date-time }

    NoteCreate:
      type: object
      required: [id, title]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        title: { type: string, minLength: 1 }
        folder_id: { $ref: '#/components/schemas/Uuid' }
        body_md: { type: string }
        language: { type: string }
        visibility: { type: string, enum: [shared, private], default: shared }
        position: { type: string }

    NoteUpdate:
      type: object
      properties: { title: { type: string }, body_md: { type: string }, language: { type: string }, archived: { type: boolean } }

    NotePage:
      type: object
      required: [items, meta]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/Note' } }, meta: { $ref: '#/components/schemas/PageMeta' } }

    NoteTree:
      type: object
      properties:
        root: { type: string, enum: [shared, private] }
        folders: { type: array, items: { $ref: '#/components/schemas/Folder' } }
        notes: { type: array, items: { $ref: '#/components/schemas/Note' } }

    NoteImage:
      type: object
      required: [id]
      properties: { id: { $ref: '#/components/schemas/Uuid' }, url: { type: string }, content_type: { type: string }, byte_size: { type: integer, format: int64 } }

    Document:
      type: object
      required: [id, version]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, format: int64 }
        folder_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        title: { type: string }
        description: { type: [string, 'null'] }
        slug: { type: string }
        slug_path: { type: string }
        original_filename: { type: string }
        content_type: { type: string, description: Sniffed from the leading bytes. The client's header is never trusted. }
        byte_size: { type: integer, format: int64 }
        checksum: { type: string }
        preview_kind: { type: string, enum: [native, pdf, none] }
        preview_status: { type: string, enum: [pending, ready, failed, none] }
        derived_bytes: { type: integer, format: int64, description: 'Thumbnails and preview PDFs, counted toward the storage meter and shown separately.' }
        document_type: { oneOf: [{ $ref: '#/components/schemas/DocumentType' }, { type: 'null' }] }
        expires_on: { type: [string, 'null'], format: date }
        visibility: { type: string, enum: [shared, private] }
        owner: { oneOf: [{ $ref: '#/components/schemas/ActorRef' }, { type: 'null' }] }
        position: { type: string }
        archived: { type: boolean }
        pinned: { $ref: '#/components/schemas/PinState' }
        created_by: { $ref: '#/components/schemas/ActorRef' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DocumentDetail:
      allOf:
        - { $ref: '#/components/schemas/Document' }
        - type: object
          properties:
            path: { type: array, items: { $ref: '#/components/schemas/Folder' } }
            supersedes_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'Bytes are write-once, so a changed file is a new document, optionally linked as a successor.' }
            referenced_by: { type: array, items: { type: object, properties: { module: { $ref: '#/components/schemas/ModuleKeyValue' }, entity_type: { type: string }, entity_id: { $ref: '#/components/schemas/Uuid' }, label: { type: string } } } }

    DocumentUpload:
      type: object
      required: [file]
      properties:
        file: { type: string, format: binary }
        id: { $ref: '#/components/schemas/Uuid' }
        folder_id: { $ref: '#/components/schemas/Uuid' }
        title: { type: string }
        description: { type: string }
        document_type_id: { $ref: '#/components/schemas/Uuid' }
        expires_on: { type: string, format: date }
        visibility: { type: string, enum: [shared, private] }
        supersedes_id: { $ref: '#/components/schemas/Uuid' }

    DocumentUpdate:
      type: object
      description: Metadata only. Never the bytes.
      properties:
        title: { type: string }
        description: { type: [string, 'null'] }
        document_type_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        expires_on: { type: [string, 'null'], format: date }
        archived: { type: boolean }

    DocumentPage:
      type: object
      required: [items, meta]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/Document' } }, meta: { $ref: '#/components/schemas/PageMeta' } }

    DocumentTree:
      type: object
      properties:
        root: { type: string, enum: [shared, private] }
        folders: { type: array, items: { $ref: '#/components/schemas/Folder' } }
        documents: { type: array, items: { $ref: '#/components/schemas/Document' } }

    DocumentType:
      type: object
      required: [id]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        key: { type: string, examples: ['passport'] }
        label: { type: string }
        default_expiry_lead: { $ref: '#/components/schemas/ReminderLead' }
        completion_scope: { type: string, enum: [household, personal] }
        countries: { type: array, items: { type: string } }

    DocumentBulkRequest:
      type: object
      required: [ids, action]
      properties:
        ids: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
        action: { type: string, enum: [move, archive, unarchive, delete] }
        folder_id: { $ref: '#/components/schemas/Uuid' }
        hard: { type: boolean, default: false }
    FinanceCapability:
      type: string
      enum: [accounts_allocation, shared_expenses, budgets, recurring]
      description: The four compose. A couple with a joint account who split a holiday and watch groceries is one household with three capabilities on, one ledger, and no contradiction.

    FinanceSettings:
      type: object
      properties:
        capabilities: { type: array, items: { $ref: '#/components/schemas/FinanceCapability' } }
        period_kind: { type: string, enum: [monthly, fortnightly, weekly] }
        base_currency: { type: string }
        setup_completed: { type: boolean }

    FinanceSettingsUpdate:
      type: object
      properties:
        capabilities: { type: array, items: { $ref: '#/components/schemas/FinanceCapability' } }
        period_kind: { type: string, enum: [monthly, fortnightly, weekly] }

    FinancePreset:
      type: object
      properties:
        key: { type: string, enum: [everything_shared, mostly_shared, separate_split, custom] }
        label: { type: string }
        description: { type: string }
        capabilities: { type: array, items: { $ref: '#/components/schemas/FinanceCapability' } }
        accounts: { type: array, items: { $ref: '#/components/schemas/FinanceAccountCreate' } }
        rules: { type: array, items: { $ref: '#/components/schemas/AllocationRule' } }

    FinanceSetupRequest:
      type: object
      required: [preset]
      properties:
        preset: { type: string, enum: [everything_shared, mostly_shared, separate_split, custom] }
        earners: { type: array, items: { type: object, properties: { user_id: { $ref: '#/components/schemas/Uuid' }, indicative_income: { $ref: '#/components/schemas/Money' } } } }
        seed_categories: { type: boolean, default: true }

    FinanceSetupResult:
      type: object
      properties:
        accounts: { type: array, items: { $ref: '#/components/schemas/FinanceAccount' } }
        plan: { oneOf: [{ $ref: '#/components/schemas/AllocationPlan' }, { type: 'null' }] }
        categories_created: { type: integer }
        preview: { oneOf: [{ $ref: '#/components/schemas/AllocationResult' }, { type: 'null' }] }

    FinanceAccountType:
      type: string
      enum: [personal, joint, savings, cash, credit, other]

    FinanceAccount:
      type: object
      required: [id, version]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, format: int64 }
        name: { type: string }
        type: { $ref: '#/components/schemas/FinanceAccountType' }
        owner: { oneOf: [{ $ref: '#/components/schemas/ActorRef' }, { type: 'null' }], description: 'Required for `personal`; forbidden on every other type.' }
        currency: { type: string }
        institution: { type: [string, 'null'] }
        last4: { type: [string, 'null'] }
        is_active: { type: boolean }
        position: { type: string }

    FinanceAccountCreate:
      type: object
      required: [id, name, type, currency]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        type: { $ref: '#/components/schemas/FinanceAccountType' }
        owner_id: { $ref: '#/components/schemas/Uuid' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        opening_balance: { $ref: '#/components/schemas/Money' }
        institution: { type: string }
        last4: { type: string }
        position: { type: string }

    FinanceAccountUpdate:
      type: object
      properties: { name: { type: string }, institution: { type: [string, 'null'] }, last4: { type: [string, 'null'] }, is_active: { type: boolean }, position: { type: string } }

    FinanceAccountDetail:
      allOf:
        - { $ref: '#/components/schemas/FinanceAccount' }
        - type: object
          properties:
            balance: { $ref: '#/components/schemas/Money' }
            transaction_count: { type: integer }

    FinanceIncome:
      type: object
      required: [id, version]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, format: int64 }
        member: { $ref: '#/components/schemas/ActorRef' }
        period: { type: string, pattern: '^\d{4}-\d{2}$' }
        amount: { $ref: '#/components/schemas/Money' }
        foreign: { oneOf: [{ $ref: '#/components/schemas/ForeignAmount' }, { type: 'null' }] }
        source_label: { type: [string, 'null'] }
        note: { type: [string, 'null'] }

    FinanceIncomeCreate:
      type: object
      required: [id, user_id, period, amount]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        user_id: { $ref: '#/components/schemas/Uuid' }
        period: { type: string, pattern: '^\d{4}-\d{2}$' }
        amount: { $ref: '#/components/schemas/Money' }
        foreign: { $ref: '#/components/schemas/ForeignAmount' }
        source_label: { type: string }
        note: { type: string }

    FinanceIncomeUpdate:
      type: object
      properties: { period: { type: string }, amount: { $ref: '#/components/schemas/Money' }, source_label: { type: [string, 'null'] }, note: { type: [string, 'null'] } }

    FinanceIncomePage:
      type: object
      required: [items, meta]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/FinanceIncome' } }, meta: { $ref: '#/components/schemas/PageMeta' } }

    AllocationRule:
      type: object
      description: |
        The generalisation of a fixed split formula into an ordered, typed rule list. `home`'s
        original arrangement — each earner keeps p% of their own income, the rest goes to a joint
        operational account, two savings transfers leave it off the household total, and the
        remainder stays — is expressible in five rules of this shape, and the engine reproduces its
        worked example to the minor unit.
      required: [order, from, basis, mode, to]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        order: { type: integer }
        from: { type: string, description: '`income`, or an account id.' }
        per_earner: { type: boolean, default: false, description: 'When true and `from = income`, the rule runs once per earner against **their own** income and targets **their own** account.' }
        basis: { type: string, enum: [own_income, total_income, source_balance, fixed] }
        mode: { type: string, enum: [percent, amount, remainder] }
        value: { type: [string, 'null'], description: 'A decimal percent as a string, or minor units. Unused when `mode = remainder`.' }
        to: { type: string, description: 'An account id, or the literal `owner_personal`, which resolves per earner under `per_earner`.' }
        label: { type: [string, 'null'] }

    AllocationPlan:
      type: object
      required: [id, version]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, format: int64 }
        effective_from: { type: string, pattern: '^\d{4}-\d{2}$' }
        effective_to: { type: [string, 'null'], readOnly: true, description: '**Derived from the next version, never stored** — a stored end is a second source of truth that eventually contradicts the next row''s start.' }
        rules: { type: array, items: { $ref: '#/components/schemas/AllocationRule' } }

    AllocationPlanCreate:
      type: object
      required: [id, effective_from, rules]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        effective_from: { type: string, pattern: '^\d{4}-\d{2}$' }
        rules: { type: array, items: { $ref: '#/components/schemas/AllocationRule' } }

    AllocationPlanUpdate:
      type: object
      properties: { effective_from: { type: string }, rules: { type: array, items: { $ref: '#/components/schemas/AllocationRule' } } }

    AllocationValidationProblem:
      allOf:
        - { $ref: '#/components/schemas/ValidationProblem' }
        - type: object
          properties:
            missing_remainder_for: { type: array, items: { type: string }, description: 'Exactly one `remainder` rule per source is required — it absorbs all rounding, which is what makes every total reconcile exactly.' }
            duplicate_remainder_for: { type: array, items: { type: string } }

    AllocationPreviewRequest:
      type: object
      required: [incomes]
      properties:
        plan: { oneOf: [{ $ref: '#/components/schemas/AllocationPlanCreate' }, { type: 'null' }], description: An unsaved plan to try. Omit to use the version effective for the period. }
        period: { type: string, pattern: '^\d{4}-\d{2}$' }
        incomes:
          type: array
          items:
            type: object
            properties:
              user_id: { $ref: '#/components/schemas/Uuid' }
              amount: { $ref: '#/components/schemas/Money' }

    AllocationResult:
      type: object
      properties:
        period: { type: string }
        plan_id: { $ref: '#/components/schemas/Uuid' }
        total_income: { $ref: '#/components/schemas/Money' }
        movements:
          type: array
          description: Every movement the plan produced, in rule order — the flow visualisation reads straight off this.
          items:
            type: object
            properties:
              rule_id: { $ref: '#/components/schemas/Uuid' }
              label: { type: string }
              from: { type: string }
              to: { type: string }
              for_user: { oneOf: [{ $ref: '#/components/schemas/ActorRef' }, { type: 'null' }] }
              amount: { $ref: '#/components/schemas/Money' }
              is_remainder: { type: boolean }
        account_totals:
          type: array
          items:
            type: object
            properties:
              account_id: { $ref: '#/components/schemas/Uuid' }
              account_name: { type: string }
              inflow: { $ref: '#/components/schemas/Money' }
              outflow: { $ref: '#/components/schemas/Money' }
              net: { $ref: '#/components/schemas/Money' }
        invariants:
          type: object
          description: Asserted by the engine and by its tests. All hold even where a remainder comes out negative — which is exactly what they exist to protect.
          properties:
            per_earner_balanced: { type: boolean }
            per_source_balanced: { type: boolean }
            total_balanced: { type: boolean }
        notes:
          type: array
          items: { type: string }
          description: 'e.g. that a remainder came out negative and is rendered as zero with a footnote. It is **never clamped in the data** — clamping would break the invariant the rounding scheme exists to protect.'

    FinancePeriodSummary:
      type: object
      properties:
        recorded: { type: array, items: { type: string } }
        missing: { type: array, items: { type: string }, description: 'The actual failure mode is not a wrong number — it is a month nobody entered.' }
        earliest: { type: [string, 'null'] }
        current: { type: string }

    TransactionKind: { type: string, enum: [income, expense, transfer] }
    TransactionSource:
      type: string
      enum: [manual, import, split, allocation, recurring]
      description: Present from day one so a bank feed can be added later without a migration, and so an imported row and a hand-typed row stay distinguishable forever.

    SplitMethod:
      type: string
      enum: [equal, shares, percent, exact, adjustment]

    ExpenseShare:
      type: object
      properties:
        user: { $ref: '#/components/schemas/ActorRef' }
        share_value: { type: [string, 'null'], description: 'Shares, percent or exact minor units, per the method.' }
        amount: { $ref: '#/components/schemas/Money' }

    Transaction:
      type: object
      required: [id, version]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, format: int64 }
        occurred_on: { type: string, format: date }
        description: { type: string }
        counterparty: { type: [string, 'null'] }
        amount: { $ref: '#/components/schemas/Money' }
        foreign: { oneOf: [{ $ref: '#/components/schemas/ForeignAmount' }, { type: 'null' }] }
        kind: { $ref: '#/components/schemas/TransactionKind' }
        source: { $ref: '#/components/schemas/TransactionSource' }
        account_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        category_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        settles: { type: boolean, description: 'False for household spending from a joint account — it belongs in the budget and creates no balance. A splitting model that cannot express this is why people keep a spreadsheet beside the app.' }
        created_by: { $ref: '#/components/schemas/ActorRef' }

    TransactionDetail:
      allOf:
        - { $ref: '#/components/schemas/Transaction' }
        - type: object
          properties:
            split_method: { oneOf: [{ $ref: '#/components/schemas/SplitMethod' }, { type: 'null' }] }
            paid_by: { type: array, items: { type: object, properties: { user: { $ref: '#/components/schemas/ActorRef' }, amount: { $ref: '#/components/schemas/Money' } } } }
            shares: { type: array, items: { $ref: '#/components/schemas/ExpenseShare' } }
            receipt: { oneOf: [{ $ref: '#/components/schemas/DocumentRef' }, { type: 'null' }] }

    TransactionUpdate:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        occurred_on: { type: string, format: date }
        description: { type: string }
        counterparty: { type: string }
        amount: { $ref: '#/components/schemas/Money' }
        foreign: { $ref: '#/components/schemas/ForeignAmount' }
        kind: { $ref: '#/components/schemas/TransactionKind' }
        account_id: { $ref: '#/components/schemas/Uuid' }
        category_id: { $ref: '#/components/schemas/Uuid' }
        settles: { type: boolean, default: true }
        split_method: { $ref: '#/components/schemas/SplitMethod' }
        paid_by: { type: array, items: { type: object, properties: { user_id: { $ref: '#/components/schemas/Uuid' }, amount: { $ref: '#/components/schemas/Money' } } } }
        shares:
          type: array
          description: 'Supplying this makes the transaction a shared expense. The last minor unit is assigned deterministically in a stable participant order, so a three-way split of 10.00 is always the same 3.34 / 3.33 / 3.33 — a balance that changes when you refresh it is not a balance.'
          items: { type: object, properties: { user_id: { $ref: '#/components/schemas/Uuid' }, share_value: { type: string } } }
        receipt_document_id: { $ref: '#/components/schemas/Uuid' }

    TransactionCreate:
      allOf: [{ $ref: '#/components/schemas/TransactionUpdate' }, { required: [id, occurred_on, description, amount, kind] }]

    TransactionPage:
      type: object
      required: [items, meta]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Transaction' } }
        totals: { type: object, properties: { income: { $ref: '#/components/schemas/Money' }, expense: { $ref: '#/components/schemas/Money' } } }
        meta: { $ref: '#/components/schemas/PageMeta' }

    BalanceReport:
      type: object
      properties:
        currency: { type: string }
        net: { type: array, items: { type: object, properties: { user: { $ref: '#/components/schemas/ActorRef' }, amount: { $ref: '#/components/schemas/Money' } } } }
        pairwise:
          type: array
          items:
            type: object
            properties:
              from: { $ref: '#/components/schemas/ActorRef' }
              to: { $ref: '#/components/schemas/ActorRef' }
              amount: { $ref: '#/components/schemas/Money' }

    Settlement:
      type: object
      required: [id]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        settled_on: { type: string, format: date }
        from: { $ref: '#/components/schemas/ActorRef' }
        to: { $ref: '#/components/schemas/ActorRef' }
        amount: { $ref: '#/components/schemas/Money' }
        note: { type: [string, 'null'] }
        recorded_by: { $ref: '#/components/schemas/ActorRef' }

    SettlementCreate:
      type: object
      required: [id, settled_on, from_user_id, to_user_id, amount]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        settled_on: { type: string, format: date }
        from_user_id: { $ref: '#/components/schemas/Uuid' }
        to_user_id: { $ref: '#/components/schemas/Uuid' }
        amount: { $ref: '#/components/schemas/Money' }
        note: { type: string }

    SettlementPage:
      type: object
      required: [items, meta]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/Settlement' } }, meta: { $ref: '#/components/schemas/PageMeta' } }

    SettlementSuggestions:
      type: object
      description: Household never moves money — these are suggestions, and the recorded settlement is whatever actually happened.
      properties:
        simplified: { type: array, items: { type: object, properties: { from: { $ref: '#/components/schemas/ActorRef' }, to: { $ref: '#/components/schemas/ActorRef' }, amount: { $ref: '#/components/schemas/Money' } } } }
        pairwise: { type: array, items: { type: object, properties: { from: { $ref: '#/components/schemas/ActorRef' }, to: { $ref: '#/components/schemas/ActorRef' }, amount: { $ref: '#/components/schemas/Money' } } } }

    FinanceCategory:
      type: object
      required: [id]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        parent_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        name: { type: string }
        icon: { type: [string, 'null'] }
        colour: { type: [string, 'null'] }
        kind: { $ref: '#/components/schemas/TransactionKind' }
        is_builtin: { type: boolean }
        position: { type: string }

    FinanceCategoryUpdate:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        parent_id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        icon: { type: string }
        colour: { type: string }
        kind: { $ref: '#/components/schemas/TransactionKind' }
        position: { type: string }

    FinanceCategoryCreate:
      allOf: [{ $ref: '#/components/schemas/FinanceCategoryUpdate' }, { required: [id, name, kind] }]

    BudgetReport:
      type: object
      properties:
        period: { type: string }
        items:
          type: array
          items:
            type: object
            properties:
              category: { $ref: '#/components/schemas/FinanceCategory' }
              planned: { $ref: '#/components/schemas/Money' }
              actual: { $ref: '#/components/schemas/Money' }
              remaining: { $ref: '#/components/schemas/Money' }
              rollover: { type: boolean }
              rolled_in: { $ref: '#/components/schemas/Money' }
              projected: { $ref: '#/components/schemas/Money' }
        total_planned: { $ref: '#/components/schemas/Money' }
        total_actual: { $ref: '#/components/schemas/Money' }

    BudgetSetRequest:
      type: object
      required: [period, budgets]
      properties:
        period: { type: string, pattern: '^\d{4}-\d{2}$' }
        budgets:
          type: array
          items:
            type: object
            properties:
              category_id: { $ref: '#/components/schemas/Uuid' }
              amount: { $ref: '#/components/schemas/Money' }
              rollover: { type: boolean, default: false }

    RecurringItem:
      type: object
      required: [id, version]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, format: int64 }
        name: { type: string }
        amount: { $ref: '#/components/schemas/Money' }
        cadence: { type: string, enum: [monthly, quarterly, semiannual, annual, custom] }
        custom_interval_days: { type: [integer, 'null'] }
        next_due_on: { type: string, format: date }
        category_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        account_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        payee: { type: [string, 'null'] }
        contract: { oneOf: [{ $ref: '#/components/schemas/DocumentRef' }, { type: 'null' }] }
        cancellation_notice_days: { type: [integer, 'null'], description: 'The reminder fires this far ahead of the renewal — the moment at which cancelling is still possible, which is the only moment it is worth anything.' }
        status: { type: string, enum: [active, paused, cancelled] }

    RecurringItemFields:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        amount: { $ref: '#/components/schemas/Money' }
        cadence: { type: string, enum: [monthly, quarterly, semiannual, annual, custom] }
        custom_interval_days: { type: integer }
        next_due_on: { type: string, format: date }
        category_id: { $ref: '#/components/schemas/Uuid' }
        account_id: { $ref: '#/components/schemas/Uuid' }
        payee: { type: string }
        contract_document_id: { $ref: '#/components/schemas/Uuid' }
        cancellation_notice_days: { type: integer }

    RecurringItemCreate:
      allOf: [{ $ref: '#/components/schemas/RecurringItemFields' }, { required: [id, name, amount, cadence, next_due_on] }]

    RecurringItemUpdate:
      allOf: [{ $ref: '#/components/schemas/RecurringItemFields' }, { type: object, properties: { status: { type: string, enum: [active, paused, cancelled] } } }]

    RecurringItemDetail:
      allOf:
        - { $ref: '#/components/schemas/RecurringItem' }
        - type: object
          properties:
            price_history:
              type: array
              description: '"Netflix has gone up three times in two years" is a thing this module can answer and almost nothing else can.'
              items: { type: object, properties: { from: { type: string, format: date }, amount: { $ref: '#/components/schemas/Money' } } }

    RecurringConfirm:
      type: object
      required: [confirmed_on, amount]
      properties:
        transaction_id: { $ref: '#/components/schemas/Uuid' }
        confirmed_on: { type: string, format: date }
        amount: { $ref: '#/components/schemas/Money' }
        price_change: { type: string, enum: [one_off, new_price], description: Asked whenever the confirmed amount differs from the definition. }

    ImportMapping:
      type: object
      required: [id]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        format: { type: string, enum: [csv, camt053] }
        delimiter: { type: [string, 'null'] }
        encoding: { type: [string, 'null'] }
        date_format: { type: [string, 'null'] }
        decimal_separator: { type: [string, 'null'] }
        sign_convention: { type: [string, 'null'], enum: [signed, debit_credit_columns, null] }
        columns: { type: object, additionalProperties: { type: string }, description: 'Field name to column header or index.' }

    ImportMappingCreate:
      allOf: [{ $ref: '#/components/schemas/ImportMapping' }, { required: [id] }]

    ImportRequest:
      type: object
      required: [file, account_id]
      properties:
        file: { type: string, format: binary }
        account_id: { $ref: '#/components/schemas/Uuid' }
        mapping_id: { $ref: '#/components/schemas/Uuid' }
        mapping: { $ref: '#/components/schemas/ImportMapping' }

    ImportResult:
      type: object
      properties:
        dry_run: { type: boolean }
        parsed: { type: integer }
        imported: { type: integer }
        skipped: { type: integer }
        rows:
          type: array
          items:
            type: object
            properties:
              line: { type: integer }
              transaction: { $ref: '#/components/schemas/Transaction' }
              suggested_category_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
              duplicate_of: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'Shown for confirmation, never silently dropped and never silently imported.' }
              error: { type: [string, 'null'] }

    FinanceRule:
      type: object
      required: [id]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        match_field: { type: string, enum: [description, counterparty] }
        match_kind: { type: string, enum: [contains, equals, starts_with, regex] }
        match_value: { type: string }
        set_category_id: { $ref: '#/components/schemas/Uuid' }
        position: { type: string }

    FinanceRuleCreate:
      allOf: [{ $ref: '#/components/schemas/FinanceRule' }, { required: [id] }]

    FxRate:
      type: object
      properties:
        rate_on: { type: string, format: date }
        from: { type: string }
        to: { type: string }
        rate: { type: string, description: Decimal as a string. }
        source: { const: ecb_reference }
    Commodity:
      type: string
      enum: [electricity, gas, water, hot_water, sewage, heat, waste, internet, other]

    UtilityMode:
      type: string
      enum: [bills_only, readings, full]
      description: |
        `bills_only` — invoices and payments, for renters and flat-fee arrangements.
        `readings` — adds meter readings and consumption trends.
        `full` — adds tariffs, advances, billing periods, forecast and reconciliation.
        A household may run different modes for different services, and upgrading never loses or
        re-enters anything.

    UtilityPreset:
      type: object
      description: Versioned reference **data**, not code — a country's billing arrangement changing must be a data update, and `custom` always exists as the fallback.
      properties:
        key: { type: string, examples: ['cz.electricity.two_tariff'] }
        country: { type: string }
        commodity: { $ref: '#/components/schemas/Commodity' }
        label: { type: string }
        version: { type: integer }
        registers: { type: array, items: { $ref: '#/components/schemas/RegisterSpec' } }
        components:
          type: array
          description: A skeleton with the right component types in the right order and empty values, labelled with the words that appear on that country's bill.
          items: { $ref: '#/components/schemas/TariffComponent' }
        prices_include_tax: { type: boolean }
        default_conversion: { oneOf: [{ $ref: '#/components/schemas/MeterConversionCreate' }, { type: 'null' }] }

    UtilityService:
      type: object
      required: [id, version]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, format: int64 }
        commodity: { $ref: '#/components/schemas/Commodity' }
        mode: { $ref: '#/components/schemas/UtilityMode' }
        name: { type: string }
        supplier: { type: [string, 'null'] }
        account_number: { type: [string, 'null'] }
        place_label: { type: [string, 'null'] }
        currency: { type: string }
        contract_start: { type: [string, 'null'], format: date }
        contract_end: { type: [string, 'null'], format: date }
        notice_period_days: { type: [integer, 'null'], description: Drives a reminder at the moment a fixed-price contract can still be switched. }
        documents: { type: array, items: { $ref: '#/components/schemas/DocumentRef' } }

    UtilityServiceCreate:
      type: object
      required: [id, commodity, mode, name]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        commodity: { $ref: '#/components/schemas/Commodity' }
        mode: { $ref: '#/components/schemas/UtilityMode' }
        name: { type: string }
        preset_key: { type: string, description: 'Creates the meter, its registers and a tariff skeleton.' }
        supplier: { type: string }
        account_number: { type: string }
        place_label: { type: string }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        contract_start: { type: string, format: date }
        contract_end: { type: string, format: date }
        notice_period_days: { type: integer }

    UtilityServiceUpdate:
      type: object
      properties:
        mode: { $ref: '#/components/schemas/UtilityMode' }
        name: { type: string }
        supplier: { type: [string, 'null'] }
        account_number: { type: [string, 'null'] }
        place_label: { type: [string, 'null'] }
        contract_start: { type: [string, 'null'], format: date }
        contract_end: { type: [string, 'null'], format: date }
        notice_period_days: { type: [integer, 'null'] }

    UtilityServiceDetail:
      allOf:
        - { $ref: '#/components/schemas/UtilityService' }
        - type: object
          properties:
            meters: { type: array, items: { $ref: '#/components/schemas/Meter' } }
            current_tariff: { oneOf: [{ $ref: '#/components/schemas/TariffVersion' }, { type: 'null' }] }
            current_advance: { oneOf: [{ $ref: '#/components/schemas/AdvanceSchedule' }, { type: 'null' }] }
            current_period: { oneOf: [{ $ref: '#/components/schemas/BillingPeriod' }, { type: 'null' }] }

    RegisterKey:
      type: string
      description: Identifies one register on a meter. Shared by the meter's own register definitions and by every reading that refers to them, so the two ends of the relationship cannot drift.
      enum: [total, peak, off_peak, day, night, vt, nt, export, other]

    RegisterSpec:
      type: object
      required: [key]
      properties:
        key: { $ref: '#/components/schemas/RegisterKey' }
        label: { type: string }
        direction: { type: string, enum: [import, export] }

    Meter:
      type: object
      required: [id, version]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, format: int64 }
        service_id: { $ref: '#/components/schemas/Uuid' }
        serial: { type: [string, 'null'] }
        location: { type: [string, 'null'] }
        unit: { type: string, enum: [kWh, MWh, m3, GJ, litre], description: 'The unit the **dial** reads, not the unit billed.' }
        digits: { type: integer }
        decimals: { type: integer }
        multiplier: { type: string, description: Decimal as a string. Some meters read in units of 10 or 100. }
        direction: { type: string, enum: [import, export, bidirectional] }
        registers: { type: array, items: { $ref: '#/components/schemas/RegisterSpec' } }
        installed_on: { type: [string, 'null'], format: date }
        removed_on: { type: [string, 'null'], format: date }
        replaced_by_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }

    MeterCreate:
      type: object
      required: [id, unit, registers]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        serial: { type: string }
        location: { type: string }
        unit: { type: string, enum: [kWh, MWh, m3, GJ, litre] }
        digits: { type: integer, default: 6 }
        decimals: { type: integer, default: 1 }
        multiplier: { type: string, default: '1' }
        direction: { type: string, enum: [import, export, bidirectional], default: import }
        registers: { type: array, minItems: 1, items: { $ref: '#/components/schemas/RegisterSpec' } }
        installed_on: { type: string, format: date }

    MeterUpdate:
      type: object
      properties: { serial: { type: [string, 'null'] }, location: { type: [string, 'null'] }, digits: { type: integer }, decimals: { type: integer }, multiplier: { type: string } }

    MeterReplacement:
      type: object
      required: [replaced_on, final_values, new_meter, initial_values]
      properties:
        replaced_on: { type: string, format: date }
        final_values: { type: array, items: { $ref: '#/components/schemas/ReadingValue' } }
        new_meter: { $ref: '#/components/schemas/MeterCreate' }
        initial_values: { type: array, items: { $ref: '#/components/schemas/ReadingValue' } }

    MeterConversion:
      type: object
      required: [id]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        effective_from: { type: string, format: date }
        effective_to: { type: [string, 'null'], format: date, readOnly: true }
        from_unit: { type: string }
        to_unit: { type: string }
        volume_correction: { type: [string, 'null'], description: Decimal as a string. }
        calorific_value: { type: [string, 'null'], description: 'kWh per m³. Appears on the invoice and changes; a constant in the code is a module that is wrong somewhere.' }
        factor: { type: [string, 'null'], description: 'A plain multiplier, for conversions with no correction — GJ to kWh, for instance.' }

    MeterConversionCreate:
      type: object
      required: [id, effective_from, from_unit, to_unit]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        effective_from: { type: string, format: date }
        from_unit: { type: string }
        to_unit: { type: string }
        volume_correction: { type: string }
        calorific_value: { type: string }
        factor: { type: string }

    ReadingValue:
      type: object
      required: [register_key, value_milli]
      properties:
        register_key: { $ref: '#/components/schemas/RegisterKey' }
        value_milli: { type: integer, format: int64, description: 'Thousandths of the dial unit — covers a gas meter to three decimals and an electricity meter to one, with no float anywhere.' }

    Reading:
      type: object
      required: [id, version]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, format: int64 }
        meter_id: { $ref: '#/components/schemas/Uuid' }
        read_on: { type: string, format: date, description: The meter state at 00:00 of this day. }
        values: { type: array, items: { $ref: '#/components/schemas/ReadingValue' } }
        source: { type: string, enum: [manual, estimated, supplier], description: '`estimated` readings are marked and **excluded from every money figure** — money is never interpolated; pictures may be.' }
        is_rollover: { type: boolean }
        note: { type: [string, 'null'] }
        photo: { oneOf: [{ $ref: '#/components/schemas/DocumentRef' }, { type: 'null' }] }
        recorded_by: { $ref: '#/components/schemas/ActorRef' }

    ReadingCreate:
      type: object
      required: [id, read_on, values]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        read_on: { type: string, format: date }
        values: { type: array, minItems: 1, items: { $ref: '#/components/schemas/ReadingValue' } }
        source: { type: string, enum: [manual, estimated, supplier], default: manual }
        confirm_rollover: { type: boolean, default: false }
        note: { type: string }
        photo_document_id: { $ref: '#/components/schemas/Uuid' }

    ReadingUpdate:
      type: object
      description: |
        Carries `confirm_rollover` and `source` for the same reason `ReadingCreate` does: a
        correction is validated for monotonicity exactly as a new reading is, so a correction on a
        meter that has since wrapped needs the same way to say so, and a reading recorded with the
        wrong `source` must be correctable in place — `estimated` readings are excluded from every
        money figure, so a mis-tagged row silently distorts billing until it is fixed.
      properties: { read_on: { type: string, format: date }, values: { type: array, items: { $ref: '#/components/schemas/ReadingValue' } }, source: { type: string, enum: [manual, estimated, supplier] }, confirm_rollover: { type: boolean, default: false }, note: { type: [string, 'null'] } }

    ReadingPage:
      type: object
      required: [items, meta]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/Reading' } }, meta: { $ref: '#/components/schemas/PageMeta' } }

    ReadingValidationProblem:
      allOf:
        - { $ref: '#/components/schemas/ValidationProblem' }
        - type: object
          properties:
            register_key: { type: string }
            offending_neighbour:
              type: object
              description: Validated against **both** sides, so a back-filled reading cannot break the chain either.
              properties:
                reading_id: { $ref: '#/components/schemas/Uuid' }
                read_on: { type: string, format: date }
                value_milli: { type: integer, format: int64 }
            rollover_possible: { type: boolean }

    TariffComponentType:
      type: string
      enum: [standing_charge, capacity_charge, unit_rate, tiered_rate, time_of_use, per_unit_levy, fixed_levy, tax, discount, feed_in, self_consumption_credit]

    TariffComponent:
      type: object
      required: [type, order]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        order: { type: integer }
        type: { $ref: '#/components/schemas/TariffComponentType' }
        label: { type: string, description: 'The words that appear on the bill in that country — *plat za jistič*, *Grundpreis*, *standing charge*.' }
        register_key: { type: [string, 'null'] }
        amount_minor: { type: [integer, 'null'], format: int64 }
        per_period: { type: [string, 'null'], enum: [day, month, year, null] }
        per_unit_minor: { type: [integer, 'null'], format: int64, description: 'Per billed unit, in minor units of the currency, scaled so that a price of 4 858,65 per MWh is exact.' }
        capacity_value: { type: [string, 'null'], description: 'Amps, kW — whatever the country bills capacity in.' }
        capacity_unit: { type: [string, 'null'] }
        tiers:
          type: [array, 'null']
          items:
            type: object
            properties:
              up_to: { type: [string, 'null'], description: 'Null for the final, unbounded block.' }
              per_unit_minor: { type: integer, format: int64 }
        tier_reset: { type: [string, 'null'], enum: [never, month, quarter, year, period, null] }
        schedule:
          type: [array, 'null']
          description: For a single-register meter priced by clock time.
          items:
            type: object
            properties:
              days: { type: array, items: { type: integer, minimum: 0, maximum: 6 } }
              from: { type: string, pattern: '^\d{2}:\d{2}$' }
              to: { type: string, pattern: '^\d{2}:\d{2}$' }
              register_key: { type: string }
        percent: { type: [string, 'null'], description: For `tax` and `discount`. Decimal as a string. }
        applies_to:
          type: [array, 'null']
          description: |
            Component ids or types this applies to. VAT on the whole bill is `["*"]`; VAT on energy
            but not on a regulatory levy names the set. Ordering plus an explicit `applies_to` is
            what makes a compounding tax expressible **without a formula language**.
          items: { type: string }

    TariffVersion:
      type: object
      required: [id, version]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, format: int64 }
        service_id: { $ref: '#/components/schemas/Uuid' }
        effective_from: { type: string, format: date }
        effective_to: { type: [string, 'null'], format: date, readOnly: true, description: '**Derived from the next version, never stored.**' }
        prices_include_tax: { type: boolean }
        note: { type: [string, 'null'] }
        components: { type: array, items: { $ref: '#/components/schemas/TariffComponent' } }

    TariffVersionUpdate:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        effective_from: { type: string, format: date }
        prices_include_tax: { type: boolean, default: true }
        note: { type: string }
        components: { type: array, items: { $ref: '#/components/schemas/TariffComponent' } }

    TariffVersionCreate:
      allOf: [{ $ref: '#/components/schemas/TariffVersionUpdate' }, { required: [id, effective_from, components] }]

    AdvanceSchedule:
      type: object
      required: [id]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        effective_from: { type: string, format: date }
        effective_to: { type: [string, 'null'], format: date, readOnly: true }
        amount: { $ref: '#/components/schemas/Money' }
        due_day: { type: integer, minimum: 1, maximum: 31, description: 'Clamped to the month''s last day **at read time, never stored clamped**.' }
        note: { type: [string, 'null'] }

    AdvanceScheduleUpdate:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        effective_from: { type: string, format: date }
        amount: { $ref: '#/components/schemas/Money' }
        due_day: { type: integer, minimum: 1, maximum: 31 }
        note: { type: string }

    AdvanceScheduleCreate:
      allOf: [{ $ref: '#/components/schemas/AdvanceScheduleUpdate' }, { required: [id, effective_from, amount, due_day] }]

    AdvancePayment:
      type: object
      required: [id]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        period: { type: string, pattern: '^\d{4}-\d{2}$', description: 'The attribution key — **not** `paid_on`. A March advance paid on 2 April still belongs to March.' }
        amount: { $ref: '#/components/schemas/Money' }
        paid_on: { type: [string, 'null'], format: date }
        note: { type: [string, 'null'] }

    AdvancePaymentUpdate:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        period: { type: string, pattern: '^\d{4}-\d{2}$' }
        amount: { $ref: '#/components/schemas/Money' }
        paid_on: { type: string, format: date }
        note: { type: string }

    AdvancePaymentCreate:
      allOf: [{ $ref: '#/components/schemas/AdvancePaymentUpdate' }, { required: [id, period, amount] }]

    AdvancePaymentPage:
      type: object
      required: [items, meta]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/AdvancePayment' } }, meta: { $ref: '#/components/schemas/PageMeta' } }

    BillingPeriod:
      type: object
      required: [id, version]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, format: int64 }
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date }
        ends_on_confirmed: { type: boolean, description: 'False shows an *estimated* badge — suppliers frequently do not state an end date in advance, and a prediction has to project somewhere.' }
        invoiced_total: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        invoiced_balance: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        invoiced_values: { type: [array, 'null'], items: { $ref: '#/components/schemas/ReadingValue' }, description: 'The supplier''s final meter values, so a discrepancy can be attributed to **consumption** rather than only to money.' }
        invoiced_on: { type: [string, 'null'], format: date }
        invoice_document: { oneOf: [{ $ref: '#/components/schemas/DocumentRef' }, { type: 'null' }] }
        note: { type: [string, 'null'] }

    BillingPeriodCreate:
      type: object
      required: [id, starts_on]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date }
        note: { type: string }

    BillingPeriodUpdate:
      type: object
      properties:
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date }
        ends_on_confirmed: { type: boolean }
        invoiced_total: { $ref: '#/components/schemas/Money' }
        invoiced_balance: { $ref: '#/components/schemas/Money' }
        invoiced_values: { type: array, items: { $ref: '#/components/schemas/ReadingValue' } }
        invoiced_on: { type: string, format: date }
        invoice_document_id: { $ref: '#/components/schemas/Uuid' }
        note: { type: [string, 'null'] }

    UtilityBlock:
      type: object
      description: What the module needs before it can compute. The reading form opens pre-filled with `on` and **no estimated value**.
      properties:
        kind: { type: string, enum: [missing_reading, period_start, no_tariff, no_readings] }
        date: { type: [string, 'null'], format: date }
        message: { type: string }

    UtilitySummary:
      type: object
      properties:
        service_id: { $ref: '#/components/schemas/Uuid' }
        period: { $ref: '#/components/schemas/BillingPeriod' }
        state: { type: string, enum: [ok, insufficient_data, blocked] }
        blocking: { type: array, items: { $ref: '#/components/schemas/UtilityBlock' } }
        reason: { type: [string, 'null'], description: 'Names exactly what is missing, so the member is never told only that it cannot be shown.' }
        actual_to: { type: [string, 'null'], format: date, description: 'The boundary between fact and forecast is the **latest reading, not today**.' }
        consumption: { type: array, items: { type: object, properties: { register_key: { type: string }, actual_milli: { type: integer, format: int64 }, forecast_milli: { type: integer, format: int64 } } } }
        energy_total:
          oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }]
        fee_total: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        cost_total:
          oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }]
          description: '**Nullable and absent — never zero — in `insufficient_data` and `blocked`.** The module never shows a number it has not earned, and that is a property of the type rather than a rule each screen must remember.'
        advances_total: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        balance:
          oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }]
          description: Positive is a credit, negative is owed. Absent in `insufficient_data` and `blocked`.
        counted_months:
          type: array
          description: 'A month counts iff the period contains its first day, which makes a year-long period exactly twelve months whatever day it starts on. Listed so the rule is visible rather than folklore.'
          items:
            type: object
            properties:
              period: { type: string }
              amount: { $ref: '#/components/schemas/Money' }
              from_payment: { type: boolean }
              due_day_clamped: { type: integer }
              already_due: { type: boolean }
        recommended_advance: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }], description: 'Rounded up, floored at zero, and omitted when no month remains.' }
        headroom:
          oneOf:
            - { type: 'null' }
            - type: object
              description: Computable with **zero** consumption data, which is why it is what the overview leads with on day one. The mix is a stated heuristic, never a measurement.
              properties:
                advance: { $ref: '#/components/schemas/Money' }
                fixed_charges: { $ref: '#/components/schemas/Money' }
                energy_budget: { $ref: '#/components/schemas/Money' }
                per_register: { type: array, items: { type: object, properties: { register_key: { type: string }, units_milli: { type: integer, format: int64 } } } }
                at_mix: { type: object, properties: { description: { type: string }, units_milli: { type: integer, format: int64 } } }

    UtilityInterval:
      type: object
      properties:
        from_reading_id: { $ref: '#/components/schemas/Uuid' }
        to_reading_id: { $ref: '#/components/schemas/Uuid' }
        from_on: { type: string, format: date }
        to_on: { type: string, format: date }
        days: { type: integer }
        tariff_id: { $ref: '#/components/schemas/Uuid' }
        consumption: { type: array, items: { type: object, properties: { register_key: { type: string }, dial_milli: { type: integer, format: int64 }, billed_milli: { type: integer, format: int64 }, billed_unit: { type: string } } } }
        energy_cost: { $ref: '#/components/schemas/Money' }
        breakdown:
          type: array
          description: The components are rounded and the largest takes the remainder, so the parts sum to the whole by construction.
          items: { type: object, properties: { component_id: { $ref: '#/components/schemas/Uuid' }, label: { type: string }, amount: { $ref: '#/components/schemas/Money' } } }
        is_forecast: { type: boolean }

    IntervalReport:
      type: object
      properties:
        intervals: { type: array, items: { $ref: '#/components/schemas/UtilityInterval' } }
        fee_chunks:
          type: array
          description: 'Time-based components are pro-rata by day and summed per (calendar month × tariff version) with one rounding per chunk. They belong to no interval — allocating them would invent a second rounding rule whose only purpose is keeping two views agreeing.'
          items: { type: object, properties: { period: { type: string }, tariff_id: { $ref: '#/components/schemas/Uuid' }, days: { type: integer }, amount: { $ref: '#/components/schemas/Money' } } }
        blocking: { type: array, items: { $ref: '#/components/schemas/UtilityBlock' } }

    UtilityHistory:
      type: object
      properties:
        months:
          type: array
          items:
            type: object
            properties:
              period: { type: string }
              consumption: { type: array, items: { type: object, properties: { register_key: { type: string }, billed_milli: { type: integer, format: int64 } } } }
              cost: { $ref: '#/components/schemas/Money' }
              is_approximate: { type: boolean, description: 'True whenever a contributing interval crosses the month boundary — monthly consumption is approximate by construction, and pretending otherwise is a lie the chart tells.' }
        periods:
          type: array
          items:
            type: object
            properties:
              period: { $ref: '#/components/schemas/BillingPeriod' }
              computed_cost: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
              invoiced_total: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
              money_difference: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
              unit_differences: { type: array, items: { type: object, properties: { register_key: { type: string }, computed_milli: { type: integer, format: int64 }, invoiced_milli: { type: integer, format: int64 } } } }

    UtilityBill:
      type: object
      required: [id, version]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, format: int64 }
        issued_on: { type: string, format: date }
        due_on: { type: [string, 'null'], format: date }
        period_from: { type: [string, 'null'], format: date }
        period_to: { type: [string, 'null'], format: date }
        amount: { $ref: '#/components/schemas/Money' }
        paid_on: { type: [string, 'null'], format: date }
        consumption_note: { type: [string, 'null'], description: 'A figure copied off the bill, for year-on-year comparison without any modelling.' }
        document: { oneOf: [{ $ref: '#/components/schemas/DocumentRef' }, { type: 'null' }] }

    UtilityBillUpdate:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        issued_on: { type: string, format: date }
        due_on: { type: string, format: date }
        period_from: { type: string, format: date }
        period_to: { type: string, format: date }
        amount: { $ref: '#/components/schemas/Money' }
        paid_on: { type: string, format: date }
        consumption_note: { type: string }
        document_id: { $ref: '#/components/schemas/Uuid' }

    UtilityBillCreate:
      allOf: [{ $ref: '#/components/schemas/UtilityBillUpdate' }, { required: [id, issued_on, amount] }]

    UtilityBillPage:
      type: object
      required: [items, meta]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/UtilityBill' } }, meta: { $ref: '#/components/schemas/PageMeta' } }
    GardenTier:
      type: string
      enum: [pots, beds, plot]
      description: |
        One data model, three UI tiers. `pots` — containers, care reminders, a photo journal.
        `beds` — adds beds, plantings, generated tasks and the history-free checks.
        `plot` — adds seasons, rotation history, the full eleven-check plan review, succession and
        storage. **Tier changes are non-destructive in both directions.**

    ClimateProfile:
      type: object
      properties:
        source: { type: string, enum: [dataset, manual] }
        last_spring_frost: { type: string, format: date }
        first_autumn_frost: { type: string, format: date }
        hardiness_zone: { type: string }
        season_length_days: { type: integer }

    GardenSettings:
      type: object
      properties:
        tier: { $ref: '#/components/schemas/GardenTier' }
        place_label: { type: [string, 'null'], description: 'A town or a dropped pin, stored at reduced precision. **Device location is never read** — no module requests the permission.' }
        latitude: { type: [number, 'null'], multipleOf: 0.01, description: 'Rounded to two decimal places (~1.1 km) at the moment it is stored. The rounded value is the only one ever persisted, logged, exported or sent to the weather provider — see 05-privacy-and-compliance §2.' }
        longitude: { type: [number, 'null'], multipleOf: 0.01 }
        altitude_m: { type: [integer, 'null'] }
        climate: { $ref: '#/components/schemas/ClimateProfile' }
        frost_threshold_c: { type: number }
        frost_lookahead_days: { type: integer }
        default_rotation_break_years: { type: integer }
        workload_spike_threshold: { type: integer }
        checks: { type: array, items: { type: object, properties: { key: { type: string }, enabled: { type: boolean }, severity: { $ref: '#/components/schemas/CheckSeverity' } } } }

    GardenSettingsUpdate:
      type: object
      properties:
        tier: { $ref: '#/components/schemas/GardenTier' }
        place_label: { type: string }
        latitude: { type: number, multipleOf: 0.01, description: 'Rounded to two decimal places (~1.1 km) on write; the client snaps a dropped pin to the rounded point rather than blurring it afterwards.' }
        longitude: { type: number, multipleOf: 0.01 }
        altitude_m: { type: integer }
        climate: { $ref: '#/components/schemas/ClimateProfile' }
        frost_threshold_c: { type: number }
        frost_lookahead_days: { type: integer }
        default_rotation_break_years: { type: integer }
        workload_spike_threshold: { type: integer }
        checks: { type: array, items: { type: object, properties: { key: { type: string }, enabled: { type: boolean }, severity: { $ref: '#/components/schemas/CheckSeverity' } } } }

    RelativeWindow:
      type: object
      description: |
        Timings are expressed **relative to local frost dates**, never as absolute calendar weeks —
        which is the only way one catalog is correct in Bavaria and Andalusia at once.
      properties:
        anchor: { type: string, enum: [last_frost, first_frost, soil_temp, week] }
        offset_days_from: { type: [integer, 'null'] }
        offset_days_to: { type: [integer, 'null'] }
        week_from: { type: [integer, 'null'] }
        week_to: { type: [integer, 'null'] }
        soil_temp_c: { type: [number, 'null'] }
        resolved_from: { type: [string, 'null'], format: date, readOnly: true }
        resolved_to: { type: [string, 'null'], format: date, readOnly: true }

    Crop:
      type: object
      required: [id]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        source: { type: string, enum: [catalog, household] }
        catalog_version: { type: [integer, 'null'] }
        name: { type: string }
        name_latin: { type: [string, 'null'] }
        family: { type: string, description: Drives rotation. }
        plant_type: { type: [string, 'null'] }
        hardiness: { type: string, enum: [tender, half_hardy, hardy], description: Drives the frost logic. }
        has_override: { type: boolean }
        in_shortlist: { type: boolean }

    CropDetail:
      allOf:
        - { $ref: '#/components/schemas/Crop' }
        - type: object
          properties:
            feeder_class: { type: [string, 'null'] }
            root_depth: { type: [string, 'null'] }
            sun: { type: [string, 'null'] }
            water_need: { type: [string, 'null'] }
            soil_ph_min: { type: [number, 'null'] }
            soil_ph_max: { type: [number, 'null'] }
            rotation_break_years: { type: [integer, 'null'] }
            sow_depth_cm: { type: [number, 'null'] }
            spacing_row_cm: { type: [number, 'null'] }
            spacing_plant_cm: { type: [number, 'null'] }
            plants_per_m2: { type: [number, 'null'] }
            germination_temp_c: { type: [number, 'null'] }
            days_to_germinate_min: { type: [integer, 'null'] }
            days_to_germinate_max: { type: [integer, 'null'] }
            days_to_maturity_min: { type: [integer, 'null'] }
            days_to_maturity_max: { type: [integer, 'null'] }
            windows:
              type: object
              properties:
                sow_indoor: { oneOf: [{ $ref: '#/components/schemas/RelativeWindow' }, { type: 'null' }] }
                sow_direct: { oneOf: [{ $ref: '#/components/schemas/RelativeWindow' }, { type: 'null' }] }
                transplant: { oneOf: [{ $ref: '#/components/schemas/RelativeWindow' }, { type: 'null' }] }
                harvest: { oneOf: [{ $ref: '#/components/schemas/RelativeWindow' }, { type: 'null' }] }
            harvest_unit: { type: [string, 'null'] }
            yield_per_m2: { type: [number, 'null'] }
            yield_per_plant: { type: [number, 'null'] }
            storage_methods: { type: array, items: { type: string } }
            shelf_life_days: { type: [integer, 'null'] }
            pests: { type: array, items: { type: string } }
            diseases: { type: array, items: { type: string } }
            care_notes: { type: [string, 'null'] }
            water_interval_days: { type: [integer, 'null'] }
            feed_interval_days: { type: [integer, 'null'] }
            provenance:
              type: object
              additionalProperties: { type: string }
              description: Per-field source, so folklore and agronomy are told apart by looking.
            override_fields: { type: array, items: { type: string }, description: 'Shown **as overrides**, never merged silently. Overrides survive catalog updates.' }

    CropPage:
      type: object
      required: [items, meta]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/Crop' } }, meta: { $ref: '#/components/schemas/PageMeta' } }

    CropOverride:
      type: object
      additionalProperties: true
      description: Any field of `CropDetail`. Resolution order is variety → household override → catalog, implemented in one function with its own tests.

    HouseholdCropCreate:
      type: object
      required: [id, name, family, hardiness]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        name_latin: { type: string }
        family: { type: string, description: Required — the rotation engine cannot function without it. }
        hardiness: { type: string, enum: [tender, half_hardy, hardy], description: Required — the frost logic cannot function without it. }
        fields: { type: object, additionalProperties: true }

    Variety:
      type: object
      required: [id]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        crop_id: { $ref: '#/components/schemas/Uuid' }
        source: { type: string, enum: [catalog, household] }
        name: { type: string }
        note: { type: [string, 'null'] }
        overrides: { type: object, additionalProperties: true, description: 'Every timing, spacing, maturity, yield and storage field is nullable. Null means inherit.' }

    VarietyUpdate:
      type: object
      properties: { id: { $ref: '#/components/schemas/Uuid' }, name: { type: string }, note: { type: string }, overrides: { type: object, additionalProperties: true } }

    VarietyCreate:
      allOf: [{ $ref: '#/components/schemas/VarietyUpdate' }, { required: [id, name] }]

    CatalogSuggestion:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [correction, missing_crop, missing_variety] }
        crop_id: { $ref: '#/components/schemas/Uuid' }
        field: { type: string }
        proposed_value: { type: string }
        note: { type: string }
        source: { type: string }

    CatalogSuggestionPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            allOf:
              - { $ref: '#/components/schemas/CatalogSuggestion' }
              - type: object
                properties:
                  id: { $ref: '#/components/schemas/Uuid' }
                  status: { type: string, enum: [pending, accepted, rejected] }
                  submitted_at: { type: string, format: date-time }
        meta: { $ref: '#/components/schemas/PageMeta' }

    CatalogCropUpsert:
      $ref: '#/components/schemas/CropDetail'

    Container:
      type: object
      required: [id, version]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, format: int64 }
        name: { type: string }
        location: { type: [string, 'null'], description: 'balcony, windowsill, terrace, greenhouse, or free text.' }
        size_litres: { type: [number, 'null'] }
        photo: { oneOf: [{ $ref: '#/components/schemas/DocumentRef' }, { type: 'null' }] }
        position: { type: string }

    ContainerUpdate:
      type: object
      properties: { id: { $ref: '#/components/schemas/Uuid' }, name: { type: string }, location: { type: string }, size_litres: { type: number }, position: { type: string } }

    ContainerCreate:
      allOf: [{ $ref: '#/components/schemas/ContainerUpdate' }, { required: [id, name] }]

    Bed:
      type: object
      required: [id, version]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, format: int64 }
        name: { type: string }
        code: { type: [string, 'null'] }
        type: { type: [string, 'null'] }
        zone: { type: [string, 'null'] }
        position: { type: string, description: '**Order within a zone is the adjacency model** — two beds are neighbours iff they are consecutive in the same zone.' }
        length_cm: { type: [integer, 'null'] }
        width_cm: { type: [integer, 'null'] }
        area_m2: { type: [number, 'null'] }
        sun_exposure: { type: [string, 'null'] }
        soil_notes_md: { type: [string, 'null'] }
        is_active: { type: boolean }

    BedFields:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        code: { type: string }
        type: { type: string }
        zone: { type: string }
        position: { type: string }
        length_cm: { type: integer }
        width_cm: { type: integer }
        area_m2: { type: number }
        sun_exposure: { type: string }
        soil_notes_md: { type: string }

    BedCreate:
      allOf: [{ $ref: '#/components/schemas/BedFields' }, { required: [id, name] }]

    BedUpdate:
      allOf: [{ $ref: '#/components/schemas/BedFields' }, { type: object, properties: { is_active: { type: boolean } } }]

    BedHistory:
      type: object
      properties:
        bed_id: { $ref: '#/components/schemas/Uuid' }
        seasons:
          type: array
          items:
            type: object
            properties:
              year: { type: integer }
              families: { type: array, items: { type: string } }
              crops: { type: array, items: { type: string } }

    Season:
      type: object
      properties:
        year: { type: integer }
        version: { type: integer, format: int64 }
        status: { type: string, enum: [planning, active, closed] }
        expected_last_frost: { type: string, format: date }
        expected_first_frost: { type: string, format: date }
        observed_last_frost: { type: [string, 'null'], format: date }
        observed_first_frost: { type: [string, 'null'], format: date }
        closed_at: { type: [string, 'null'], format: date-time }
        closed_by: { oneOf: [{ $ref: '#/components/schemas/ActorRef' }, { type: 'null' }] }
        planting_count: { type: integer }

    SeasonCreate:
      type: object
      required: [id, year]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        year: { type: integer }
        expected_last_frost: { type: string, format: date }
        expected_first_frost: { type: string, format: date }
        copy_from: { type: integer, description: A previous year to copy non-permanent plantings from. }
        shift: { type: integer, description: Rotate bed assignments by this offset over the ordered active beds. }
        shift_by: { type: string, enum: [planting, family_block], default: family_block, description: A family moves together. }

    SeasonUpdate:
      type: object
      properties: { expected_last_frost: { type: string, format: date }, expected_first_frost: { type: string, format: date } }

    SeasonPreview:
      type: object
      description: The dry-run result. The member sees what the shift fixed and what it broke, side by side, **before** the season exists.
      properties:
        season: { $ref: '#/components/schemas/Season' }
        plantings: { type: array, items: { $ref: '#/components/schemas/Planting' } }
        check: { $ref: '#/components/schemas/PlanCheck' }
        compared_to_source:
          type: object
          properties:
            resolved: { type: array, items: { type: string } }
            introduced: { type: array, items: { type: string } }

    SeasonCloseRequest:
      type: object
      properties:
        observed_last_frost: { type: string, format: date }
        observed_first_frost: { type: string, format: date }
        final_yields: { type: array, items: { type: object, properties: { planting_id: { $ref: '#/components/schemas/Uuid' }, quantity: { type: number }, unit: { type: string } } } }
        failures: { type: array, items: { type: object, properties: { planting_id: { $ref: '#/components/schemas/Uuid' }, reason: { type: string } } } }

    CheckSeverity: { type: string, enum: [info, warn, error] }

    PlanCheck:
      type: object
      properties:
        year: { type: integer }
        tier: { $ref: '#/components/schemas/GardenTier' }
        results:
          type: array
          items:
            type: object
            properties:
              key: { type: string, examples: ['C3'] }
              severity: { $ref: '#/components/schemas/CheckSeverity' }
              state: { type: string, enum: [pass, fail, no_history, disabled], description: '`no_history` is returned explicitly rather than a pass, so the UI can say "rotation can''t be checked yet — no history" rather than implying everything is fine.' }
              title: { type: string }
              detail: { type: string }
              dismissed: { type: boolean }
              dismissed_note: { type: [string, 'null'] }
              entities: { type: array, items: { type: object, properties: { entity_type: { type: string }, entity_id: { $ref: '#/components/schemas/Uuid' }, label: { type: string } } } }
        counts: { type: object, properties: { error: { type: integer }, warn: { type: integer }, info: { type: integer } } }

    PlantingStatus: { type: string, enum: [planned, sown, growing, harvesting, cleared, failed] }

    Planting:
      type: object
      required: [id, version]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, format: int64 }
        season_year: { type: [integer, 'null'], description: 'Null means a permanent planting. A planting belongs to the **season of its harvest** — garlic sown in October 2026 is a 2027 planting.' }
        bed_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        container_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        location_label: { type: [string, 'null'] }
        crop: { $ref: '#/components/schemas/Crop' }
        variety: { oneOf: [{ $ref: '#/components/schemas/Variety' }, { type: 'null' }] }
        area_m2: { type: [number, 'null'] }
        plant_count: { type: [integer, 'null'] }
        rows: { type: [integer, 'null'] }
        planned:
          type: object
          properties:
            sow_indoor_on: { type: [string, 'null'], format: date }
            sow_direct_on: { type: [string, 'null'], format: date }
            transplant_on: { type: [string, 'null'], format: date }
            harvest_from: { type: [string, 'null'], format: date }
            harvest_to: { type: [string, 'null'], format: date }
        planned_manual: { type: array, items: { type: string }, description: Which planned dates the member set by hand. A re-anchor never clobbers these. }
        actual:
          type: object
          properties:
            sowed_on: { type: [string, 'null'], format: date }
            transplanted_on: { type: [string, 'null'], format: date }
            first_harvest_on: { type: [string, 'null'], format: date }
            cleared_on: { type: [string, 'null'], format: date }
        occupancy_from: { type: [string, 'null'], format: date, description: 'What "shares a bed" means everywhere in the module. Spring spinach and autumn leeks in one bed never meet and must not warn.' }
        occupancy_to: { type: [string, 'null'], format: date }
        status: { $ref: '#/components/schemas/PlantingStatus' }
        notes_md: { type: [string, 'null'] }

    PlantingFields:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        season_year: { type: integer }
        bed_id: { $ref: '#/components/schemas/Uuid' }
        container_id: { $ref: '#/components/schemas/Uuid' }
        location_label: { type: string }
        crop_id: { $ref: '#/components/schemas/Uuid' }
        variety_id: { $ref: '#/components/schemas/Uuid' }
        area_m2: { type: number, description: 'Exactly one of `area_m2` or `plant_count`.' }
        plant_count: { type: integer }
        rows: { type: integer }
        planned: { type: object, additionalProperties: { type: string } }
        notes_md: { type: string }

    PlantingCreate:
      allOf: [{ $ref: '#/components/schemas/PlantingFields' }, { required: [id, crop_id] }]

    PlantingUpdate:
      allOf:
        - { $ref: '#/components/schemas/PlantingFields' }
        - type: object
          properties:
            actual: { type: object, additionalProperties: { type: [string, 'null'] } }
            status: { $ref: '#/components/schemas/PlantingStatus' }

    PlantingDetail:
      allOf:
        - { $ref: '#/components/schemas/Planting' }
        - type: object
          properties:
            resolved_crop: { $ref: '#/components/schemas/CropDetail' }
            tasks: { type: array, items: { $ref: '#/components/schemas/GardenTask' } }
            harvests: { type: array, items: { $ref: '#/components/schemas/Harvest' } }
            expected_yield: { type: [object, 'null'], properties: { quantity: { type: number }, unit: { type: string } } }
            actual_yield: { type: [object, 'null'], properties: { quantity: { type: number }, unit: { type: string } } }
            drift:
              oneOf:
                - { type: 'null' }
                - type: object
                  description: Stated, but never applied automatically — recording an actual date changes no planned window.
                  properties:
                    days: { type: integer }
                    from_field: { type: string }
            photos: { type: array, items: { $ref: '#/components/schemas/GardenPhoto' } }

    PlantingPage:
      type: object
      required: [items, meta]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/Planting' } }, meta: { $ref: '#/components/schemas/PageMeta' } }

    GardenTaskStatus: { type: string, enum: [open, done, skipped] }

    GardenTask:
      type: object
      required: [id, version]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, format: int64 }
        planting_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        bed_code: { type: [string, 'null'] }
        crop_name: { type: [string, 'null'] }
        kind: { type: string, examples: ['transplant'] }
        title: { type: string }
        window_from: { type: string, format: date }
        window_to: { type: string, format: date }
        status: { $ref: '#/components/schemas/GardenTaskStatus' }
        is_generated: { type: boolean }
        is_edited: { type: boolean, description: 'Once set, no regeneration will ever move this task.' }
        completed_by: { oneOf: [{ $ref: '#/components/schemas/ActorRef' }, { type: 'null' }] }
        completed_at: { type: [string, 'null'], format: date-time }
        note: { type: [string, 'null'] }
        position: { type: string }

    GardenTaskCreate:
      type: object
      required: [id, title, window_from, window_to]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        planting_id: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string, description: 'Manual kinds include `water` and `weed`, which are **never generated**.' }
        title: { type: string }
        window_from: { type: string, format: date }
        window_to: { type: string, format: date }
        note: { type: string }

    GardenTaskUpdate:
      type: object
      properties: { title: { type: string }, window_from: { type: string, format: date }, window_to: { type: string, format: date }, status: { $ref: '#/components/schemas/GardenTaskStatus' }, note: { type: [string, 'null'] } }

    GardenTaskPage:
      type: object
      required: [items, meta]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/GardenTask' } }, meta: { $ref: '#/components/schemas/PageMeta' } }

    Harvest:
      type: object
      required: [id]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        planting_id: { $ref: '#/components/schemas/Uuid' }
        harvested_on: { type: string, format: date }
        quantity: { type: number }
        unit: { type: string, description: 'Defaulted from the crop, so the form never asks.' }
        destination: { type: [string, 'null'], enum: [fresh, stored, given_away, compost, null] }
        quality: { type: [string, 'null'] }
        note: { type: [string, 'null'] }
        recorded_by: { $ref: '#/components/schemas/ActorRef' }

    HarvestUpdate:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        planting_id: { $ref: '#/components/schemas/Uuid' }
        harvested_on: { type: string, format: date }
        quantity: { type: number, exclusiveMinimum: 0 }
        unit: { type: string }
        destination: { type: string, enum: [fresh, stored, given_away, compost] }
        quality: { type: string }
        note: { type: string }

    HarvestCreate:
      allOf: [{ $ref: '#/components/schemas/HarvestUpdate' }, { required: [id, planting_id, harvested_on, quantity] }]

    HarvestPage:
      type: object
      required: [items, meta]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Harvest' } }
        season_total_kg: { type: [number, 'null'], description: 'Rows in other units are excluded from the total, and the UI says so.' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    GardenStorageItem:
      type: object
      required: [id, version]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, format: int64 }
        harvest_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        planting_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        product_name: { type: string }
        method: { type: [string, 'null'] }
        location: { type: [string, 'null'] }
        quantity_initial: { type: number }
        quantity_remaining: { type: number }
        unit: { type: string }
        stored_on: { type: string, format: date }
        best_before: { type: [string, 'null'], format: date }
        status: { type: string, enum: [stored, consumed, spoiled] }
        note: { type: [string, 'null'] }

    GardenStorageCreate:
      type: object
      required: [id, product_name, quantity_initial, unit, stored_on]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        harvest_id: { $ref: '#/components/schemas/Uuid' }
        planting_id: { $ref: '#/components/schemas/Uuid' }
        product_name: { type: string }
        method: { type: string }
        location: { type: string }
        quantity_initial: { type: number }
        unit: { type: string }
        stored_on: { type: string, format: date }
        best_before: { type: string, format: date }
        note: { type: string }

    GardenStorageUpdate:
      type: object
      description: Consumption is recorded by editing `quantity_remaining` in place. There is no movements table — the activity log's field diffs already answer "when did we eat the last jar".
      properties:
        quantity_remaining: { type: number }
        location: { type: [string, 'null'] }
        best_before: { type: [string, 'null'], format: date }
        status: { type: string, enum: [stored, consumed, spoiled] }
        note: { type: [string, 'null'] }

    GardenStoragePage:
      type: object
      required: [items, meta]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/GardenStorageItem' } }, meta: { $ref: '#/components/schemas/PageMeta' } }

    GardenRule:
      type: object
      required: [id]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        source: { type: string, enum: [catalog, household] }
        scope: { type: string, enum: [crop_pair, family_pair, succession] }
        relation: { type: string, enum: [companion, antagonist, cross_pollination, succession] }
        a: { type: string, description: 'A crop id or a family name, stored in canonical order and matched both ways so symmetry is structural.' }
        b: { type: string }
        min_years_gap: { type: [integer, 'null'] }
        severity: { $ref: '#/components/schemas/CheckSeverity' }
        enabled: { type: boolean, description: 'A catalog rule can be disabled but not deleted; a household rule can be deleted outright.' }
        note: { type: [string, 'null'] }
        provenance: { type: [string, 'null'] }

    GardenRuleCreate:
      type: object
      required: [id, scope, relation, a, b]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        scope: { type: string, enum: [crop_pair, family_pair, succession] }
        relation: { type: string, enum: [companion, antagonist, cross_pollination, succession] }
        a: { type: string }
        b: { type: string }
        min_years_gap: { type: integer }
        severity: { $ref: '#/components/schemas/CheckSeverity' }
        note: { type: string }

    GardenWeather:
      type: object
      properties:
        fetched_at: { type: [string, 'null'], format: date-time }
        stale: { type: boolean }
        days:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              min_c: { type: number }
              max_c: { type: number }
              precipitation_mm: { type: [number, 'null'] }
        frost_risk_tonight_c: { type: [number, 'null'] }
        frost_warning:
          oneOf:
            - { type: 'null' }
            - type: object
              properties:
                min_c: { type: number }
                affected: { type: array, items: { type: object, properties: { planting_id: { $ref: '#/components/schemas/Uuid' }, crop_name: { type: string }, location: { type: string } } } }
        days_to_first_frost: { type: [integer, 'null'] }
        days_to_last_frost: { type: [integer, 'null'] }

    GardenPhoto:
      type: object
      required: [id]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
