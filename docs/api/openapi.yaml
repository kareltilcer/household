      summary: Approve or decline a redemption
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [approved], properties: { approved: { type: boolean }, note: { type: string } } } } }
      responses:
        '200': { description: Recorded, content: { application/json: { schema: { $ref: '#/components/schemas/ChoreRedemption' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /households/{household_id}/notes:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    get:
      operationId: getNotes
      tags: [notes]
      summary: List or search notes
      description: |
        Language-aware full-text search over title and body with diacritic folding.
        For a non-owner, private notes are excluded from `q` matching **entirely** — a redacted hit
        would still confirm that the term occurs in a private title.
      parameters:
        - { $ref: '#/components/parameters/RootScope' }
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: folder_id, in: query, required: false, schema: { $ref: '#/components/schemas/Uuid' } }
        - { $ref: '#/components/parameters/IncludeArchived' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { description: Notes, content: { application/json: { schema: { $ref: '#/components/schemas/NotePage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      operationId: postNotes
      tags: [notes]
      summary: Create a note
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/NoteCreate' } } }
      responses:
        '201': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Note' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: An unresolvable slug conflict, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/notes/tree:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/RootScope' }, { $ref: '#/components/parameters/IncludeArchived' }]
    get:
      operationId: getNotesTree
      tags: [notes]
      summary: The whole folder tree for a root scope, in one query set
      responses:
        '200': { description: The tree, content: { application/json: { schema: { $ref: '#/components/schemas/NoteTree' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/notes/resolve:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/RootScope' }]
    get:
      operationId: getNotesResolve
      tags: [notes]
      summary: Map a slug path to an id
      description: A renamed or moved item's old path `404`s — there are no redirects.
      parameters: [{ name: path, in: query, required: true, schema: { type: string } }]
      responses:
        '200': { description: Resolved, content: { application/json: { schema: { $ref: '#/components/schemas/ResolveResult' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/notes/{note_id}:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/NoteId' }]
    get:
      operationId: getNotesByNoteId
      tags: [notes]
      summary: One note with its body and breadcrumb
      responses:
        '200': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: The note, content: { application/json: { schema: { $ref: '#/components/schemas/NoteDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    patch:
      operationId: patchNotesByNoteId
      tags: [notes]
      summary: Update a note
      description: |
        Bodies are whole-row last-write-wins. The overwritten version is preserved for 30 days and
        offered on the conflict banner rather than discarded.
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/NoteUpdate' } } }
      responses:
        '200': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/NoteDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      operationId: deleteNotesByNoteId
      tags: [notes]
      summary: Delete a note
      parameters: [{ $ref: '#/components/parameters/Hard' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/notes/{note_id}/move:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/NoteId' }]
    post:
      operationId: postNotesByNoteIdMove
      tags: [notes]
      summary: Reparent or reorder a note
      description: Re-derives the slug only if needed to stay unique in the new parent, which changes the item's URL.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { folder_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }, position: { type: string } } } } }
      responses:
        '200': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Moved, content: { application/json: { schema: { $ref: '#/components/schemas/Note' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/notes/{note_id}/pin:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/NoteId' }]
    put:
      operationId: putNotesByNoteIdPin
      tags: [notes]
      summary: Pin a note
      description: |
        `household` is a shared, audited mutation requiring `contribute`. `personal` is a per-member
        view preference requiring only `view`, and is not audited. Idempotent.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [scope], properties: { scope: { $ref: '#/components/schemas/PinScope' }, position: { type: string } } } } }
      responses:
        '200': { description: Pinned, content: { application/json: { schema: { $ref: '#/components/schemas/PinState' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      operationId: deleteNotesByNoteIdPin
      tags: [notes]
      summary: Unpin a note
      parameters: [{ name: scope, in: query, required: true, schema: { $ref: '#/components/schemas/PinScope' } }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '204': { description: Unpinned }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/notes/{note_id}/images:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/NoteId' }]
    post:
      operationId: postNotesByNoteIdImages
      tags: [notes]
      summary: Upload an inline image
      description: Inherits the note's visibility and counts toward the storage meter.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, required: [file], properties: { file: { type: string, format: binary }, id: { $ref: '#/components/schemas/Uuid' } } }
      responses:
        '201': { description: Uploaded, content: { application/json: { schema: { $ref: '#/components/schemas/NoteImage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { description: Over the size cap, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '415': { description: Not an accepted image type, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '502': { $ref: '#/components/responses/StorageUnavailable' }

  /households/{household_id}/notes/folders:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    post:
      operationId: postNotesFolders
      tags: [notes]
      summary: Create a folder
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/FolderCreate' } } }
      responses:
        '201': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Folder' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: An unresolvable slug conflict, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/notes/folders/{folder_id}:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/FolderId' }]
    patch:
      operationId: patchNotesFoldersByFolderId
      tags: [notes]
      summary: Rename a folder
      description: Renaming updates the slug, which changes the URL of the folder and every descendant.
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/FolderUpdate' } } }
      responses:
        '200': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Folder' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      operationId: deleteNotesFoldersByFolderId
      tags: [notes]
      summary: Delete a folder
      parameters: [{ $ref: '#/components/parameters/Cascade' }, { $ref: '#/components/parameters/Hard' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The folder is not empty; pass `cascade=true`, content: { application/problem+json: { schema: { $ref: '#/components/schemas/NonEmptyProblem' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/notes/folders/{folder_id}/move:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/FolderId' }]
    post:
      operationId: postNotesFoldersByFolderIdMove
      tags: [notes]
      summary: Reparent or reorder a folder
      description: A folder may not move into itself or a descendant.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { parent_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }, position: { type: string } } } } }
      responses:
        '200': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Moved, content: { application/json: { schema: { $ref: '#/components/schemas/Folder' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: 'Cycle guard, or an invalid parent', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ValidationProblem' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/documents:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    get:
      operationId: getDocuments
      tags: [documents]
      summary: List or search documents
      description: Search covers title, original filename and description — **not** file contents. There is no OCR.
      parameters:
        - { $ref: '#/components/parameters/RootScope' }
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: folder_id, in: query, required: false, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: document_type_id, in: query, required: false, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: expiring_before, in: query, required: false, schema: { type: string, format: date } }
        - { $ref: '#/components/parameters/IncludeArchived' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { description: Documents, content: { application/json: { schema: { $ref: '#/components/schemas/DocumentPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      operationId: postDocuments
      tags: [documents]
      summary: Upload a document
      description: |
        The content type is **sniffed from the leading bytes**; the client's `Content-Type` is never
        trusted. Bytes are write-once — a changed file is a new document, optionally linked as a
        successor. The row is written in one transaction with the audit event and the sync change,
        and only after the object lands.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/DocumentUpload' }
      responses:
        '201': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Document' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { description: Over the size cap, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '415': { description: A blocked type, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '502': { $ref: '#/components/responses/StorageUnavailable' }

  /households/{household_id}/documents/tree:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/RootScope' }, { $ref: '#/components/parameters/IncludeArchived' }]
    get:
      operationId: getDocumentsTree
      tags: [documents]
      summary: The whole folder tree for a root scope
      responses:
        '200': { description: The tree, content: { application/json: { schema: { $ref: '#/components/schemas/DocumentTree' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/documents/resolve:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/RootScope' }]
    get:
      operationId: getDocumentsResolve
      tags: [documents]
      summary: Map a slug path to an id
      parameters: [{ name: path, in: query, required: true, schema: { type: string } }]
      responses:
        '200': { description: Resolved, content: { application/json: { schema: { $ref: '#/components/schemas/ResolveResult' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/documents/{document_id}:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/DocumentId' }]
    get:
      operationId: getDocumentsByDocumentId
      tags: [documents]
      summary: Document metadata, breadcrumb, preview state and permanent URLs
      responses:
        '200': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: The document, content: { application/json: { schema: { $ref: '#/components/schemas/DocumentDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    patch:
      operationId: patchDocumentsByDocumentId
      tags: [documents]
      summary: Update metadata — never the bytes
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DocumentUpdate' } } }
      responses:
        '200': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/DocumentDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      operationId: deleteDocumentsByDocumentId
      tags: [documents]
      summary: Delete a document
      description: |
        Soft by default. `hard=true` purges the row and its object-storage variants and requires
        `manage`. A document referenced by another module warns first, naming what points at it.
      parameters: [{ $ref: '#/components/parameters/Hard' }, { name: acknowledge_references, in: query, required: false, schema: { type: boolean, default: false } }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The document is referenced; re-issue with `acknowledge_references=true`, content: { application/problem+json: { schema: { $ref: '#/components/schemas/DocumentReferencedProblem' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/documents/{document_id}/move:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/DocumentId' }]
    post:
      operationId: postDocumentsByDocumentIdMove
      tags: [documents]
      summary: Reparent or reorder a document
      description: Moving never touches object storage — the key is id-based and independent of the folder and slug.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { folder_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }, position: { type: string } } } } }
      responses:
        '200': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Moved, content: { application/json: { schema: { $ref: '#/components/schemas/Document' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/documents/{document_id}/pin:
