packages:
  - apps/*
  - packages/*
  - tooling

# No dependency runs a script as it installs unless it is named here. better-sqlite3, the
# SQLite the conformance suite's PowerSync clients run on (@household/sync), ships a prebuilt
# binary for every platform CI and development use, so the node-gyp build pnpm would infer
# from its binding.gyp, which needs a C++ toolchain, is refused rather than run.
allowBuilds:
  better-sqlite3: false

# react-native is in the workspace for its types alone: @household/sync's React Native build is
# typechecked against them (plan item 18), and nothing here bundles or runs an app yet. Its CLI
# plugin brings Metro, whose file map reaches braces <= 3.0.3 (GHSA-vfj7-8cjw-p6xm, a stack
# exhaustion on deeply nested patterns, with no patched version), so the plugin is left out of the
# install rather than the advisory out of the audit. Plan item 28, which builds the mobile app on
# Metro, removes this line and settles the advisory for a tree that runs it.
overrides:
  'react-native>@react-native/community-cli-plugin': '-'

# One version of every shared tool across the workspace. A package names a tool as
# `catalog:` instead of a range, so two packages cannot drift onto different compilers
# or linters and disagree about what the same source means.
catalog:
  '@eslint/js': ^10.0.1
  '@redocly/cli': 2.54.3
  '@types/node': ^24.0.0
  eslint: ^10.11.0
  prettier: 3.9.9
  # One React across the workspace: @household/sync's React Native build, @household/icons'
  # components and, from items 24 and 28, both apps. react-dom is react's own version.
  react: 19.3.0
  react-dom: 19.3.0
  react-native: 0.87.1
  stylelint: 17.16.0
  # typescript-eslint 8 supports TypeScript <6.1, so TypeScript 7 waits for it.
  typescript: ~6.0.3
  typescript-eslint: ^8.70.1
  vite: ^8.3.1
  vitest: ^5.0.2
  yaml: ^2.9.1

peerDependencyRules:
  allowedVersions:
    # openapi-typescript 7 declares TypeScript ^5, and the workspace is on 6, whose compiler API
    # it uses unchanged: @household/api's generator runs on it and its output typechecks.
    openapi-typescript>typescript: '6'
