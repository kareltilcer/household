      tags: [shopping]
      summary: One list with its items, grouped by the store layout
      responses:
        '200': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: The list, content: { application/json: { schema: { $ref: '#/components/schemas/ShoppingListDetail' } } } }
