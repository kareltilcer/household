      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CalendarCreate' } } }
      responses:
        '201': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Calendar' } } } }
