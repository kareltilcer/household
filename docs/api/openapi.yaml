      responses:
        '200': { description: The bundle, content: { application/json: { schema: { $ref: '#/components/schemas/DiagnosticBundle' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { description: Expired, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /platform/audit:
    get:
      operationId: getPlatformAudit
      tags: [platform]
      summary: The platform audit log — every staff action, append-only
      parameters:
