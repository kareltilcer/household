      summary: The computed allocation for a period
      description: |
        Derived on read from the stored incomes and the plan version effective for that period, and
        **never persisted** — which is what keeps the plan the single source of truth and history
        reproducible when a rule is corrected.

        A negative remainder is returned as computed; clients render it as zero with a footnote.
        Clamping it in the data would break the invariant the rounding scheme exists to protect.
      responses:
        '200': { description: The allocation, content: { application/json: { schema: { $ref: '#/components/schemas/AllocationResult' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No income recorded for that period, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/finance/periods:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    get:
      operationId: getFinancePeriods
      tags: [finance]
      summary: Recorded and missing periods
      description: Names the periods with no income recorded — the actual failure mode is a month nobody entered.
      responses:
        '200': { description: Periods, content: { application/json: { schema: { $ref: '#/components/schemas/FinancePeriodSummary' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/finance/transactions:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    get:
      operationId: getFinanceTransactions
      tags: [finance]
      summary: The unified ledger
      description: Expenses and allocation movements are projections into this table, which is what makes one ledger true rather than three.
      parameters:
        - { name: from, in: query, required: false, schema: { type: string, format: date } }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
        - { name: account_id, in: query, required: false, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: category_id, in: query, required: false, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: kind, in: query, required: false, schema: { $ref: '#/components/schemas/TransactionKind' } }
        - { name: source, in: query, required: false, schema: { $ref: '#/components/schemas/TransactionSource' } }
        - { name: q, in: query, required: false, schema: { type: string } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { description: Transactions, content: { application/json: { schema: { $ref: '#/components/schemas/TransactionPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      operationId: postFinanceTransactions
      tags: [finance]
      summary: Record a transaction or a shared expense
      description: |
        Supplying `shares` makes this a **shared expense**: `equal`, `shares`, `percent`, `exact` or
        `adjustment`. The last minor unit is assigned deterministically in a stable participant
        order, so a three-way split of 10.00 is always the same 3.34 / 3.33 / 3.33.

        An expense may also be marked `settles: false` with no shares — household spending paid from
        a joint account that belongs in the budget and creates no balance.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TransactionCreate' } } }
      responses:
        '201': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/TransactionDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/finance/transactions/{transaction_id}:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/TransactionId' }]
    get:
      operationId: getFinanceTransactionsByTransactionId
      tags: [finance]
      summary: One transaction with its shares
      responses:
        '200': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: The transaction, content: { application/json: { schema: { $ref: '#/components/schemas/TransactionDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    patch:
      operationId: patchFinanceTransactionsByTransactionId
      tags: [finance]
      summary: Update a transaction
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TransactionUpdate' } } }
      responses:
        '200': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/TransactionDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      operationId: deleteFinanceTransactionsByTransactionId
      tags: [finance]
      summary: Delete a transaction
      description: A hard delete whose audit event carries the whole row, so it can be read back and re-entered. Requires `manage`.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/finance/balances:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    get:
      operationId: getFinanceBalances
      tags: [finance]
      summary: Who owes whom
      description: Net per member and pairwise, in the household base currency, converted at each transaction's own stored rate.
      responses:
        '200': { description: Balances, content: { application/json: { schema: { $ref: '#/components/schemas/BalanceReport' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/finance/settlements:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    get:
      operationId: getFinanceSettlements
      tags: [finance]
      summary: Recorded settlements
      parameters: [{ $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' }]
      responses:
        '200': { description: Settlements, content: { application/json: { schema: { $ref: '#/components/schemas/SettlementPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      operationId: postFinanceSettlements
      tags: [finance]
      summary: Record a settlement
      description: |
        Household **never moves money**. This records that a transfer happened; it does not perform
        one. See `/settlements/suggest` for the simplified set of transfers that would clear all
        balances — a suggestion, never automatically applied.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SettlementCreate' } } }
      responses:
        '201': { description: Recorded, content: { application/json: { schema: { $ref: '#/components/schemas/Settlement' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/finance/settlements/suggest:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    get:
      operationId: getFinanceSettlementsSuggest
      tags: [finance]
      summary: The fewest transfers that clear all balances, plus the pairwise list
      description: Both are offered, because some households want to settle only with one person.
      responses:
        '200': { description: Suggestions, content: { application/json: { schema: { $ref: '#/components/schemas/SettlementSuggestions' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/finance/categories:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    get:
      operationId: getFinanceCategories
      tags: [finance]
      summary: The category tree
      responses:
        '200': { description: Categories, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/FinanceCategory' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      operationId: postFinanceCategories
      tags: [finance]
      summary: Create a category
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/FinanceCategoryCreate' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/FinanceCategory' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/finance/categories/{category_id}:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { name: category_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }]
    patch:
      operationId: patchFinanceCategoriesByCategoryId
      tags: [finance]
      summary: Update a category
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/FinanceCategoryUpdate' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/FinanceCategory' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      operationId: deleteFinanceCategoriesByCategoryId
      tags: [finance]
      summary: Delete a category
      parameters: [{ name: reassign_to, in: query, required: false, schema: { $ref: '#/components/schemas/Uuid' } }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The category is in use; supply `reassign_to`, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/finance/budgets:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    get:
      operationId: getFinanceBudgets
      tags: [finance]
      summary: Budgets for a period, with actual, remaining and a projection
      parameters: [{ name: period, in: query, required: false, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }]
      responses:
        '200': { description: Budgets, content: { application/json: { schema: { $ref: '#/components/schemas/BudgetReport' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    put:
      operationId: putFinanceBudgets
      tags: [finance]
      summary: Set budgets for a period
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BudgetSetRequest' } } }
      responses:
        '200': { description: Set, content: { application/json: { schema: { $ref: '#/components/schemas/BudgetReport' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/finance/recurring:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    get:
      operationId: getFinanceRecurring
      tags: [finance]
      summary: Recurring bills and subscriptions
      parameters: [{ name: status, in: query, required: false, schema: { type: string, enum: [active, paused, cancelled] } }]
      responses:
        '200': { description: Recurring items, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/RecurringItem' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      operationId: postFinanceRecurring
      tags: [finance]
      summary: Define a recurring bill or subscription
      description: |
        `cancellation_notice_days` produces a reminder that far ahead of the renewal — the moment at
        which cancelling is still possible, which is the only moment the reminder is worth anything.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RecurringItemCreate' } } }
      responses:
        '201': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/RecurringItem' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/finance/recurring/{recurring_id}:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { name: recurring_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }]
    get:
      operationId: getFinanceRecurringByRecurringId
      tags: [finance]
      summary: One recurring item with its price history
      description: '"Netflix has gone up three times in two years" is a thing this module can answer and almost nothing else can.'
      responses:
        '200': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: The item, content: { application/json: { schema: { $ref: '#/components/schemas/RecurringItemDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    patch:
      operationId: patchFinanceRecurringByRecurringId
      tags: [finance]
      summary: Update a recurring item
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RecurringItemUpdate' } } }
      responses:
        '200': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/RecurringItem' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      operationId: deleteFinanceRecurringByRecurringId
      tags: [finance]
      summary: Delete a recurring item
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/finance/recurring/{recurring_id}/confirm:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { name: recurring_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }]
    post:
      operationId: postFinanceRecurringByRecurringIdConfirm
      tags: [finance]
      summary: Confirm a due occurrence as a real transaction
      description: |
        Recurring items are **never posted automatically** — a subscription that silently posts a
        wrong amount is a ledger nobody trusts. When the confirmed amount differs, `price_change`
        records whether this is a one-off or the new price.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RecurringConfirm' } } }
      responses:
        '201': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Posted, content: { application/json: { schema: { $ref: '#/components/schemas/TransactionDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/finance/imports/mappings:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    get:
      operationId: getFinanceImportsMappings
      tags: [finance]
      summary: Saved import mappings
      description: A named mapping means the next statement from the same bank takes one click.
      responses:
        '200': { description: Mappings, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/ImportMapping' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      operationId: postFinanceImportsMappings
      tags: [finance]
      summary: Save an import mapping
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ImportMappingCreate' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/ImportMapping' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/finance/imports:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    post:
      operationId: postFinanceImports
      tags: [finance]
      summary: Upload a statement — CSV in any delimiter and encoding, or camt.053 XML
      description: |
        `dry_run=true` returns the parsed rows, the proposed categorisation and the **suspected
        duplicates**, which are shown for confirmation and never silently dropped nor silently
        imported. Deduplication is by a hash of account, date, amount and normalised description,
        plus the bank's own reference where present.
      parameters: [{ name: dry_run, in: query, required: false, schema: { type: boolean, default: true } }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/ImportRequest' }
      responses:
        '200': { description: Preview or result, content: { application/json: { schema: { $ref: '#/components/schemas/ImportResult' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { description: Over the size cap, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/finance/rules:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    get:
      operationId: getFinanceRules
      tags: [finance]
      summary: Categorisation rules
      description: Member-authored and deliberately simple — if the description contains X, set category Y. Not machine learning.
      responses:
        '200': { description: Rules, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/FinanceRule' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      operationId: postFinanceRules
      tags: [finance]
      summary: Create a categorisation rule
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/FinanceRuleCreate' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/FinanceRule' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/finance/rules/{rule_id}:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { name: rule_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }]
    delete:
      operationId: deleteFinanceRulesByRuleId
      tags: [finance]
      summary: Delete a rule
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/finance/rules/apply:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    post:
      operationId: postFinanceRulesApply
      tags: [finance]
      summary: Re-apply the rules to historic transactions
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: false
        content: { application/json: { schema: { type: object, properties: { from: { type: string, format: date }, to: { type: string, format: date }, only_uncategorised: { type: boolean, default: true }, dry_run: { type: boolean, default: true } } } } }
      responses:
        '200': { description: 'What changed, or would change', content: { application/json: { schema: { $ref: '#/components/schemas/BulkResult' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/finance/fx-rates:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    get:
      operationId: getFinanceFxRates
      tags: [finance]
      summary: Suggested reference rates for a date
      description: |
        From the European Central Bank reference set, EUR-based and cross-computed. Offered as a
        suggestion the member accepts or overrides; the accepted value is then **stored on the
        transaction row**, so historic totals never move when rates change.
      parameters:
        - { name: on_date, in: query, required: true, schema: { type: string, format: date } }
        - { name: from, in: query, required: true, schema: { type: string, pattern: '^[A-Z]{3}$' } }
        - { name: to, in: query, required: true, schema: { type: string, pattern: '^[A-Z]{3}$' } }
      responses:
        '200': { description: The rate, content: { application/json: { schema: { $ref: '#/components/schemas/FxRate' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No reference rate for that pair and date, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }
  /households/{household_id}/utilities/presets:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    get:
      operationId: getUtilitiesPresets
      tags: [utilities]
      summary: Country and commodity tariff presets
      description: |
        Versioned reference **data**, not code — a country's billing arrangement changing must be a
        data update, and a missing preset must be addable without a release. `custom` always exists
        as the fallback, so no household is ever blocked by a missing preset.

        A preset creates the meter, its registers, and a tariff skeleton with the right component
        types in the right order and empty values, labelled with the words that appear on that
        country's bill.
      parameters:
        - { name: country, in: query, required: false, schema: { $ref: '#/components/schemas/CountryCode' } }
        - { name: commodity, in: query, required: false, schema: { $ref: '#/components/schemas/Commodity' } }
      responses:
        '200': { description: Presets, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/UtilityPreset' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/utilities/services:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    get:
      operationId: getUtilitiesServices
      tags: [utilities]
      summary: List services
      responses:
        '200': { description: Services, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/UtilityService' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      operationId: postUtilitiesServices
      tags: [utilities]
      summary: Create a service, optionally from a preset
      description: |
        A service declares its own **mode** — `bills_only`, `readings` or `full` — and a household
        may run different modes for different services, because the gas contract and the internet
        bill are genuinely different relationships. Upgrading a mode never loses or re-enters
        anything already recorded.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UtilityServiceCreate' } } }
      responses:
        '201': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/UtilityServiceDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/utilities/services/{service_id}:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/ServiceId' }]
    get:
      operationId: getUtilitiesServicesByServiceId
      tags: [utilities]
      summary: One service with its meters, registers and current tariff
      responses:
        '200': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: The service, content: { application/json: { schema: { $ref: '#/components/schemas/UtilityServiceDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    patch:
      operationId: patchUtilitiesServicesByServiceId
      tags: [utilities]
      summary: Update a service, including changing its mode
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UtilityServiceUpdate' } } }
      responses:
        '200': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/UtilityServiceDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      operationId: deleteUtilitiesServicesByServiceId
      tags: [utilities]
      summary: Delete a service and everything under it
      parameters: [{ $ref: '#/components/parameters/Cascade' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The service has data; pass `cascade=true`, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/utilities/services/{service_id}/meters:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/ServiceId' }]
    post:
      operationId: postUtilitiesServicesByServiceIdMeters
      tags: [utilities]
      summary: Add a meter with its registers
      description: |
        **Registers are data, not a fixed pair.** A single-rate meter has one; a Czech two-tariff
        meter has two; a three-rate time-of-use meter has three; a household with solar has an
        import register and an export register.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MeterCreate' } } }
      responses:
        '201': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Meter' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/utilities/meters/{meter_id}:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/MeterId' }]
    get:
      operationId: getUtilitiesMetersByMeterId
      tags: [utilities]
      summary: One meter
      responses:
        '200': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: The meter, content: { application/json: { schema: { $ref: '#/components/schemas/Meter' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    patch:
      operationId: patchUtilitiesMetersByMeterId
      tags: [utilities]
      summary: Update a meter
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MeterUpdate' } } }
      responses:
        '200': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Meter' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/utilities/meters/{meter_id}/replace:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/MeterId' }]
    post:
      operationId: postUtilitiesMetersByMeterIdReplace
      tags: [utilities]
      summary: Replace a meter
      description: |
        Closes the meter with a final reading and opens a successor with an initial one on the same
        date. The interval across the swap computes as `(final − previous) + (current − initial)`.
        Without this, a household whose meter is replaced has a broken module and no way out.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MeterReplacement' } } }
      responses:
        '201': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Replaced, content: { application/json: { schema: { $ref: '#/components/schemas/Meter' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/utilities/meters/{meter_id}/conversions:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/MeterId' }]
    get:
      operationId: getUtilitiesMetersByMeterIdConversions
      tags: [utilities]
      summary: Unit conversions, versioned by effective date
      description: |
        Gas meters read m³ and gas is billed in kWh via a **volume correction factor** and a
        **calorific value** — both change, both appear on the invoice, and both differ by country.
        A conversion that is a constant in the code is a module that is wrong somewhere.
      responses:
        '200': { description: Conversions, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/MeterConversion' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      operationId: postUtilitiesMetersByMeterIdConversions
      tags: [utilities]
      summary: Add a conversion version
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MeterConversionCreate' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/MeterConversion' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: A conversion already starts on that date, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/utilities/meters/{meter_id}/readings:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/MeterId' }]
    get:
      operationId: getUtilitiesMetersByMeterIdReadings
      tags: [utilities]
      summary: Readings, newest first
      parameters:
        - { name: from, in: query, required: false, schema: { type: string, format: date } }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/DateCursor' }
      responses:
        '200': { description: Readings, content: { application/json: { schema: { $ref: '#/components/schemas/ReadingPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      operationId: postUtilitiesMetersByMeterIdReadings
      tags: [utilities]
      summary: Record a reading
      description: |
        A reading is the meter state at 00:00 of `read_on`, and it is an **observation of a moment**
        — the offline merge policy is `additive`, so a reading taken in a cellar with no signal
        cannot conflict with anything.

        Values must not decrease, validated against the neighbouring readings on **both** sides so
        a back-filled reading cannot break the chain either. A drop of roughly `10^digits` is
        offered as a rollover rather than refused. `source: estimated` readings are marked and
        **excluded from every money figure** — money is never interpolated; pictures may be.

        Requires only `contribute`: reading the meter is the one action a household wants everybody
        able to do.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReadingCreate' } } }
      responses:
        '201': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Reading' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: A reading already exists on that date, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: A register would decrease; the problem names the offending neighbour, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ReadingValidationProblem' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/utilities/readings/{reading_id}:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { name: reading_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }]
    patch:
      operationId: patchUtilitiesReadingsByReadingId
      tags: [utilities]
      summary: Correct a reading
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReadingUpdate' } } }
      responses:
        '200': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Reading' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { description: Would break monotonicity, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ReadingValidationProblem' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      operationId: deleteUtilitiesReadingsByReadingId
      tags: [utilities]
      summary: Delete a reading
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/utilities/services/{service_id}/tariffs:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/ServiceId' }]
    get:
      operationId: getUtilitiesServicesByServiceIdTariffs
      tags: [utilities]
      summary: Tariff versions with their components
      description: A version governs every day from `effective_from` until the next begins. **There is no `effective_to` column** — the end is derived, because a stored end is a second source of truth that eventually contradicts the next row's start.
      responses:
        '200': { description: Versions, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/TariffVersion' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      operationId: postUtilitiesServicesByServiceIdTariffs
      tags: [utilities]
      summary: Create a tariff version
      description: |
        An **ordered list of typed components**. There is no formula language and no user-written
        expression: a typed, ordered list covers every arrangement in the target markets, is
        validatable, renders as a human-readable breakdown, and is not a code-injection surface.

        A **future** `effective_from` is the normal case — next January's prices entered in August
        immediately show their effect in the forecast.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TariffVersionCreate' } } }
      responses:
        '201': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/TariffVersion' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: A version already starts on that date, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/utilities/tariffs/{tariff_id}:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/TariffId' }]
    get:
      operationId: getUtilitiesTariffsByTariffId
      tags: [utilities]
      summary: One tariff version
      responses:
        '200': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: The version, content: { application/json: { schema: { $ref: '#/components/schemas/TariffVersion' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    patch:
      operationId: patchUtilitiesTariffsByTariffId
      tags: [utilities]
      summary: Update a tariff version
      description: Editing a version's components moves **only its own days**. This is the structural form of "effective from a date, which does not affect numbers before it".
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TariffVersionUpdate' } } }
      responses:
        '200': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/TariffVersion' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      operationId: deleteUtilitiesTariffsByTariffId
      tags: [utilities]
      summary: Delete a tariff version
      description: Deleting a middle version is a legitimate repricing. Refused only when it would leave a day inside a billing period with no effective version.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Would leave a day in a billing period unpriced, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/utilities/services/{service_id}/advance-schedules:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/ServiceId' }]
    get:
      operationId: getUtilitiesServicesByServiceIdAdvanceSchedules
      tags: [utilities]
      summary: Advance schedule versions
      responses:
        '200': { description: Versions, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/AdvanceSchedule' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      operationId: postUtilitiesServicesByServiceIdAdvanceSchedules
      tags: [utilities]
      summary: Add an advance schedule version
      description: Versioned exactly like a tariff. `due_day` is 1–31 and is **clamped to the month's last day at read time, never stored clamped**.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AdvanceScheduleCreate' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/AdvanceSchedule' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: A version already starts on that date, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/utilities/advance-schedules/{schedule_id}:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { name: schedule_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }]
    patch:
      operationId: patchUtilitiesAdvanceSchedulesByScheduleId
      tags: [utilities]
      summary: Update an advance schedule version
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AdvanceScheduleUpdate' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/AdvanceSchedule' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      operationId: deleteUtilitiesAdvanceSchedulesByScheduleId
      tags: [utilities]
      summary: Delete an advance schedule version
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/utilities/services/{service_id}/payments:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/ServiceId' }]
    get:
      operationId: getUtilitiesServicesByServiceIdPayments
      tags: [utilities]
      summary: Recorded advance payments
      parameters: [{ $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/DateCursor' }]
      responses:
        '200': { description: Payments, content: { application/json: { schema: { $ref: '#/components/schemas/AdvancePaymentPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      operationId: postUtilitiesServicesByServiceIdPayments
      tags: [utilities]
      summary: Record an advance payment
      description: |
        A recorded payment **wins over the schedule for its month**, so the common case is zero
        typing and the month that differed is one row. Attribution is by the `period` key, not by
        `paid_on` — a March advance paid on 2 April still belongs to March.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AdvancePaymentCreate' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/AdvancePayment' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: A payment is already recorded for that month, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/utilities/payments/{payment_id}:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { name: payment_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }]
    patch:
      operationId: patchUtilitiesPaymentsByPaymentId
      tags: [utilities]
      summary: Update a payment
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AdvancePaymentUpdate' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/AdvancePayment' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      operationId: deleteUtilitiesPaymentsByPaymentId
      tags: [utilities]
      summary: Delete a payment
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/utilities/services/{service_id}/periods:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/ServiceId' }]
    get:
      operationId: getUtilitiesServicesByServiceIdPeriods
      tags: [utilities]
      summary: Billing periods
      responses:
        '200': { description: Periods, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/BillingPeriod' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      operationId: postUtilitiesServicesByServiceIdPeriods
      tags: [utilities]
      summary: Create a billing period
      description: |
        User-set, inclusive and non-overlapping. When `ends_on` is omitted it defaults to one year
        minus a day with `ends_on_confirmed: false`, badged *estimated* — suppliers frequently do
        not state an end date in advance, and a prediction has to project somewhere.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BillingPeriodCreate' } } }
      responses:
        '201': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/BillingPeriod' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: 'Overlaps an existing period, or ends before it starts', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ValidationProblem' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/utilities/periods/{period_id}:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/PeriodId' }]
    patch:
      operationId: patchUtilitiesPeriodsByPeriodId
      tags: [utilities]
      summary: Update a period, or record its settlement invoice
      description: |
        Recording the invoice stores the supplier's total, their balance, **and their final meter
        values per register** — so a discrepancy can be attributed to consumption rather than only
        to money, which is how an estimated reading on the supplier's side becomes visible instead
        of looking like a pricing surprise.
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BillingPeriodUpdate' } } }
      responses:
        '200': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/BillingPeriod' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      operationId: deleteUtilitiesPeriodsByPeriodId
      tags: [utilities]
      summary: Delete a period
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/utilities/services/{service_id}/summary:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/ServiceId' }]
    get:
      operationId: getUtilitiesServicesByServiceIdSummary
      tags: [utilities]
      summary: The overview for a billing period — cost, balance, forecast, recommended advance, headroom
      description: |
        Computed on read from the stored inputs; nothing here is cached or stored.

        The boundary between fact and forecast is the **latest reading, not today** — days since the
        last reading are forecast like any other future day, which is what keeps "actual" meaning
        measured. Each future day is priced by the tariff effective on that day.

        **`cost_total` and `balance` are nullable and absent — never zero — in an
        `insufficient_data` or `blocked` state.** "The module never shows a number it has not
        earned" is a property of the type, not a rule each screen has to remember.

        `headroom` is computable with zero consumption data, which is why it is what the overview
        leads with on day one.
      parameters:
        - { name: period_id, in: query, required: false, schema: { $ref: '#/components/schemas/Uuid' }, description: Defaults to the period containing today. }
      responses:
        '200': { description: The summary, content: { application/json: { schema: { $ref: '#/components/schemas/UtilitySummary' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No billing period contains today; the first-run state is 'create a period', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/utilities/services/{service_id}/intervals:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/ServiceId' }]
    get:
      operationId: getUtilitiesServicesByServiceIdIntervals
      tags: [utilities]
      summary: Priced intervals between consecutive readings
      description: |
        An interval whose interior contains a tariff `effective_from` is **not priced**. It is
        reported under `blocking` with the exact date a reading must carry, nothing is computed from
        that date onward, and everything before the gap stays valid and visible. The client opens
        the reading form pre-filled with that date and **no estimated value**.
      parameters:
        - { name: period_id, in: query, required: false, schema: { $ref: '#/components/schemas/Uuid' } }
      responses:
        '200': { description: Intervals and blocks, content: { application/json: { schema: { $ref: '#/components/schemas/IntervalReport' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/utilities/services/{service_id}/history:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/ServiceId' }]
    get:
      operationId: getUtilitiesServicesByServiceIdHistory
      tags: [utilities]
      summary: Consumption and cost per month, plus past periods computed against invoiced
      description: |
        Every month carries `is_approximate`, true whenever a contributing interval crosses the
        month boundary — monthly consumption is approximate by construction and pretending otherwise
        is a lie the chart tells.
      parameters:
        - { name: from, in: query, required: false, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }
        - { name: to, in: query, required: false, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }
      responses:
        '200': { description: History, content: { application/json: { schema: { $ref: '#/components/schemas/UtilityHistory' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/utilities/services/{service_id}/bills:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/ServiceId' }]
    get:
      operationId: getUtilitiesServicesByServiceIdBills
      tags: [utilities]
      summary: Recorded bills — the whole of `bills_only` mode
      parameters: [{ $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/DateCursor' }]
      responses:
        '200': { description: Bills, content: { application/json: { schema: { $ref: '#/components/schemas/UtilityBillPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      operationId: postUtilitiesServicesByServiceIdBills
      tags: [utilities]
      summary: Record a bill
      description: |
        Spend history, year-on-year comparison, payment reminders and price-change detection, with
