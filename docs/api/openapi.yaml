          properties:
            feeding: { $ref: '#/components/schemas/PetFeeding' }
            vet: { oneOf: [{ $ref: '#/components/schemas/PetVet' }, { type: 'null' }] }
            insurance: { oneOf: [{ $ref: '#/components/schemas/InsurancePolicy' }, { type: 'null' }] }
            schedules: { type: array, items: { $ref: '#/components/schemas/ServiceSchedule' } }
            active_medications: { type: array, items: { $ref: '#/components/schemas/PetMedication' } }
            today: { $ref: '#/components/schemas/PetRoutineDay' }
            weight_series: { type: array, items: { type: object, properties: { date: { type: string, format: date }, value: { type: number }, unit: { type: string } } } }
            annual_cost: { $ref: '#/components/schemas/Money' }
            documents: { type: array, items: { $ref: '#/components/schemas/DocumentRef' } }

    PetHealthEntryType:
      type: string
      enum: [vaccination, treatment, condition, procedure, weight, note]

    PetHealthEntry:
      type: object
      required: [id]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        pet_id: { $ref: '#/components/schemas/Uuid' }
        type: { $ref: '#/components/schemas/PetHealthEntryType' }
        occurred_on: { type: string, format: date }
        title: { type: string }
        detail: { type: [string, 'null'] }
        vaccine: { type: [string, 'null'] }
        batch: { type: [string, 'null'] }
        next_due_on: { type: [string, 'null'], format: date }
        dose: { type: [string, 'null'] }
        value: { type: [number, 'null'] }
        unit: { type: [string, 'null'] }
        ongoing: { type: [boolean, 'null'] }
        cost: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        vet_name: { type: [string, 'null'] }
        documents: { type: array, items: { $ref: '#/components/schemas/DocumentRef' } }
        recorded_by: { $ref: '#/components/schemas/ActorRef' }

    PetHealthEntryUpdate:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        type: { $ref: '#/components/schemas/PetHealthEntryType' }
        occurred_on: { type: string, format: date }
        title: { type: string }
        detail: { type: string }
        vaccine: { type: string }
        batch: { type: string }
        next_due_on: { type: string, format: date }
        dose: { type: string }
        value: { type: number }
        unit: { type: string }
        ongoing: { type: boolean }
        cost: { $ref: '#/components/schemas/Money' }
        vet_name: { type: string }
        document_ids: { type: array, items: { $ref: '#/components/schemas/Uuid' } }

    PetHealthEntryCreate:
      allOf: [{ $ref: '#/components/schemas/PetHealthEntryUpdate' }, { required: [id, type, occurred_on, title] }]

    PetHealthPage:
      type: object
      required: [items, meta]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/PetHealthEntry' } }, meta: { $ref: '#/components/schemas/PageMeta' } }

    PetMedication:
      type: object
      required: [id, version]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, format: int64 }
        pet_id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        dose: { type: string }
        times_per_day: { type: integer }
        times_of_day: { type: array, items: { type: string, pattern: '^\d{2}:\d{2}$' } }
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date }
        note: { type: [string, 'null'] }
        status: { type: string, enum: [active, completed, stopped] }
        doses: { type: array, items: { $ref: '#/components/schemas/PetMedicationDose' } }
        progress: { type: object, properties: { given: { type: integer }, total: { type: integer } } }

    PetMedicationFields:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        dose: { type: string }
        times_per_day: { type: integer, minimum: 1, maximum: 12 }
        times_of_day: { type: array, items: { type: string } }
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date }
        note: { type: string }

    PetMedicationCreate:
      allOf: [{ $ref: '#/components/schemas/PetMedicationFields' }, { required: [id, name, dose, times_per_day, starts_on, ends_on] }]

    PetMedicationUpdate:
      allOf: [{ $ref: '#/components/schemas/PetMedicationFields' }, { type: object, properties: { status: { type: string, enum: [active, completed, stopped] } } }]

    PetMedicationDose:
      type: object
      required: [id]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        medication_id: { $ref: '#/components/schemas/Uuid' }
        due_at: { type: string, format: date-time }
        given: { type: boolean }
        given_by: { oneOf: [{ $ref: '#/components/schemas/ActorRef' }, { type: 'null' }], description: 'Completion is **shared** — anyone can record a dose and everyone sees it, because "did you already give it" must have one answer.' }
        given_at: { type: [string, 'null'], format: date-time }
        note: { type: [string, 'null'] }

    PetRoutineItem:
      type: object
      required: [id]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        pet_id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        kind: { type: string, enum: [feed, walk, litter, medication, other] }
        times_per_day: { type: integer }
        assigned_to: { oneOf: [{ $ref: '#/components/schemas/ActorRef' }, { type: 'null' }] }
        position: { type: string }
        active: { type: boolean }

    PetRoutineItemCreate:
      type: object
      required: [id, name, kind]
      properties: { id: { $ref: '#/components/schemas/Uuid' }, name: { type: string }, kind: { type: string, enum: [feed, walk, litter, medication, other] }, times_per_day: { type: integer, default: 1 }, assigned_to: { $ref: '#/components/schemas/Uuid' }, position: { type: string } }

    PetRoutineCompletion:
      type: object
      properties:
        item_id: { $ref: '#/components/schemas/Uuid' }
        for_date: { type: string, format: date }
        done: { type: boolean }
        by: { oneOf: [{ $ref: '#/components/schemas/ActorRef' }, { type: 'null' }] }
        at: { type: [string, 'null'], format: date-time }

    PetRoutineDay:
      type: object
      properties:
        for_date: { type: string, format: date }
        items:
          type: array
          items:
            allOf:
              - { $ref: '#/components/schemas/PetRoutineItem' }
              - type: object
                properties:
                  completions: { type: array, items: { $ref: '#/components/schemas/PetRoutineCompletion' } }
        doses_due: { type: array, items: { $ref: '#/components/schemas/PetMedicationDose' } }

    PetVet:
      type: object
      properties:
        practice: { type: string }
        phone: { type: [string, 'null'] }
        out_of_hours_phone: { type: [string, 'null'], description: 'On the pet''s screen, one tap from the top, because that is the moment it is needed.' }
        address: { type: [string, 'null'] }
        email: { type: [string, 'null'] }
        note: { type: [string, 'null'] }

    PetVetUpsert:
      $ref: '#/components/schemas/PetVet'

    Conversation:
      type: object
      required: [id, version]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, format: int64 }
        kind: { type: string, enum: [general, group, direct] }
        name: { type: [string, 'null'] }
        icon: { type: [string, 'null'] }
        member_count: { type: integer }
        unread_count: { type: integer }
        muted: { type: boolean }
        last_message:
          oneOf:
            - { type: 'null' }
            - { $ref: '#/components/schemas/Message' }
          description: '**Bounded by the caller''s floor.** Null both for a room nobody has written in and for a member whose floor sits above everything written so far.'
        deleted_at: { type: [string, 'null'], format: date-time }

    ConversationCreate:
      type: object
      required: [id, member_ids]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        icon: { type: string }
        member_ids: { type: array, minItems: 1, items: { $ref: '#/components/schemas/Uuid' } }

    ConversationDetail:
      allOf:
        - { $ref: '#/components/schemas/Conversation' }
        - type: object
          properties:
            members: { type: array, items: { $ref: '#/components/schemas/ConversationMember' } }
            my_floor_message_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
            attachment_bytes: { type: integer, format: int64 }

    ConversationMember:
      type: object
      properties:
        user: { $ref: '#/components/schemas/ActorRef' }
        joined_at: { type: string, format: date-time }
        effective_from_message_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'The **floor** — a member added today should not be handed the household''s back catalogue.' }
        last_read_message_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        unread_count: { type: integer }

    Message:
      type: object
      required: [id]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        conversation_id: { $ref: '#/components/schemas/Uuid' }
        author: { $ref: '#/components/schemas/ActorRef' }
        body: { type: [string, 'null'] }
        sent_at: { type: string, format: date-time }
        edited_at: { type: [string, 'null'], format: date-time }
        deleted: { type: boolean }
        reply_to_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        mentions: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
        attachments: { type: array, items: { $ref: '#/components/schemas/ChatAttachment' } }
        reactions:
          type: array
          description: |
            Carries **no `mine` and no `count`**, and must not grow either. The realtime frame is
            marshalled once for the whole audience, so a per-recipient field is right for at most one
            recipient; and a count beside a list is a second spelling of the list's length that can
            disagree with it. Every client answers both questions locally.
          items:
            type: object
            properties:
              emoji: { type: string }
              by: { type: array, items: { $ref: '#/components/schemas/ActorRef' } }

    MessageCreate:
      type: object
      required: [id]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        body: { type: string }
        reply_to_id: { $ref: '#/components/schemas/Uuid' }
        mentions: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
        attachment_ids: { type: array, items: { $ref: '#/components/schemas/Uuid' } }

    MessagePage:
      type: object
      required: [items, meta]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/Message' } }, meta: { $ref: '#/components/schemas/PageMeta' } }

    ChatAttachment:
      type: object
      required: [id]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        content_type: { type: string }
        byte_size: { type: integer, format: int64 }
        filename: { type: string }
        width: { type: [integer, 'null'] }
        height: { type: [integer, 'null'] }
        duration_seconds: { type: [number, 'null'] }
        thumbnail_available: { type: boolean }
        moved_to_document_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'Set after a custody transfer to Documents — the bytes moved, and the household stops paying for them twice.' }

    ChatAttachmentUpload:
      type: object
      required: [file]
      properties:
        file: { type: string, format: binary }
        id: { $ref: '#/components/schemas/Uuid' }

    ChatStorage:
      type: object
      properties:
        total_bytes: { type: integer, format: int64 }
        warn_threshold_bytes: { type: integer, format: int64 }
        critical_threshold_bytes: { type: integer, format: int64 }
        by_conversation: { type: array, items: { type: object, properties: { conversation_id: { $ref: '#/components/schemas/Uuid' }, name: { type: [string, 'null'] }, bytes: { type: integer, format: int64 }, attachment_count: { type: integer } } } }
        largest: { type: array, items: { type: object, properties: { attachment_id: { $ref: '#/components/schemas/Uuid' }, filename: { type: string }, bytes: { type: integer, format: int64 }, sent_at: { type: string, format: date-time }, conversation_id: { $ref: '#/components/schemas/Uuid' } } } }
        oldest: { type: array, items: { type: object, properties: { attachment_id: { $ref: '#/components/schemas/Uuid' }, filename: { type: string }, bytes: { type: integer, format: int64 }, sent_at: { type: string, format: date-time } } } }
