    get:
      operationId: getCalendarConnectionsByConnectionId
      tags: [calendar]
      summary: One connection with its health and remote calendar list
      responses:
        '200': { description: The connection, content: { application/json: { schema: { $ref: '#/components/schemas/CalendarConnectionDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      operationId: deleteCalendarConnectionsByConnectionId
      tags: [calendar]
      summary: Disconnect
      description: |
        `on_mirrored_events` decides what happens to events already imported — keep them as ordinary
        Household events, or remove them. Defaulting to either without asking is wrong in half the cases.
      parameters:
        - { name: on_mirrored_events, in: query, required: true, schema: { type: string, enum: [keep, remove] } }
