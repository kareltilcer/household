      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/garden/beds:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    get:
      operationId: getGardenBeds
      tags: [garden]
      summary: Beds, ordered within zones
      description: |
        **The order within a zone is the adjacency model**: two beds are neighbours iff they are
        consecutive in the same zone. Dragging beds into the order they physically stand in is the
        whole of the data entry, and it makes adjacency checks possible without a coordinate system.
      responses:
        '200': { description: Beds, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Bed' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      operationId: postGardenBeds
      tags: [garden]
      summary: Create a bed
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BedCreate' } } }
      responses:
        '201': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Bed' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/garden/beds/{bed_id}:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/BedId' }]
    patch:
      operationId: patchGardenBedsByBedId
      tags: [garden]
      summary: Update a bed
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BedUpdate' } } }
      responses:
        '200': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Bed' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      operationId: deleteGardenBedsByBedId
      tags: [garden]
      summary: Delete a bed
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The bed has plantings in an open season, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/garden/beds/{bed_id}/move:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/BedId' }]
    post:
      operationId: postGardenBedsByBedIdMove
      tags: [garden]
      summary: Reorder a bed within its zone — this changes adjacency
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { zone: { type: string }, position: { type: string } } } } }
      responses:
        '200': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Moved, content: { application/json: { schema: { $ref: '#/components/schemas/Bed' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/garden/beds/{bed_id}/history:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/BedId' }]
    get:
      operationId: getGardenBedsByBedIdHistory
      tags: [garden]
      summary: Which family occupied this bed in each closed season
      description: The read model behind the rotation column in the planner and behind checks C3 and C8.
      responses:
        '200': { description: History, content: { application/json: { schema: { $ref: '#/components/schemas/BedHistory' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/garden/seasons:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    get:
      operationId: getGardenSeasons
      tags: [garden]
      summary: Seasons — the `plot` tier
      responses:
        '200': { description: Seasons, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Season' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      operationId: postGardenSeasons
      tags: [garden]
      summary: Create a season, optionally by copying a previous year with a rotation shift
      description: |
        Copying rotates bed assignments by an offset over the ordered active beds — per planting or
        per family block, so a family moves together — then re-anchors planned dates against the new
        season's frost dates: frost-anchored windows move, week-anchored windows stay.

        **`dry_run=true` returns the whole prospective season plus its check without persisting.**
        The member sees what the shift fixed and what it broke, side by side, *before* the season
        exists — a copy that silently reproduces last year's rotation error is worse than typing the
        year in by hand.
      parameters: [{ name: dry_run, in: query, required: false, schema: { type: boolean, default: false } }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SeasonCreate' } } }
      responses:
        '200': { description: The prospective season and its check (dry run), content: { application/json: { schema: { $ref: '#/components/schemas/SeasonPreview' } } } }
        '201': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Season' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: That year already exists, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/garden/seasons/{year}:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/SeasonYear' }]
    get:
      operationId: getGardenSeasonsByYear
      tags: [garden]
      summary: One season
      responses:
        '200': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: The season, content: { application/json: { schema: { $ref: '#/components/schemas/Season' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    patch:
      operationId: patchGardenSeasonsByYear
      tags: [garden]
      summary: Update a season's frost dates or notes
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SeasonUpdate' } } }
      responses:
        '200': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Season' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The season is closed, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/garden/seasons/{year}/close:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/SeasonYear' }]
    post:
      operationId: postGardenSeasonsByYearClose
      tags: [garden]
      summary: Close a season — it becomes rotation history
      description: Collects final yields, failures and observed frost dates. Requires `manage`.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SeasonCloseRequest' } } }
      responses:
        '200': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Closed, content: { application/json: { schema: { $ref: '#/components/schemas/Season' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Already closed, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/garden/seasons/{year}/reopen:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/SeasonYear' }]
    post:
      operationId: postGardenSeasonsByYearReopen
      tags: [garden]
      summary: Reopen a closed season
      description: Requires `manage` and is audited, because reopening rewrites the record the rotation checks depend on.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Reopened, content: { application/json: { schema: { $ref: '#/components/schemas/Season' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Not closed, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/garden/seasons/{year}/check:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/SeasonYear' }]
    get:
      operationId: getGardenSeasonsByYearCheck
      tags: [garden]
      summary: The plan check — eleven rules, computed on read
      description: |
        At the `beds` tier only the history-free checks run (C1, C2, C4, C9, C10). At `plot`, all
        eleven do.

        **A warning never blocks a save** — the check is advisory, always. History-dependent checks
        return the explicit state `no_history` rather than a pass when there are no closed seasons,
        so rotation checks are structurally silent in the first season and only sharp from the
        third, and the UI says so rather than hiding it.
      responses:
        '200': { description: Check results, content: { application/json: { schema: { $ref: '#/components/schemas/PlanCheck' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/garden/seasons/{year}/check/dismissals/{check_key}:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/SeasonYear' }, { name: check_key, in: path, required: true, schema: { type: string } }]
    put:
      operationId: putGardenSeasonsByYearCheckDismissalsByCheckKey
      tags: [garden]
      summary: Dismiss one warning for this season
      description: Without dismissal, members stop reading the panel by April — and the panel is the feature.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: false
        content: { application/json: { schema: { type: object, properties: { note: { type: string } } } } }
      responses:
        '204': { description: Dismissed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      operationId: deleteGardenSeasonsByYearCheckDismissalsByCheckKey
      tags: [garden]
      summary: Restore a dismissed warning
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '204': { description: Restored }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/garden/plantings:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    get:
      operationId: getGardenPlantings
      tags: [garden]
      summary: List plantings
      parameters:
        - { name: season_year, in: query, required: false, schema: { type: integer } }
        - { name: bed_id, in: query, required: false, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: container_id, in: query, required: false, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/PlantingStatus' } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { description: Plantings, content: { application/json: { schema: { $ref: '#/components/schemas/PlantingPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      operationId: postGardenPlantings
      tags: [garden]
      summary: Create a planting
      description: |
        Quantity is **either** an area or a plant count — exactly one, `422` otherwise. Planned dates
        default from the resolved catalog windows against the season's frost dates, and each carries
        an `is_manual` flag so a re-anchor never clobbers a date the member typed.

        A planting belongs to the **season of its harvest**: garlic sown in October 2026 is a 2027
        planting, and its sow date legitimately falls in the previous calendar year.
        A `season_id` of null means a permanent planting.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PlantingCreate' } } }
      responses:
        '201': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Planting' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/garden/plantings/{planting_id}:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/PlantingId' }]
    get:
      operationId: getGardenPlantingsByPlantingId
      tags: [garden]
      summary: One planting with its tasks, harvests, drift and resolved crop record
      responses:
        '200': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: The planting, content: { application/json: { schema: { $ref: '#/components/schemas/PlantingDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    patch:
      operationId: patchGardenPlantingsByPlantingId
      tags: [garden]
      summary: Update a planting
      description: |
        Recording an **actual** date that differs from the plan changes **no** planned window. The
        detail view states the drift and offers `/shift-tasks` — an explicit action, not an implicit
        recalculation.
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PlantingUpdate' } } }
      responses:
        '200': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/PlantingDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      operationId: deleteGardenPlantingsByPlantingId
      tags: [garden]
      summary: Delete a planting
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/garden/plantings/{planting_id}/shift-tasks:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/PlantingId' }]
    post:
      operationId: postGardenPlantingsByPlantingIdShiftTasks
      tags: [garden]
      summary: Shift the planting's remaining open tasks by a day offset
      description: Shifted tasks are marked edited, which protects them from any future regeneration.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [days], properties: { days: { type: integer } } } } }
      responses:
        '200': { description: Shifted, content: { application/json: { schema: { $ref: '#/components/schemas/BulkResult' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/garden/tasks:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    get:
      operationId: getGardenTasks
      tags: [garden]
      summary: The work calendar
      parameters:
        - { name: from, in: query, required: false, schema: { type: string, format: date } }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
        - { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/GardenTaskStatus' } }
        - { name: kind, in: query, required: false, schema: { type: string } }
        - { name: bed_id, in: query, required: false, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: planting_id, in: query, required: false, schema: { $ref: '#/components/schemas/Uuid' } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { description: Tasks, content: { application/json: { schema: { $ref: '#/components/schemas/GardenTaskPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      operationId: postGardenTasks
      tags: [garden]
      summary: Create a manual task
      description: |
        Watering and weeding exist **only** as manual kinds — they are never generated. A cadence of
        chores nobody ticks off is how a task list loses its credibility, and both are decided by
        looking at the garden rather than at a list.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GardenTaskCreate' } } }
      responses:
        '201': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/GardenTask' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/garden/tasks/{task_id}:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/GardenTaskId' }]
    patch:
      operationId: patchGardenTasksByTaskId
      tags: [garden]
      summary: Update a task
      description: Editing a generated task marks it edited, after which no regeneration will ever move it.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GardenTaskUpdate' } } }
      responses:
        '200': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/GardenTask' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      operationId: deleteGardenTasksByTaskId
      tags: [garden]
      summary: Delete a task
      description: Deleting a generated task leaves a tombstone, so it does not resurrect on the next recompute.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/garden/tasks/{task_id}/complete:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/GardenTaskId' }]
    post:
      operationId: postGardenTasksByTaskIdComplete
      tags: [garden]
      summary: Complete a task — idempotent
      description: Completing an already-complete task is `200`, not `409`, because a hold gesture on a bad connection fires twice.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: false
        content: { application/json: { schema: { type: object, properties: { note: { type: string }, via: { $ref: '#/components/schemas/Via' } } } } }
      responses:
        '200': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Completed, content: { application/json: { schema: { $ref: '#/components/schemas/GardenTask' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/garden/tasks/{task_id}/reopen:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/GardenTaskId' }]
    post:
      operationId: postGardenTasksByTaskIdReopen
      tags: [garden]
      summary: Reopen a completed task
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Reopened, content: { application/json: { schema: { $ref: '#/components/schemas/GardenTask' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/garden/harvests:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    get:
      operationId: getGardenHarvests
      tags: [garden]
      summary: The harvest log
      parameters:
        - { name: planting_id, in: query, required: false, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: season_year, in: query, required: false, schema: { type: integer } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/DateCursor' }
      responses:
        '200': { description: Harvests, content: { application/json: { schema: { $ref: '#/components/schemas/HarvestPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      operationId: postGardenHarvests
      tags: [garden]
      summary: Record a harvest
      description: |
        The unit defaults from the crop, so the form never asks. An **observation of a moment** —
        `additive` offline, so a harvest logged at the far end of a garden with no signal cannot
        conflict.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/HarvestCreate' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Harvest' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: 'Non-positive quantity, a date before the planting was sown, or a unit the crop does not use', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ValidationProblem' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/garden/harvests/{harvest_id}:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { name: harvest_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }]
    patch:
      operationId: patchGardenHarvestsByHarvestId
      tags: [garden]
      summary: Correct a harvest entry
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/HarvestUpdate' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Harvest' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      operationId: deleteGardenHarvestsByHarvestId
      tags: [garden]
      summary: Delete a harvest entry
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/garden/storage:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    get:
      operationId: getGardenStorage
      tags: [garden]
      summary: Stored and preserved produce
      parameters: [{ name: status, in: query, required: false, schema: { type: string, enum: [stored, consumed, spoiled] } }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' }]
      responses:
        '200': { description: Storage items, content: { application/json: { schema: { $ref: '#/components/schemas/GardenStoragePage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      operationId: postGardenStorage
      tags: [garden]
      summary: Record a storage item
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GardenStorageCreate' } } }
      responses:
        '201': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/GardenStorageItem' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/garden/storage/{item_id}:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/ItemId' }]
    patch:
      operationId: patchGardenStorageByItemId
      tags: [garden]
      summary: Update a storage item
      description: |
        Consumption is recorded by **editing the remaining quantity in place** — there is no
        movements table, because the audit log's field diffs already answer "when did we eat the
        last jar". Status moves to `consumed` automatically when remaining reaches zero.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GardenStorageUpdate' } } }
      responses:
        '200': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/GardenStorageItem' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: 'Remaining above initial, or negative', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ValidationProblem' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      operationId: deleteGardenStorageByItemId
      tags: [garden]
      summary: Delete a storage item
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/garden/rules:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    get:
      operationId: getGardenRules
      tags: [garden]
      summary: Companion and succession rules
      description: |
        Three scopes — crop pairs, family pairs, and succession. Pairs are stored in canonical order
        and matched both ways, so symmetry is structural rather than a discipline. **An explicit
        crop pair beats a family pair**, which is why both exist. Every rule carries its source, so
        folklore and agronomy are told apart by looking.
      responses:
        '200': { description: Rules, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/GardenRule' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      operationId: postGardenRules
      tags: [garden]
      summary: Create a household rule
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GardenRuleCreate' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/GardenRule' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/garden/rules/{rule_id}:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { name: rule_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }]
    patch:
      operationId: patchGardenRulesByRuleId
      tags: [garden]
      summary: Enable or disable a rule
      description: A catalog rule can be **disabled** but not deleted; a household rule can be deleted outright.
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { enabled: { type: boolean }, severity: { $ref: '#/components/schemas/CheckSeverity' } } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/GardenRule' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      operationId: deleteGardenRulesByRuleId
      tags: [garden]
      summary: Delete a household rule
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: This is a catalog rule; disable it instead, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/garden/weather:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    get:
      operationId: getGardenWeather
      tags: [garden]
      summary: Cached forecast, frost risk and the frost-date countdown
      description: A failed fetch is logged and swallowed; this renders from cache or without weather, and never shows an error nobody can act on.
      responses:
        '200': { description: Weather, content: { application/json: { schema: { $ref: '#/components/schemas/GardenWeather' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/garden/photos:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    post:
      operationId: postGardenPhotos
      tags: [garden]
      summary: Add a photo to a planting or a container
      description: The photo journal is what makes a small-scale grower open the app in a month when nothing is due.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/GardenPhotoUpload' }
      responses:
        '201': { description: Uploaded, content: { application/json: { schema: { $ref: '#/components/schemas/GardenPhoto' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { description: Over the size cap, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '415': { description: Not an accepted image type, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '502': { $ref: '#/components/responses/StorageUnavailable' }

  /households/{household_id}/garden/export:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    get:
      operationId: getGardenExport
      tags: [garden]
      summary: Export plantings and harvests as CSV
      parameters: [{ name: season_year, in: query, required: false, schema: { type: integer } }]
      responses:
        '200': { description: CSV, content: { text/csv: { schema: { type: string } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /households/{household_id}/property/properties:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    get:
      operationId: getPropertyProperties
      tags: [property]
