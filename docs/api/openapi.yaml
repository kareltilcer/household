      responses:
        '200': { description: Items, content: { application/json: { schema: { $ref: '#/components/schemas/PropertyItemPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      operationId: postPropertyItems
      tags: [property]
      summary: Add an item
      description: The category supplies sensible default service intervals — a gas boiler annually, smoke alarms monthly with a ten-year replacement.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PropertyItemCreate' } } }
      responses:
        '201': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/PropertyItem' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/property/items/{item_id}:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/ItemId' }]
    get:
      operationId: getPropertyItemsByItemId
      tags: [property]
      summary: One item with its schedules, history and documents
      responses:
        '200': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: The item, content: { application/json: { schema: { $ref: '#/components/schemas/PropertyItemDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    patch:
      operationId: patchPropertyItemsByItemId
      tags: [property]
      summary: Update an item
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PropertyItemUpdate' } } }
      responses:
        '200': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/PropertyItem' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      operationId: deletePropertyItemsByItemId
      tags: [property]
      summary: Delete an item
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/property/inventory:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    get:
      operationId: getPropertyInventory
      tags: [property]
      summary: The insurance inventory — printable and exportable
      description: Photos, serial numbers, purchase dates and values. A small feature that becomes the most valuable thing in the app on exactly one very bad day.
