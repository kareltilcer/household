        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The property has items; pass `cascade=true`, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/property/starter-items:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    get:
      operationId: getPropertyStarterItems
      tags: [property]
      summary: The country-aware starter checklist
