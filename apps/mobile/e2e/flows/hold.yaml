# Hold to complete, by a finger on a device (02-components §4.1): a touch let go early
# completes nothing and says so, and a touch held for the whole two seconds completes. The
# control says where it stands in its `testID`, `hold:<phase>`; the ring it draws is hidden
# from assistive technology, which is the tree Maestro reads, and is the same square, so a
# touch on the control lands on the ring. The exact two seconds, the finger that slides off
# and the completion with no hold for a screen reader are its own Jest tests.
#
# The page of primitives is narrowed to the hold alone (`primitives:only:hold`): three rows in
# the light theme and three in the dark, of which this holds the first, whose completion is
# answered at once.
appId: com.kareltilcer.household.dev
---
- launchApp:
    clearState: true
    clearKeychain: true
- runFlow: parts/dev.yaml
- scrollUntilVisible:
    element:
      id: 'dev-index:devPrimitives'
    direction: DOWN
- tapOn:
    id: 'dev-index:devPrimitives'
- extendedWaitUntil:
    visible:
      id: 'household-dev-screen:primitives'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'primitives:only:hold'
    direction: DOWN
- tapOn:
    id: 'primitives:only:hold'
- scrollUntilVisible:
    element:
      id: 'hold:idle'
      index: 0
    direction: DOWN
    timeout: 60000
# Let go early: nothing is completed, and the control says to keep holding. It says so for
# as long as a toast stays, five seconds, so it is looked for at once, and not after the
# screen has come to rest.
- tapOn:
    id: 'hold:idle'
    index: 0
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: 'hold:released'
    timeout: 10000
# And is then to be held again.
- extendedWaitUntil:
    notVisible:
      id: 'hold:released'
    timeout: 20000
# Held: Maestro's long press is about three seconds, and the hold is two.
- longPressOn:
    id: 'hold:idle'
    index: 0
- extendedWaitUntil:
    visible:
      id: 'hold:completed'
    timeout: 15000
- takeScreenshot: hold-completed
