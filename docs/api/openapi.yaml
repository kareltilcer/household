        '201': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Reminder' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/reminders/{reminder_id}:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { name: reminder_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }]
