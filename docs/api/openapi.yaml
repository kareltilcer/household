        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      operationId: postReminders
      tags: [reminders]
      summary: Create a reminder
      description: |
        All-day by design — a reminder is a **day**. Anything needing a time is a Calendar event.
        Recurrence is an RRULE subset expanded on read; short months clamp.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReminderCreate' } } }
