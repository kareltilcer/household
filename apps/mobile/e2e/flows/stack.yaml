# A device signs in against the real server, and stays signed in (PRD 02 FR-ID3): the member
# e2e/stack.ts made signs in through the dev form, the app opens at their household, and
# started again it opens there still, by the tokens it kept and with nothing typed. The API is
# the run's own, where an emulator finds the machine it runs on, and the app's development
# build asks it there (src/api/client.ts).
#
# After the flows the job asks the server for the member's devices, which must name this
# installation with the app's version (`pnpm run e2e:stack devices`).
appId: com.kareltilcer.household.dev
tags:
  - stack
---
- launchApp:
    clearState: true
- runFlow: parts/sign-in.yaml
# Where the app opens for a member of one household: that household.
- extendedWaitUntil:
    visible:
      id: 'route:household'
    timeout: 60000
- takeScreenshot: household
# Stopped and started again, with what it kept.
- launchApp
- extendedWaitUntil:
    visible:
      id: 'route:household'
    timeout: 60000
