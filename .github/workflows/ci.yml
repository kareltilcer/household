name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  go:
    name: Go — build, vet, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # The image docker-compose.yml runs; tooling/src/workspace.test.ts fails when the
        # two disagree.
        image: postgres:17.11-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: household
        ports:
          - 5432:5432
        # Over TCP, as docker-compose.yml does: see the note on its healthcheck.
        options: >-
          --health-cmd "pg_isready --host=127.0.0.1 --username=postgres --dbname=household"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      objectstore:
        # The image and the credentials docker-compose.yml runs; tooling/src/workspace.test.ts
        # fails when the two disagree. Each test makes a bucket of its own.
        image: rustfs/rustfs:1.0.0
        env:
          RUSTFS_ACCESS_KEY: household
          RUSTFS_SECRET_KEY: household-local-only
          RUSTFS_VOLUMES: /data
          RUSTFS_ADDRESS: 0.0.0.0:9000
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl --fail --silent --show-error http://127.0.0.1:9000/health"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # 127.0.0.1, not localhost, for the reason testsupport.DefaultDatabaseURL gives.
      HOUSEHOLD_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/household?sslmode=disable
      HOUSEHOLD_TEST_OBJECT_STORE_URL: http://household:household-local-only@127.0.0.1:9000
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          # The cache key hashes these files. Each Go job names only the tools it builds,
          # so the two jobs' caches get different keys instead of one overwriting the other.
          cache-dependency-path: |
            server/go.sum
            server/tools/golangci-lint.sum
      # A service container takes no command, so PostgreSQL gets the settings docker-compose.yml
      # starts it with here, and is restarted: logical replication among them, in which the test of
      # PowerSync's replication lag makes a slot (tooling/src/workspace.test.ts holds the two lists
      # to one).
      - name: PostgreSQL as docker-compose.yml runs it
        env:
          POSTGRES: ${{ job.services.postgres.id }}
        run: |
          for setting in wal_level=logical max_replication_slots=10 max_wal_senders=10 max_slot_wal_keep_size=2GB; do
            docker exec "$POSTGRES" psql --username=postgres --dbname=household \
              --command="ALTER SYSTEM SET ${setting%%=*} = '${setting#*=}'"
          done
          docker restart "$POSTGRES"
          for _ in $(seq 60); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' "$POSTGRES")" = healthy ] && break
            sleep 1
          done
          docker exec "$POSTGRES" psql --username=postgres --dbname=household --tuples-only --no-align \
            --command="SHOW wal_level" | grep --quiet --line-regexp logical
      - name: Modules are tidy and verified
        run: |
          go mod tidy -diff
          go mod verify
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Lint and format (golangci-lint)
        run: go tool -modfile=tools/golangci-lint.mod golangci-lint run
      - name: Test
        # -count=1: setup-go restores the build cache, and a cached result would pass a
        # database test without running it against this job's PostgreSQL.
        run: go test -count=1 ./...

  typescript:
    name: TypeScript — typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true
      - name: Typecheck, lint and test
        run: pnpm exec turbo run typecheck lint test
      # The clients' stylesheets: no raw colour and no primitive token (06-clients §3).
      - name: Stylesheets
        run: pnpm run lint:css
      - name: Format (Prettier)
        run: pnpm run format:check

  web:
    name: Web — bundle budget, policy, axe, the pseudo-locale pass and the critical paths
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The end-to-end suite starts the API itself, from its sources (apps/web/playwright.config.ts).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true
      # The typed client, the message keys and the parts of each language's catalog, which the
      # app's sources import.
      - name: Generate
        run: pnpm exec turbo run gen
      # The build a deployment serves, held to what can be read off its files: the bundle budget,
      # the policy in its page with nothing inline beside it, no dev-only page, and its own id in
      # build.json (apps/web/build/check.ts).
      - name: Build
        run: pnpm --filter @household/web run build
      - name: Bundle budget and a policy-clean build
        run: pnpm --filter @household/web run check
      # What the suite's API runs on, as a developer starts it: PostgreSQL, the object store and
      # the mail catcher, the database's roles and migrations, and then PowerSync, which a
      # member's replica connects to (docker-compose.yml).
      - name: Start the development services
        run: |
          pnpm run up
          pnpm run db:setup
          pnpm run up:sync
      # The same build with the dev-only routes in, the twelve-state harness among them, which
      # the suite's own script writes before it runs, served under the policy to Playwright's
      # Chromium, at the version the workspace pins, with the API behind it: axe on every route
      # in both themes, the pseudo-locale pass, the harness's measurements, the critical paths
      # through registering and signing in, a replica opened as the session, and every test
      # failing on a violation of the policy.
      - name: Chromium
        run: pnpm --filter @household/web exec playwright install --with-deps chromium
      - name: End-to-end
        # The API the suite starts listens on every interface: PowerSync, in its container,
        # fetches the keys it verifies a replica's token with from it at host.docker.internal,
        # which on a Linux runner is the docker bridge's address, not the loopback.
        env:
          HOUSEHOLD_E2E_API_ADDR: 0.0.0.0:8080
        run: pnpm --filter @household/web run e2e
      - name: The services' logs
        if: failure()
        run: docker compose logs --tail 200
      - name: Keep the traces of what failed
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-e2e-traces
          path: apps/web/dist/test-results
          retention-days: 7

  conformance:
    name: Sync conformance — PowerSync clients against the stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true
      # PostgreSQL with logical replication and PowerSync, each pinned in the stack's compose
      # file (packages/sync/conformance/stack), prepared as a deploy prepares a database.
      - name: Start the conformance stack
        run: pnpm --filter @household/sync conformance:up
      # The harness's self-tests and negative controls against the engine, the scenarios that
      # items 13, 16 and 17 have switched on, and a short fuzz run (the nightly workflow runs a
      # long one).
      - name: Conformance suite
        # The API the suite starts listens on every interface: PowerSync, in its container, fetches
        # the keys it verifies a client's token with from it at host.docker.internal, which on a
        # Linux runner is the docker bridge's address, not the loopback.
        env:
          CONFORMANCE_API_ADDR: 0.0.0.0:8091
        run: pnpm --filter @household/sync conformance
      # @household/sync's web build (wa-sqlite over IndexedDB) in a real browser, against the same
      # stack: it replicates, pushes, survives a reload with a write queued and reports itself (plan
      # item 18). Playwright's Chromium, at the version the package pins.
      - name: Chromium for the web replica's smoke test
        run: pnpm --filter @household/sync exec playwright install --with-deps chromium
      - name: The web replica in a browser
        env:
          CONFORMANCE_API_ADDR: 0.0.0.0:8091
        run: pnpm --filter @household/sync conformance:web
      - name: The stack's logs
        if: failure()
        run: docker compose --file packages/sync/conformance/stack/docker-compose.yml logs --tail 200

  converter:
    name: Converter — the sidecar's image, converting for real
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      # The image deploy/converter builds, started once its health check passes.
      - name: Build and start the converter
        run: |
          docker build --file deploy/converter/Dockerfile --tag household-converter .
          docker run --detach --name converter --publish 127.0.0.1:3100:3100 household-converter
          for _ in $(seq 60); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' converter)" = healthy ] && break
            sleep 2
          done
          docker inspect --format '{{.State.Health.Status}}' converter | grep -qx healthy
      - name: Convert a document and draw its page
        working-directory: server
        env:
          HOUSEHOLD_TEST_CONVERTER_URL: http://127.0.0.1:3100
        run: go test -count=1 -run TestTheSidecarConverts -v ./internal/platform/convert/
      - name: The converter's logs
        if: failure()
        run: docker logs converter

  stripe:
    name: Stripe — what the processor sends, against Stripe's own mock
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      # The image docker-compose.yml runs under its stripe profile; tooling/src/workspace.test.ts
      # fails when the two disagree. It validates every request against Stripe's OpenAPI description.
      stripe-mock:
        image: stripe/stripe-mock:v0.206.0
        ports:
          - 12111:12111
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      # Any answer will do: the mock refuses a request with no key, which says it is listening.
      - name: Wait for the mock
        run: |
          for _ in $(seq 30); do
            curl --silent --output /dev/null http://127.0.0.1:12111/v1/prices && break
            sleep 1
          done
      - name: Ask the mock everything the processor asks Stripe
        working-directory: server
        env:
          HOUSEHOLD_TEST_STRIPE_URL: http://127.0.0.1:12111
        run: go test -count=1 -run TestStripeTakesWhatTheProcessorSends -v ./internal/platform/billing/

  openapi:
    name: OpenAPI — openapi-spec-validator and Redocly
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: docs/api/requirements.txt
      - name: openapi-spec-validator
        run: |
          python -m pip install --requirement docs/api/requirements.txt
          python -c "import yaml; from openapi_spec_validator import validate; validate(yaml.safe_load(open('docs/api/openapi.yaml', encoding='utf-8'))); print('valid')"
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true
      - name: Redocly
        run: pnpm run lint:api

  supply-chain:
    name: Supply chain — govulncheck, pnpm audit, gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # gitleaks reads the whole history, not only the tip.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: |
            server/go.sum
            server/tools/govulncheck.sum
            server/tools/gitleaks.sum
      - name: govulncheck
        working-directory: server
        run: go tool -modfile=tools/govulncheck.mod govulncheck ./...
      - name: gitleaks
        working-directory: server
        run: go tool -modfile=tools/gitleaks.mod gitleaks git --redact --no-banner --verbose ..
      # pnpm audit reads only the lockfile, and fails when there is none.
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          install: false
      - name: pnpm audit
        # `pnpm run` otherwise installs the whole workspace before running a script.
        env:
          PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: 'false'
        run: pnpm run audit:ts
