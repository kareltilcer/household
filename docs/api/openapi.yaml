      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The calendar has events; pass `cascade=true`, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/calendar/calendars/{calendar_id}/ics:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/CalendarId' }]
    post:
      operationId: postCalendarCalendarsByCalendarIdIcs
      tags: [calendar]
      summary: Issue or rotate a secret ICS export URL
      description: Read-only outbound feed. Rotating invalidates the previous URL immediately.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { description: The URL, content: { application/json: { schema: { type: object, properties: { url: { type: string, format: uri } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      operationId: deleteCalendarCalendarsByCalendarIdIcs
      tags: [calendar]
      summary: Revoke the ICS export URL
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '204': { description: Revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/calendar/events:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    get:
      operationId: getCalendarEvents
      tags: [calendar]
      summary: Expanded occurrences in a window
      description: |
        Recurring series expand on read within the requested window, with per-occurrence overrides
        applied. `busy_only` external calendars contribute occurrences with no title.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: calendar_ids, in: query, required: false, schema: { type: array, items: { $ref: '#/components/schemas/Uuid' } }, style: form, explode: false }
        - { name: participant_id, in: query, required: false, schema: { $ref: '#/components/schemas/Uuid' } }
      responses:
        '200': { description: Occurrences, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/EventOccurrence' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      operationId: postCalendarEvents
      tags: [calendar]
      summary: Create an event
      description: |
        An event stores **its own IANA timezone**, so a recurring 08:00 school run stays 08:00
        across a DST boundary and when the household is abroad.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EventCreate' } } }
      responses:
        '201': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Event' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/calendar/events/{event_id}:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/EventId' }]
    get:
      operationId: getCalendarEventsByEventId
      tags: [calendar]
      summary: One event series
      responses:
        '200': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: The event, content: { application/json: { schema: { $ref: '#/components/schemas/EventDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    patch:
      operationId: patchCalendarEventsByEventId
      tags: [calendar]
      summary: Edit an event
      description: |
        `scope` chooses the semantics:
        `this` writes a per-occurrence override plus an `EXDATE` on the master;
        `this_and_following` truncates the master with an `UNTIL` and creates a new series;
        `all` edits the master, surfacing rather than dropping overrides that no longer apply.
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EventUpdate' } } }
      responses:
        '200': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/EventDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      operationId: deleteCalendarEventsByEventId
      tags: [calendar]
      summary: Delete an event or one occurrence
      parameters:
        - { name: scope, in: query, required: false, schema: { $ref: '#/components/schemas/RecurrenceEditScope' } }
        - { name: recurrence_id, in: query, required: false, schema: { type: string, format: date-time } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/calendar/events/{event_id}/rsvp:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/EventId' }]
    put:
      operationId: putCalendarEventsByEventIdRsvp
      tags: [calendar]
      summary: Set the caller's RSVP
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [status], properties: { status: { $ref: '#/components/schemas/RsvpStatus' }, note: { type: string } } } } }
      responses:
        '200': { description: Recorded, content: { application/json: { schema: { $ref: '#/components/schemas/EventParticipant' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/calendar/connections:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    get:
      operationId: getCalendarConnections
      tags: [calendar]
      summary: The caller's external calendar connections
      description: A connection belongs to the member who made it, uses their consent, and is removed when they leave.
      responses:
        '200': { description: Connections, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/CalendarConnection' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      operationId: postCalendarConnections
      tags: [calendar]
      summary: Create an external calendar connection
      description: |
        `google` and `apple`/`caldav` are two-way capable; `ics_url` is read-only. Credentials are
        stored encrypted and are excluded from every export and every log.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CalendarConnectionCreate' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/CalendarConnection' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/calendar/connections/{connection_id}:
