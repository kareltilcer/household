      description: |
        Current stored bytes, the month-to-date daily average, the projected month-end average and
        the projected charge. An invoice is never the first time a customer learns the number.
      responses:
        '200': { description: Usage, content: { application/json: { schema: { $ref: '#/components/schemas/UsageSummary' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /sync/jwks:
    get:
      operationId: getSyncJwks
      tags: [sync]
      summary: The keys PowerSync verifies a replica's token with
      description: |
        The public keys, as a JSON Web Key Set (RFC 7517), that sign the tokens
        `POST …/sync/credentials` hands out, the signing key first: the keys that sign a device's
        access tokens, each named by its RFC 7638 thumbprint. PowerSync fetches them, caches them for
        minutes, and fetches them again at once for a token signed by a key it does not hold, so a
        key rotated in front of the others verifies from its first token (D-93).
      security: []
      responses:
        '200':
          description: The keys
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JsonWebKeySet' }

  /households/{household_id}/sync/credentials:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    post:
      operationId: postSyncCredentials
      tags: [sync]
      summary: Credentials for PowerSync
      description: |
        PowerSync's URL and a token of PowerSync's own for the caller (D-93), which a client's replica
        connects with, subscribing to each stream with the household as its parameter: one replica
        per household (D-4). The token names the caller alone; the streams hold them to what they
        may see in the household they subscribe with, and to the households they are in.

        It is signed EdDSA with the keys `GET /sync/jwks` publishes, and carries the audience
        PowerSync is configured with, which the API refuses: a PowerSync token opens no route of the
        API. It lasts five minutes, which bounds how long a device that was revoked, or a member who
        was removed, keeps syncing on the connection it holds: the client asks again before it
        expires, and a revoked device, a session that has ended or a caller no longer in the household
        is refused here. A web session is handed credentials as a device is. Nothing is kept under an
        `Idempotency-Key`: a repeat is handed another token.

        A household in a state that does not write is still handed them, since its replicas keep
        pulling (PRD 04 §3, D-117); a `suspended` household is not, and its streams hold nothing for
        any member, so it replicates nothing further to any device, a new one included, and a replica
        that connects is emptied of it (D-115).
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200':
          description: PowerSync's URL and a token
          headers:
            Cache-Control: { description: '`no-store`: a credential is not kept by any cache on the way.', schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncCredentials' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/sync/mutations:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    post:
      operationId: postSyncMutations
      tags: [sync]
      summary: Push a batch of client mutations
      description: |
        Mutations apply **in order, each in its own transaction**, through the service layer the
        module's REST routes write through, and each is recorded `via: sync`. A failure does not
        abort the batch; a later mutation that writes the entity a failed one did, or names it in a
        field, answers `deferred` (`dependency_failed`), and the client replays it once the queue it
        holds has drained. Per-mutation idempotency is keyed on the caller and `mutation_id` and
        retained 7 days, which is what makes wholesale client retry safe: a mutation sent again, in a
        batch retried under a fresh `Idempotency-Key`, is answered as it was the first time and takes
        no second effect; a `mutation_id` sent again with anything else is `rejected`
        (`validation_failed`).

        The HTTP status is `200` whenever the batch was processed at all — **per-mutation outcomes
        are in the body**, and a client must read them rather than the status. Every outcome but
        `applied` carries a `code`. A write to an entity whose merge policy compares versions is held
        to the `base_version` it carries, the version of the row the client wrote against (D-122):
        an `lww_field` or `lww_row` write made against an older version than the row is at is applied
        over the change it had not seen and answered `merged` (`concurrent_change`) with the row, and
        an `lww_row` write keeps the row it replaced, the loser, for the member to be offered; a
        `strict_version` update, delete or action names its `base_version`, and one made against
        another version than the row's is answered `conflict` (`version_conflict`) with the row as it
        stands, so that the member's change can be re-presented beside it. A mutation is `rejected` when its entity is not one that syncs
        (`validation_failed`), when the caller cannot see the entity's module (`not_found`) or may
        not contribute to it (`forbidden`), when the entity is read-only offline (`forbidden`: its
        merge policy does not yet take offline writes, D-84), when its policy does not take its op
        (`validation_failed`: an `additive` row is only created, and a `state_set` write is never a
        delete), when a field is refused (`validation_failed`), when it names a row that is not there
        (`not_found`), and when an `additive` create breaks its series' cross-row invariant
        (`monotonicity_violation`, with the neighbour it breaks against as `row`). A `client_time`
        more than 24 hours from the server's clock is clamped to it and flagged.

        A batch holds at most 500 mutations: a larger one is refused whole, `413`
        (`batch_too_large`), for the client to send in smaller ones. A device, or a web session,
        sends at most 60 batches a minute, and is answered `429` past them. A household's replicas
        push at most 100 000 mutations a day, the UTC day, between them (PRD 04 §5, D-127): once they
        have, a batch is refused whole, `429` (`rate_limited`), its `Retry-After` the end of the day,
        and its owners were warned once as they passed 80 %.

        A household in a state that does not write refuses the batch whole, `402`, and nothing in it
        is applied or kept: the client records each of its mutations `rejected` with the problem's
        `code`, `entitlement_read_only` or `entitlement_restricted`, holds them, and sends them again
        once the household writes again (FR-BI2, D-118). A create that would take a module past its
        rows' fair-use ceiling is `rejected` (`fair_use_ceiling`).
      parameters: [{ $ref: '#/components/parameters/IdempotencyKeyRequired' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SyncMutationBatch' } } }
      responses:
        '200': { description: Processed; see per-mutation results, content: { application/json: { schema: { $ref: '#/components/schemas/SyncMutationBatchResult' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { description: 'More than 500 mutations (`batch_too_large`), or a body larger than the edge takes (`payload_too_large`)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/sync/state:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    get:
      operationId: getSyncState
      tags: [sync]
      summary: Sync health for the caller's replicas
      description: |
        Each of the caller's replicas of the household as it last reported itself
        (`POST …/sync/digest`): when, the checkpoint it had applied, the mutations it held queued and
        the conflicts and rejections it had not resolved, its bucket checksum failures, the entity
        types whose digest disagreed, and whether it is marked to download itself again — the screen
        that stops sync bugs becoming support tickets (FR-HA19). Under D-93 the server holds no
        replica's cursor or queue: what it knows of one is what the replica reported (D-125).
      responses:
        '200': { description: State, content: { application/json: { schema: { $ref: '#/components/schemas/SyncState' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/sync/reset:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    post:
      operationId: postSyncReset
      tags: [sync]
      summary: Download one of the caller's replicas again
      description: |
        Marks one of the caller's replicas of the household to download itself again: answered with
        `resnapshot_required` at its next report (`POST …/sync/digest`), it waits for its queue to
        drain, so that no mutation it holds is discarded, then clears its replica and connects afresh,
        PowerSync sending every bucket whole (D-125). Another member's replica is not found.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [replica_id], properties: { replica_id: { $ref: '#/components/schemas/Uuid' } } } } }
      responses:
        '204': { description: The replica downloads itself again after its next report }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/sync/digest:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    post:
      operationId: postSyncDigest
      tags: [sync]
      summary: A replica's report, verified against the server (D-85)
      description: |
        **The production convergence check.** Divergence between a device's replica and the server
        is the bug class unit tests miss and users never report clearly, because the symptom is
        "something looked wrong for a while". PowerSync verifies each bucket's checksum at every
        checkpoint, which holds a replica to its buckets; this holds the buckets to PostgreSQL, which
        a replication fault, or a stream that disagrees with an entity's declared access, would pass
        every checksum against (D-125).

        The client reports its replica periodically, whenever it is at rest, its queue empty and its
        last checkpoint applied: per entity type, the rows it holds and an order-independent hash
        over their `(entity_id, version)` pairs; and its health, which the sync-health screen shows
        (`GET …/sync/state`). The server computes the same over what the caller may see as the report
        arrives, as the generated streams send it, tombstones included, and answers per entity type.
        A PowerSync client holds no feed cursor to compute it at, and a household being written to
        moves under any report, so a mismatch is **divergence** only when the replica's next report,
        a minute or more later, disagrees again on the same entity type while the server's own hash
        of it has not moved between the two: rows that held still for a minute, which a replica at
        rest would have received.

        Divergence, or a re-download an owner asked for (`POST …/sync/reset`), is answered
        `resnapshot_required`: the replica downloads itself again once its queue has drained.
        **Divergence rate is an alerting metric, not a support ticket.** Neither the report nor the
        verdict carries row data, so this endpoint discloses nothing the caller could not already
        read.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReplicaDigest' } } }
      responses:
        '200': { description: Per-entity-type verdict, content: { application/json: { schema: { $ref: '#/components/schemas/ReplicaDigestVerdict' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/search:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    get:
      operationId: getSearch
      tags: [platform-services]
      summary: Search across every module the caller may see
      description: |
        Language-aware full-text search with diacritic folding. Grants and privacy are applied
        **before** ranking, never after — filtering after ranking changes the result count and is
        itself a leak. Private items are excluded from a non-owner's matching entirely.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2 } }
        - { name: modules, in: query, required: false, schema: { type: array, items: { $ref: '#/components/schemas/ModuleKeyValue' } }, style: form, explode: false }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { description: Hits, content: { application/json: { schema: { $ref: '#/components/schemas/SearchResultPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/storage:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    get:
      operationId: getStorage
      tags: [platform-services]
      summary: The storage picture
      description: |
        Total against the allowance, the split by module and by member, derived-variant overhead, the
        largest items with what deleting each would recover, and the trend of the daily samples
        (FR-ST4, FR-HA14). Read with `view` on the household settings (`admin`); for anyone else the
        screen is absent, `404`.
      responses:
        '200': { description: Storage, content: { application/json: { schema: { $ref: '#/components/schemas/StorageReport' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/activity:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    get:
      operationId: getActivity
      tags: [platform-services]
      summary: Browse the activity log
      description: |
        Summaries render in the **reader's** language from a stored key and arguments. Private
        events are redacted for anyone but their owner, and excluded from `q` matching entirely.
        Events from modules the caller has `none` on are absent.
      parameters:
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: module, in: query, required: false, schema: { $ref: '#/components/schemas/ModuleKeyValue' } }
        - { name: action, in: query, required: false, schema: { type: string } }
        - { name: entity_type, in: query, required: false, schema: { type: string } }
        - { name: actor_id, in: query, required: false, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: level, in: query, required: false, schema: { type: string, enum: [info, notice, warn] } }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { description: Events, content: { application/json: { schema: { $ref: '#/components/schemas/ActivityEventPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/activity/{event_id}:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { name: event_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }]
    get:
      operationId: getActivityByEventId
      tags: [platform-services]
      summary: One activity event with its field diffs
      responses:
        '200': { description: The event, content: { application/json: { schema: { $ref: '#/components/schemas/ActivityEvent' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/activity/entity/{entity_type}/{entity_id}:
    parameters:
      - { $ref: '#/components/parameters/HouseholdId' }
      - { name: entity_type, in: path, required: true, schema: { type: string } }
      - { name: entity_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
      - { $ref: '#/components/parameters/Limit' }
      - { $ref: '#/components/parameters/Cursor' }
    get:
      operationId: getActivityEntityByEntityTypeByEntityId
      tags: [platform-services]
      summary: The timeline of one entity, oldest first, across modules
      responses:
        '200': { description: Events, content: { application/json: { schema: { $ref: '#/components/schemas/ActivityEventPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/activity/stats:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    get:
      operationId: getActivityStats
      tags: [platform-services]
      summary: Activity counts by module, action and actor
