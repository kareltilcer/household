openapi: 3.1.0
info: { title: The probe module's contract, version: '1' }
paths:
  /healthz:
    get: { operationId: getHealthz, security: [], responses: { '200': { description: Alive } } }
  /readyz:
    get: { operationId: getReadyz, security: [], responses: { '200': { description: Ready }, '503': { description: Not ready } } }
  /reference/countries:
    get: { operationId: getReferenceCountries, responses: { '200': { description: Listed }, '401': { $ref: '#/components/responses/Problem' } } }
  /reference/countries/{country}:
    parameters: [{ name: country, in: path, required: true, schema: { type: string, pattern: '^[A-Z]{2}$' } }]
    get: { operationId: getReferenceCountriesByCountry, responses: { '200': { description: Found }, '401': { $ref: '#/components/responses/Problem' }, '404': { $ref: '#/components/responses/Problem' } } }
  /reference/units:
    get: { operationId: getReferenceUnits, responses: { '200': { description: Listed }, '401': { $ref: '#/components/responses/Problem' } } }
  # The account routes the router always serves (item 8), declared as loosely as the tests need.
  /auth/register:
    post: { operationId: postAuthRegister, security: [], requestBody: { $ref: '#/components/requestBodies/Any' }, responses: { '202': { description: Accepted }, default: { $ref: '#/components/responses/Problem' } } }
  /auth/verify-email:
    post: { operationId: postAuthVerifyEmail, security: [], requestBody: { $ref: '#/components/requestBodies/Any' }, responses: { '204': { description: Verified }, default: { $ref: '#/components/responses/Problem' } } }
  /auth/verify-email/resend:
    post: { operationId: postAuthVerifyEmailResend, security: [], requestBody: { $ref: '#/components/requestBodies/Any' }, responses: { '202': { description: Accepted }, default: { $ref: '#/components/responses/Problem' } } }
  /auth/login:
    post: { operationId: postAuthLogin, security: [], requestBody: { $ref: '#/components/requestBodies/Any' }, responses: { '200': { description: Signed in }, default: { $ref: '#/components/responses/Problem' } } }
  /auth/logout:
    post: { operationId: postAuthLogout, responses: { '204': { description: Signed out }, default: { $ref: '#/components/responses/Problem' } } }
  /auth/password-reset:
    post: { operationId: postAuthPasswordReset, security: [], requestBody: { $ref: '#/components/requestBodies/Any' }, responses: { '202': { description: Accepted }, default: { $ref: '#/components/responses/Problem' } } }
  /auth/password-reset/confirm:
    post: { operationId: postAuthPasswordResetConfirm, security: [], requestBody: { $ref: '#/components/requestBodies/Any' }, responses: { '204': { description: Set }, default: { $ref: '#/components/responses/Problem' } } }
  /auth/password:
    post: { operationId: postAuthPassword, requestBody: { $ref: '#/components/requestBodies/Any' }, responses: { '204': { description: Changed }, default: { $ref: '#/components/responses/Problem' } } }
  /auth/token:
    post: { operationId: postAuthToken, security: [], requestBody: { $ref: '#/components/requestBodies/Any' }, responses: { '200': { description: Refreshed }, default: { $ref: '#/components/responses/Problem' } } }
  /auth/mfa/enroll:
    post: { operationId: postAuthMfaEnroll, requestBody: { $ref: '#/components/requestBodies/Any' }, responses: { '200': { description: Enrolled }, default: { $ref: '#/components/responses/Problem' } } }
  /auth/mfa/activate:
    post: { operationId: postAuthMfaActivate, requestBody: { $ref: '#/components/requestBodies/Any' }, responses: { '200': { description: Activated }, default: { $ref: '#/components/responses/Problem' } } }
  /auth/mfa/verify:
    post: { operationId: postAuthMfaVerify, security: [], requestBody: { $ref: '#/components/requestBodies/Any' }, responses: { '200': { description: Signed in }, default: { $ref: '#/components/responses/Problem' } } }
  /auth/mfa/disable:
    post: { operationId: postAuthMfaDisable, requestBody: { $ref: '#/components/requestBodies/Any' }, responses: { '204': { description: Disabled }, default: { $ref: '#/components/responses/Problem' } } }
  /auth/mfa/recovery-codes:
    post: { operationId: postAuthMfaRecoveryCodes, requestBody: { $ref: '#/components/requestBodies/Any' }, responses: { '200': { description: Made }, default: { $ref: '#/components/responses/Problem' } } }
  /auth/oauth/{provider}/start:
    parameters: [{ name: provider, in: path, required: true, schema: { type: string } }]
    post: { operationId: postAuthOauthByProviderStart, security: [], requestBody: { $ref: '#/components/requestBodies/Any' }, responses: { '200': { description: Begun }, default: { $ref: '#/components/responses/Problem' } } }
  /auth/oauth/{provider}/callback:
    parameters: [{ name: provider, in: path, required: true, schema: { type: string } }]
    post: { operationId: postAuthOauthByProviderCallback, security: [], requestBody: { $ref: '#/components/requestBodies/Any' }, responses: { '200': { description: Signed in }, default: { $ref: '#/components/responses/Problem' } } }
  /auth/oauth/{provider}/link:
    parameters: [{ name: provider, in: path, required: true, schema: { type: string } }]
    post: { operationId: postAuthOauthByProviderLink, requestBody: { $ref: '#/components/requestBodies/Any' }, responses: { '204': { description: Linked }, default: { $ref: '#/components/responses/Problem' } } }
  /auth/oauth/{provider}:
    parameters: [{ name: provider, in: path, required: true, schema: { type: string } }]
    delete: { operationId: deleteAuthOauthByProvider, responses: { '204': { description: Unlinked }, default: { $ref: '#/components/responses/Problem' } } }
  /me/devices:
    get: { operationId: getMeDevices, responses: { '200': { description: Devices }, default: { $ref: '#/components/responses/Problem' } } }
  /me/devices/{device_id}:
    parameters: [{ name: device_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }]
    patch: { operationId: patchMeDevicesByDeviceId, requestBody: { $ref: '#/components/requestBodies/Any' }, responses: { '200': { description: Renamed }, default: { $ref: '#/components/responses/Problem' } } }
    delete: { operationId: deleteMeDevicesByDeviceId, responses: { '204': { description: Revoked }, default: { $ref: '#/components/responses/Problem' } } }
  /me:
    get: { operationId: getMe, responses: { '200': { description: The user }, default: { $ref: '#/components/responses/Problem' } } }
    patch: { operationId: patchMe, requestBody: { $ref: '#/components/requestBodies/Any' }, responses: { '200': { description: Updated }, default: { $ref: '#/components/responses/Problem' } } }
  /me/sessions:
    get: { operationId: getMeSessions, responses: { '200': { description: Sessions }, default: { $ref: '#/components/responses/Problem' } } }
    delete: { operationId: deleteMeSessions, responses: { '204': { description: Done }, default: { $ref: '#/components/responses/Problem' } } }
  /me/sessions/{session_id}:
    parameters: [{ name: session_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }]
    delete: { operationId: deleteMeSessionsBySessionId, responses: { '204': { description: Revoked }, default: { $ref: '#/components/responses/Problem' } } }
  /households/{household_id}/probe/items:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    get:
      operationId: getProbeItems
      responses:
        '200': { description: Listed, content: { application/json: { schema: { $ref: '#/components/schemas/ProbeItems' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '402': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
    post:
      operationId: postProbeItems
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProbeItem' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/ProbeItem' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '402': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /households/{household_id}/probe/items/{item_id}:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { name: item_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }]
    delete:
      operationId: deleteProbeItemsByItemId
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Problem' }
        '402': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
components:
  parameters:
    HouseholdId: { name: household_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: false, schema: { type: string, minLength: 1, maxLength: 128 } }
  requestBodies:
    Any: { required: true, content: { application/json: { schema: { type: object } } } }
  responses:
    Problem:
      description: A problem.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
  schemas:
    Uuid:
      type: string
      pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
    ProbeItem:
      type: object
      required: [id, household_id]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        household_id: { $ref: '#/components/schemas/Uuid' }
    ProbeItems:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ProbeItem' } }
    ProblemCode: { type: string }
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { $ref: '#/components/schemas/ProblemCode' }
        request_id: { type: string }
    ValidationProblem:
      allOf:
        - { $ref: '#/components/schemas/Problem' }
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              items:
                type: object
                required: [field, code]
                properties:
                  field: { type: string }
                  code: { type: string }
