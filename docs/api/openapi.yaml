    patch:
      operationId: patchShoppingListsByListId
      tags: [shopping]
      summary: Update a list
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ShoppingListUpdate' } } }
      responses:
        '200': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/ShoppingList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      operationId: deleteShoppingListsByListId
      tags: [shopping]
      summary: Delete a list
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/shopping/lists/{list_id}/items:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/ListId' }]
    post:
      operationId: postShoppingListsByListIdItems
      tags: [shopping]
      summary: Quick-add — one or more items from free text
      description: |
        The single most-used interaction in the product. `text` is split on commas and newlines, and
        each line is opportunistically parsed for a leading quantity and unit. Parsing **never**
        blocks the add: an unparsed line becomes an item whose text is exactly what was typed.
        Categories are auto-assigned from a translated catalog and are always overridable.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ShoppingQuickAdd' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/ShoppingItem' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/shopping/items/{item_id}:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/ItemId' }]
    patch:
      operationId: patchShoppingItemsByItemId
      tags: [shopping]
      summary: Update an item
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ShoppingItemUpdate' } } }
      responses:
        '200': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/ShoppingItem' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      operationId: deleteShoppingItemsByItemId
      tags: [shopping]
      summary: Delete an item
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/shopping/items/{item_id}/checked:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/ItemId' }]
    put:
      operationId: putShoppingItemsByItemIdChecked
      tags: [shopping]
      summary: Set an item's checked state
      description: |
        **Desired state, not a toggle** — the offline merge policy is `state_set`, so applying this
        twice is applying it once. Two members checking the same item in the same shop, both
        offline, resolve to one check with no conflict dialog.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [checked], properties: { checked: { type: boolean }, client_time: { type: string, format: date-time } } } } }
      responses:
        '200': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Set, content: { application/json: { schema: { $ref: '#/components/schemas/ShoppingItem' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/shopping/lists/{list_id}/clear-checked:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/ListId' }]
    post:
      operationId: postShoppingListsByListIdClearChecked
      tags: [shopping]
      summary: Remove all checked items, optionally recording a trip
      description: Cleared items are soft-deleted and feed the household's own staples ranking.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: '#/components/schemas/ShoppingClearRequest' } } }
      responses:
        '200': { description: Cleared, content: { application/json: { schema: { $ref: '#/components/schemas/ShoppingClearResult' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/shopping/lists/{list_id}/layout:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/ListId' }]
    put:
      operationId: putShoppingListsByListIdLayout
      tags: [shopping]
      summary: Set the store layout — the category order for this list
      description: Requires `manage`. A list that reads in walking order is the difference between weekly use and abandonment.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [category_ids], properties: { category_ids: { type: array, items: { $ref: '#/components/schemas/Uuid' } } } } } }
      responses:
        '200': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/ShoppingList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/shopping/categories:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    get:
      operationId: getShoppingCategories
      tags: [shopping]
      summary: Categories, seeded from a translated reference catalog
      responses:
        '200': { description: Categories, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/ShoppingCategory' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      operationId: postShoppingCategories
      tags: [shopping]
      summary: Create a category
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ShoppingCategoryCreate' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/ShoppingCategory' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/shopping/staples:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    get:
      operationId: getShoppingStaples
      tags: [shopping]
      summary: Suggested and explicit staples
      description: Ranked from **this household's own** add-and-clear history. No cross-household data, no model, no inference service.
      responses:
        '200': { description: Staples, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/ShoppingStaple' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      operationId: postShoppingStaples
      tags: [shopping]
      summary: Mark an item text as a staple, optionally recurring
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ShoppingStapleCreate' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/ShoppingStaple' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/shopping/trips:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' }]
    get:
      operationId: getShoppingTrips
      tags: [shopping]
      summary: Recorded shopping trips
      responses:
        '200': { description: Trips, content: { application/json: { schema: { $ref: '#/components/schemas/ShoppingTripPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/chores:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    get:
      operationId: getChores
      tags: [chores]
      summary: List chore definitions
      parameters: [{ $ref: '#/components/parameters/IncludeArchived' }]
      responses:
        '200': { description: Chores, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Chore' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      operationId: postChores
      tags: [chores]
      summary: Create a chore
      description: |
        `fixed_interval` anchors on the **last completion**, not on a grid, so a chore done late does
        not accumulate a debt of missed occurrences. Use `calendar` for genuinely grid-based chores
        such as a bin collection. Requires `manage`.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ChoreCreate' } } }
      responses:
        '201': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Chore' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/chores/{chore_id}:
