    get:
      operationId: getDocumentsByDocumentIdContent
      tags: [documents]
      summary: Obtain a short-lived link to a document variant
      description: |
        Authorises the caller, then issues a pre-signed URL **for one object**, expiring in minutes.
        Never issued for a prefix. `variant=original` serves the bytes with the checksum as `ETag`
        and an immutable cache policy, because the bytes never change.

        Active types — HTML, SVG, anything scriptable — return `disposition: attachment` and are
        never rendered in the app's origin.
      parameters:
        - { name: variant, in: query, required: false, schema: { type: string, enum: [original, download, preview, thumbnail], default: original } }
      responses:
        '200': { description: A signed link, content: { application/json: { schema: { $ref: '#/components/schemas/ContentLink' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The requested variant is still being generated, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }

