      operationId: postChoresSwaps
      tags: [chores]
      summary: Ask another member to take an occurrence
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ChoreSwapCreate' } } }
      responses:
        '201': { description: Requested, content: { application/json: { schema: { $ref: '#/components/schemas/ChoreSwap' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
