openapi: 3.1.0

info:
  title: Household API
  version: 1.0.0
  summary: Multi-tenant household management — identity, offline-first sync, and seventeen feature modules.
  description: |
    The complete HTTP contract for **Household**.

    ## Scoping

    Four scopes, distinguishable by path prefix:

    | Prefix | Scope | Notes |
    |---|---|---|
    | `/api/v1/auth/**`, `/api/v1/me/**` | The authenticated user | Independent of any household |
    | `/api/v1/reference/**` | Reference data | Global and read-only: the same for every authenticated user |
    | `/api/v1/households/{household_id}/**` | One household | The tenant is **always** in the path, never in a header or session |
    | `/api/v1/platform/**` | Platform staff | **Metadata only.** No endpoint here returns household content |

    ## Tenancy

    Every household-scoped request resolves `{household_id}` in middleware, verifies the caller's
    membership, loads their role and module grants, and opens the database transaction with the
    tenant context set. PostgreSQL row-level security independently enforces the same boundary.

    ## Refusals

    **A caller who may not see a resource receives `404`, never `403`.** This applies to module
    grants, private items, and conversation membership alike. A `403` is an existence oracle.
    `403` is reserved for cases where the caller may see the resource but not perform the action.

    ## Entitlement

    A household is always in one of eight entitlement states (`EntitlementState`), resolved once
    per request (PRD 04 §3). A state that does not write refuses every household-scoped unsafe
    request `402` (`PaymentRequired`), except the closed list of operations that declare no `402`:
    everything under `…/billing`, `POST …/exports`, `POST` and `DELETE …/deletion`, `POST …/leave`,
    `POST` and `DELETE …/restriction`, and `POST …/sync/credentials`, with which a replica pulls.
    No read is refused `402` in any state. `grace` refuses uploads alone. A `suspended` household
    answers every household-scoped request `404`, the exempt ones too, as a household its caller
    cannot see; the household list (`getHouseholds`) still names it, with its state, for the
    lockout a client shows. The writes into a household from outside its routes, accepting an
    invitation (`postMeInvitationsByTokenAccept`), declining one (`postMeInvitationsByTokenDecline`)
    and confirming a graduation (`postAuthGraduationConfirm`), are held to the same: `402` in a
    state that does not write, and not found in a `suspended` household (D-120), whose invitations
    are neither previewed nor listed either, and whose household code opens nothing for a child's
    sign-in (`postAuthChildProfiles`, `postAuthChildLogin`).

    A fair-use ceiling on what a household or a user holds (PRD 04 §5: members, owned households,
    rows per module, objects) refuses the create that would pass it `403`, `fair_use_ceiling`, or
    `household_limit_reached` for the households a user may own: waiting does not lower the count,
    so a retry does not help. The owners are told once as a count reaches 80 % of its ceiling, and
    a user as they create the household that brings them to 80 % of theirs. A module's rows are the
    rows the database holds, its deleted ones among them until they are erased; past a ceiling,
    support raises it. A ceiling on a rate answers `429`.

    ## Authentication

    Two credential presentations, one authorization path:

    - **Web** — a `__Host-hh_session` cookie plus a double-submit CSRF token in `X-CSRF-Token`,
      the value of the readable `__Host-hh_csrf` cookie. A session lasts 30 days from its last
      use.
    - **Mobile** — `Authorization: Bearer <access token>`, 15-minute lifetime, refreshed via
      `POST /auth/token` with a rotating single-use refresh token. A device's sign-in lasts until
      it is revoked, and an access token authenticates only while it lasts.

    Access tokens carry **no roles and no grants**; authorization is resolved server-side per
    request, so a revoked grant takes effect immediately. A request whose `Authorization` header
    carries a bearer token is authenticated by it alone, and the session cookie is not read. An
    `Authorization` header in another scheme, such as the Basic credentials a browser resends to a
    proxy that asked for them, is not read, and the session cookie decides.

    ## Clients

    Household's own clients name themselves in `Household-Client`, their `ClientType` and their
    version, MAJOR.MINOR.PATCH with an optional pre-release or build suffix: `mobile/1.4.2`,
    `web/2.0.0-beta.3`. The server serves each type from a minimum version on, and answers a
    request from an older client `400` (`update_required`), naming the oldest version it serves in
    `minimum_version`, whatever the request asked for: the client shows its blocking *please
    update* screen and nothing else. The check comes before any other, so an old client is told to
    update rather than refused for a request the contract no longer admits. A header that is not a
    client's answers `422` naming `header:Household-Client`, and a request without one, not a
    client of Household's own, is not held to a minimum.

    An unsafe request whose `Origin` (or, lacking one, `Referer`) names an origin that is not
    Household's own web client's is refused `403` (`csrf_failed`), whatever it carries: a page on
    another site sent it. So is an unsafe request the session cookie authenticates that names no
    origin, or whose `X-CSRF-Token` is not its session's token and its `__Host-hh_csrf` cookie's
    value. A request that names no origin and carries no session cookie, a native client's, is
    not checked.

    ## Concurrency and idempotency

    - Unsafe methods accept `Idempotency-Key`, declared on each of them so a generated client can
      send it. It is **required** on `POST /sync/mutations`. A key is the caller's own, and a
      repeat of it is answered with the first request's `2xx` response. A repeat that arrives
      while the first request is still running answers `409` (`idempotency_in_progress`), as does
      one whose first request took effect but whose response was not kept, until the key expires.
      A first request that has not taken effect five minutes after it arrived is taken to have
      failed: a repeat then runs it, and the first, if it is still running, can no longer take
      effect and answers `409` (`idempotency_in_progress`) itself. A key reused for a different
      request answers `422`, naming `header:Idempotency-Key`; an upload is a different request by
      its route, its `If-Match` and its form's media type, never by its bytes (the parameter says
      why). A
      request answered with anything but `2xx` stores nothing, so repeating it runs it again,
      unless it took effect before it was answered: then a repeat answers `409` like one whose
      response was not kept.
    - A request made before signing in has no caller whose key it could be. `/auth/register`,
      `/auth/verify-email`, `/auth/verify-email/resend`, `/auth/login`, `/auth/password-reset`
      and `/auth/password-reset/confirm` check the header and keep nothing, and a repeat runs
      again, which each of them is safe to: the three that answer `202` send at most another
      email, which their limits cap; a sign-in starts a new session, since a credential is never
      kept to be answered with; and a spent link answers as spent, except a verification link,
      whose repeat answers `204` while the address it confirmed stands. A child profile's
      `/auth/child/profiles`, `/auth/child/login` and `/auth/graduation/confirm` keep nothing either:
      a lookup reads, a sign-in starts a new sign-in on its device, and a spent graduation link
      answers as spent. `/auth/password` keeps none either, since a key's fingerprint of its body
      would be a fast hash of two passwords; a repeat of a change that was made answers `401`, the
      current password being the new one. Nor do the two requests whose body carries a child
      profile's PIN, `POST /households/{household_id}/children` and
      `PUT /households/{household_id}/children/{user_id}/pin`: a repeat of a profile that was made
      answers `422` naming `/id`, and a repeat of a new PIN sets it again. Nor does
      `POST /households/{household_id}/sync/credentials`, whose token is never kept to be answered
      with: a repeat is handed another.
    - A request that ended the session it was made with, `POST /auth/logout`, `DELETE /me/sessions`
      and `DELETE /me/sessions/{session_id}` naming the current session, keeps its key, but a
      repeat of it arrives with a session that has ended and answers `401` (`unauthenticated`), as
      every request from that session now does, rather than with the stored response.
    - Entities with a `version` return it as an `ETag`, and accept that entity-tag back in
      `If-Match`; a mismatch is `409` carrying the current representation.

    ## Errors

    RFC 9457 `application/problem+json` throughout, with a stable machine-readable `code` that
    clients switch on. Never switch on `detail`, which is human-readable and translated.

    Any operation can also answer `405` (`method_not_allowed`) or `500` (`internal`). Every request
    is checked against this document before it is served, so any operation can also answer `422`
    (`validation_failed`) for a request the document does not admit, and any operation that takes
    a body `413` (`payload_too_large`) or `415` (`unsupported_media_type`). Any operation that
    accepts `Idempotency-Key` can also answer `409` (`idempotency_in_progress`), any unsafe
    operation `403` (`csrf_failed`, see Authentication, or `fair_use_ceiling`, a
    `FairUseProblem`, see Entitlement), and any operation `400` (`update_required`, see Clients).
    None of these is declared on each operation.

    In a `ValidationProblem`, each `errors[].field` is an RFC 6901 JSON Pointer into the request
    body (`/name`, `/items/0/amount_minor`, or an empty string for the body as a whole), or, for a
    parameter, its location and name: `query:limit`, `header:If-Match`, `path:household_id`.
    `errors[].code` names the check that failed in snake_case: a JSON Schema keyword such as
    `required`, `type`, `max_length` or `pattern`; `malformed` for a value that does not parse,
    an empty one included; or `invalid` for a refusal no keyword names, such as a body sent to an
    operation that takes none.

    ## Money and quantities

    Money is always an integer in the currency's minor unit plus an ISO 4217 code. There are no
    floating-point monetary values anywhere in this contract.

    ## Offline

    Clients generate `UUIDv7` identifiers for entities they create. The offline-first data path is
    PowerSync's for reads and `POST /households/{household_id}/sync/mutations` for writes (D-93):
    a client's replica connects to PowerSync with the URL and the token
    `POST /households/{household_id}/sync/credentials` hands it, and replicates the rows of the
    household that the caller may see, which streams generated from the server's entity registry
    define; its queued writes are pushed to the API. The per-module REST endpoints are the online
    path. Both write through the same service layer.
  contact:
    name: Household
    url: https://household.example
  license:
    name: Proprietary

servers:
  - url: https://api.household.example/api/v1
    description: Production (EU)
  - url: https://api.staging.household.example/api/v1
    description: Staging — synthetic data only
  - url: http://localhost:8080/api/v1
    description: Local development

security:
  - bearerAuth: []
  - sessionCookie: []

tags:
  - name: auth
    description: Registration, sign-in, tokens, MFA, password reset
  - name: me
    description: The authenticated user's own profile, sessions, devices and preferences
  - name: reference
    description: Global reference data — country profiles and units, the same for every user
  - name: households
    description: Households, members, invitations, child profiles, module enablement
  - name: billing
    description: Subscription, invoices and metered usage
  - name: sync
    description: The offline-first data path — PowerSync's credentials and keys, and the push of queued mutations
  - name: platform-services
    description: Cross-module platform surfaces — search, storage, activity, reminders, notifications
  - name: dashboard
    description: The widget host
  - name: tasks
    description: Boards, columns and cards
  - name: reminders
    description: Standalone recurring reminders
  - name: calendar
    description: Calendars, events and external synchronisation
  - name: shopping
    description: Shared shopping lists
  - name: chores
    description: Recurring assignable chores and points
  - name: notes
    description: Markdown notes in a folder tree
  - name: documents
    description: Files, previews and expiry tracking
  - name: finance
    description: Accounts, allocation, expenses, budgets and recurring bills
  - name: utilities
    description: Meters, tariffs, advances and billing periods
  - name: garden
    description: Plants, beds, seasons, tasks and harvests
  - name: property
    description: Properties, appliances and maintenance
  - name: vehicles
    description: Vehicles, inspections, insurance and fuel
  - name: pets
    description: Pets, health records and routines
  - name: chat
    description: Household messaging
  - name: platform
    description: Platform staff endpoints — metadata only
  - name: health
    description: Liveness and readiness probes

paths:
  /healthz:
    get:
      operationId: getHealthz
      tags: [health]
      summary: Liveness
      security: []
      responses:
        '200': { description: Alive, content: { application/json: { schema: { type: object, properties: { status: { const: ok } } } } } }

  /readyz:
    get:
      operationId: getReadyz
      tags: [health]
      summary: Readiness — database and object store reachable
      description: |
        Each dependency is a check, `ok` or `down`. The database is one the API cannot serve without:
        when it is down, so is the instance, `503`. The object store is not: without it an upload
        answers `502` (`storage_unavailable`) and everything else still serves, links to what is
        already stored among it (FR-NF3), so the instance is `degraded` and still answers `200`.
      security: []
      responses:
        '200': { description: Ready, content: { application/json: { schema: { $ref: '#/components/schemas/Readiness' } } } }
        '503': { description: Not ready, content: { application/json: { schema: { $ref: '#/components/schemas/Readiness' } } } }

  /auth/register:
    post:
      operationId: postAuthRegister
      tags: [auth]
      summary: Register with email and password
      description: |
        Always answers `202` whether or not the address is already registered — the differing
        outcome is in the email that is sent, not in the response: a verification link to a new
        address, and to one that already has an account a note that it does, with the way to sign
        in. The account exists immediately but is unverified and cannot invite, be invited, or
        become a billing payer until verified. A password found in the breached-password screen
        is refused `422`, naming `/password` with the code `invalid`. A client's network may
        register five times an hour, and an address that already has an account is sent the note
        at most three times an hour, however many networks ask; a registration past that still
        answers `202`.
      security: []
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '202': { description: Accepted; a verification email has been sent if appropriate }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/verify-email:
    post:
      operationId: postAuthVerifyEmail
      tags: [auth]
      summary: Confirm an email address
      security: []
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [token], properties: { token: { type: string } } } } }
      responses:
        '204': { description: 'Verified, or verified already by this link' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { description: 'The link has expired (`token_expired`) or has been used (`token_already_used`)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /auth/verify-email/resend:
    post:
      operationId: postAuthVerifyEmailResend
      tags: [auth]
      summary: Resend the verification email
      description: |
        Unauthenticated, so that it serves whoever holds the address, signed in or not. Always
        answers `202` whether or not the address exists or is already verified — the differing
        outcome is whether an email is sent, never the response. An address may ask once a minute
        and five times an hour, and a client's network twenty times an hour.
      security: []
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string, format: email } } } } }
      responses:
        '202': { description: Sent if the account is unverified }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/login:
    post:
      operationId: postAuthLogin
      tags: [auth]
      summary: Sign in
      description: |
        Branches on `client_type`. `web` sets `__Host-hh_session` and the readable `__Host-hh_csrf`
        cookie, and `tokens` is null; `mobile` needs `device`, returns a token pair, and registers
        or updates the device, ending the sign-in it held. Failures are generic whatever the cause:
        a wrong password, an address with no account and an account that may not sign in all
        answer `401` (`invalid_credentials`), in the same time. Ten failures in fifteen minutes for
        an address answer `429` until a cooldown passes, which lengthens as the failures go on;
        sixty for a client's network answer `429` until the fifteen minutes that counted them end.

        An account with the second step on answers `409` with an `MfaChallenge`, unless the browser
        or the device is trusted: a browser by its `__Host-hh_trust` cookie, a device by its
        `trust_token`. Nothing is signed in until the challenge is answered at `/auth/mfa/verify`.
      security: []
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } }
      responses:
        '200':
          description: Signed in
          headers:
            Set-Cookie: { description: 'Session and CSRF cookies, for `client_type=web` only', schema: { type: string } }
          content: { application/json: { schema: { $ref: '#/components/schemas/LoginResult' } } }
        '401': { description: 'The address and password do not sign anyone in (`invalid_credentials`)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409':
          description: Multi-factor authentication is required; complete it at `/auth/mfa/verify`
          content: { application/json: { schema: { $ref: '#/components/schemas/MfaChallenge' } } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/child/profiles:
    post:
      operationId: postAuthChildProfiles
      tags: [auth]
      summary: The child profiles a household code opens
      description: |
        The first step of a child's sign-in (A-14, A-15): the name of the household the code opens,
        and its child profiles in the order they were made, to pick one from. The code identifies a
        household and authenticates nobody (FR-CH1); an adult, who signs in by email, is not listed
        (D-104). Case, spaces and dashes in the code do not matter. A code that opens no household
        answers `404`, and thirty of those in an hour from a client's network answer `429` until the
        hour that counted them ends. A `suspended` household's code opens nothing, as nothing in it
        is found (D-115).
      security: []
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [household_code], properties: { household_code: { type: string, maxLength: 32 } } } } }
      responses:
        '200': { description: The household's child profiles, content: { application/json: { schema: { $ref: '#/components/schemas/ChildProfileList' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/child/login:
    post:
      operationId: postAuthChildLogin
      tags: [auth]
      summary: Sign in as a managed child profile
      description: |
        Household code plus profile plus PIN (FR-CH1), for the device the body names, which is signed
        in as a mobile sign-in's is (`postAuthLogin`), ending the sign-in it held, with a token pair
        and no second step (FR-ID5). A shared tablet signs in each profile that uses it this way once,
        and switches between the sign-ins it holds (D-104). Case, spaces and dashes in the code do not
        matter.

        A code, a profile or a PIN that does not match, a profile that is not a child's, and a profile
        of a `suspended` household (D-115), answer `401` (`invalid_credentials`) alike, in the same
        time. Sixty sign-ins that fail in fifteen
        minutes from a client's network, those answered `423` among them, answer `429`, as a
        password's sign-in's do. Ten wrong PINs since the last right one lock the profile until an
        owner unlocks it or sets a new PIN (FR-CH5): every attempt at a locked profile, the tenth
        wrong one included, answers `423` (`child_profile_locked`), and once the tenth is counted no
        PIN sent after it is checked until an owner acts, however many are sent at once. A right PIN
        starts the ten again.
      security: []
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ChildLoginRequest' } } }
      responses:
        '200': { description: Signed in, content: { application/json: { schema: { $ref: '#/components/schemas/LoginResult' } } } }
        '401': { description: 'The code, the profile and the PIN sign nobody in (`invalid_credentials`)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '423': { description: 'The profile is locked (`child_profile_locked`); an owner must unlock it or set a new PIN', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/logout:
    post:
      operationId: postAuthLogout
      tags: [auth]
      summary: Sign out of the current session or device
      description: 'Ends the web session the request came with, or the sign-in of the device whose access token it carries: its refresh token and its access tokens stop working at once.'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '204': { description: Signed out }
        '429': { $ref: '#/components/responses/RateLimited' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/token:
    post:
      operationId: postAuthToken
      tags: [auth]
      summary: Exchange a refresh token for a new token pair
      description: |
        Refresh tokens are single-use and rotating, and a device's sign-in lasts until it is
        revoked. Presenting one that has already been used invalidates the entire family and every
        session it produced, and notifies the user, with one exception: a token presented again
        within a minute of its use, while the token it was exchanged for is still unused, is a retry
        whose answer was lost, and is answered with a new pair, the unused one retired. The version
        in `Household-Client` is recorded as the device's. No `Idempotency-Key` is kept: there is
        no caller yet, and a stored pair would be a stored credential.
      security: []
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [refresh_token], properties: { refresh_token: { type: string, maxLength: 128 } } } } }
      responses:
        '200': { description: A new token pair, content: { application/json: { schema: { $ref: '#/components/schemas/TokenPair' } } } }
        '401': { description: 'The token opens no live sign-in (`refresh_token_invalid`): unknown, its device signed out or revoked, or a reuse that has just revoked it, which also ends every trust to skip the second step. The device''s sign-in has ended, so the client discards its replica and signs in again.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /auth/password-reset:
    post:
      operationId: postAuthPasswordReset
      tags: [auth]
      summary: Request a password reset
      description: 'Always answers `202`, whether or not the address exists; a link valid for one hour is emailed only where it does. An address may ask three times an hour, and a client''s network twenty times an hour.'
      security: []
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string, format: email } } } } }
      responses:
        '202': { description: Accepted }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/password-reset/confirm:
    post:
      operationId: postAuthPasswordResetConfirm
      tags: [auth]
      summary: Set a new password with a reset token
      description: |
        On success, invalidates every session, every refresh-token family and every browser and
        device trusted to skip the second step, and emails the account's address to say so. The
        link proves the address, so an unverified one is verified too, and every Google or Apple
        identity linked to the account before it was is unlinked: whoever linked it had not shown
        the address was theirs. The second step, if it is on, stays on. A password found in the breached-password screen is refused `422`, naming `/password`
        with the code `invalid`.
      security: []
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [token, password], properties: { token: { type: string }, password: { type: string, minLength: 12 } } } } }
      responses:
        '204': { description: Password set }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { description: 'The link has expired (`token_expired`) or has been used (`token_already_used`)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /auth/graduation/confirm:
    post:
      operationId: postAuthGraduationConfirm
      tags: [auth]
      summary: Finish a child profile's graduation with the password its link sets
      description: |
        The link an owner's graduation sent (`postChildrenByUserIdGraduate`), within its 14 days, with
        the password the young adult chooses (FR-CH4, D-104). The address the link was sent to becomes
        the account's, verified, since opening the link proved it; the password becomes its credential
        in place of the PIN; and the profile becomes a `member` of its household, keeping everything it
        made and the levels it held. Every device the profile was signed in on is signed out, to sign
        in again with the address and the password. The change is the young adult's own, in the
        household's activity log.

        A link that opens nothing, or a profile no longer in its household, answers `404`; a link
        used, replaced by a newer one, or withdrawn, `410` (`token_already_used`), and one past its
        time `410` (`token_expired`). A link lapses with its sender's ownership, as an invitation
        does (D-103): once the owner who sent it has been removed, has left or has been made a member,
        it is withdrawn, and stays withdrawn if they are made an owner again. An address another
        account has taken since the link was sent answers `409` (`email_taken`). A password found in
        the breached-password screen is refused `422`, naming `/password` with the code `invalid`.

        The membership is the household's, held to its entitlement as an invitation's acceptance is
        (D-120): a household in a state that does not write graduates nobody until it writes again,
        `402` naming its state with the remedy `contact_owner`, the link left as it was, and a
        `suspended` one is not found.
      security: []
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [token, password], properties: { token: { type: string }, password: { type: string, minLength: 12 } } } } }
      responses:
        '204': { description: Graduated }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Another account has the address (`email_taken`)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '410': { description: 'The link has expired (`token_expired`), or has been used, replaced or withdrawn with its sender''s ownership (`token_already_used`)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /auth/password:
    post:
      operationId: postAuthPassword
      tags: [auth]
      summary: Change the current password
      description: |
        Signs out every other session and every other device, and emails the account's address to
        say the password changed.
        A password-reset link already sent still works, so that the address's owner can take the
        account back from someone who knows the password; a reset that lands while a change is
        running wins, and the change answers as a wrong `current_password` does. A wrong
        `current_password` answers `401` (`invalid_credentials`) and counts against the account as a
        failed sign-in does. A new password found in the breached-password screen is refused `422`,
        naming `/new_password` with the code `invalid`. No `Idempotency-Key` is kept, since its
        fingerprint would be a fast hash of the passwords: a repeat runs again.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [current_password, new_password], properties: { current_password: { type: string }, new_password: { type: string, minLength: 12 } } } } }
      responses:
        '204': { description: Changed }
        '401': { description: 'No credential (`unauthenticated`), or `current_password` is not the account''s (`invalid_credentials`)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/oauth/{provider}/start:
    post:
      operationId: postAuthOauthByProviderStart
      tags: [auth]
      summary: Begin an OIDC authorization-code flow with PKCE
      description: |
        `redirect_uri` is matched **exactly** against a server-side allowlist of registered URIs —
        no prefix, wildcard or substring matching — and an unregistered value is `422`
        (`redirect_uri_not_registered`, naming `/redirect_uri`). PKCE stops another app on the
        device stealing the code; it does not stop the code being delivered to an attacker-chosen
        redirect, so the allowlist is what closes that hole. `code_challenge` is the S256 challenge
        of a verifier the client keeps, and hands `/callback` or `/link` with the code.

        The answer is the provider's authorization URL, carrying a `state` and a nonce of the
        server's, and the `state`, which the provider sends back to the redirect URI and the client
        compares before going on. It lasts ten minutes and is used once. A start made signed in may
        be completed by `/link`, and only by the account that made it. A provider the server is not
        configured for answers `404`. A client's network may begin sixty an hour. Apple answers a
        request for an address or a name as a form posted to the redirect URI.

        Authentication is optional: a start made with the account's credential records the account,
        which `/link` needs, and one made without it is completed only at `/callback`.
      security: [{}, { bearerAuth: [] }, { sessionCookie: [] }]
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [google, apple] }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [redirect_uri, code_challenge], properties: { redirect_uri: { type: string, format: uri, maxLength: 2048, description: 'Must match a registered redirect URI exactly.' }, code_challenge: { type: string, pattern: '^[A-Za-z0-9_-]{43}$', description: 'The S256 challenge of the verifier (RFC 7636): the base64url SHA-256 of it, without padding.' }, client_type: { $ref: '#/components/schemas/ClientType' } } } } }
      responses:
        '200': { description: The authorization URL and state, content: { application/json: { schema: { type: object, required: [authorization_url, state], properties: { authorization_url: { type: string, format: uri }, state: { type: string } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/oauth/{provider}/callback:
    post:
      operationId: postAuthOauthByProviderCallback
      tags: [auth]
      summary: Complete an OIDC flow
      description: |
        Signs in the account whose credential holds the provider's subject, as `/auth/login` does
        for the `client_type` the start named: `device` is required for `mobile`, and an account
        with the second step on answers `409` with an `MfaChallenge` unless the browser or the
        device is trusted.

        A subject no account holds, whose address an account already has, produces `409
        link_required` rather than a silent link, whether or not that account verified the
        address — a silent link on an unverified email is an account-takeover primitive. Its owner
        signs in as they always have and links the provider from their account. A subject no
        account holds with an address none has makes a new account: its address verified when the
        provider verified it, and its name the provider's, or `display_name` for Apple, which gives
        a name only to the client, once.

        A state that is unknown, expired, used or another provider's, a verifier that is not the
        challenge's, a code the provider refuses, and an ID token that is another sign-in's all
        answer `401` (`invalid_credentials`): the client begins again. A provider that turns the
        server's own request away, or whose ID token the server cannot verify, is the server's
        error, `500`, not the person's.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [google, apple] }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OauthCallbackRequest' } } }
      responses:
        '200':
          description: Signed in
          headers:
            Set-Cookie: { description: 'Session and CSRF cookies, for a web sign-in only', schema: { type: string } }
          content: { application/json: { schema: { $ref: '#/components/schemas/LoginResult' } } }
        '401': { description: 'The provider did not vouch for this sign-in (`invalid_credentials`)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 'An account exists with this address, so linking is required (`link_required`); or the second step is required, an `MfaChallenge`'
          content:
            application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
            application/json: { schema: { $ref: '#/components/schemas/MfaChallenge' } }

  /auth/oauth/{provider}/link:
    post:
      operationId: postAuthOauthByProviderLink
      tags: [auth]
      summary: Link an OIDC identity to the signed-in account
      description: |
        Completes a start made signed in as this account, and adds the provider's subject to it as
        a credential, which then signs it in. A state that is unknown, expired, used, another
        provider's or begun by anyone else answers `422` naming `/state`; a verifier that is not the
        challenge's, or a code the provider does not vouch for, `422` naming `/code`. A subject
        another account holds, or an account that holds another subject of the provider already,
        answers `409` (`identity_already_linked`). A link whose session, or device sign-in, a
        password reset or signing out everywhere ended while it ran answers `401` and links nothing:
        a reset that proves the address unlinks every provider linked before it, and a link never
        lands after it. The account's address is told by email. A child profile is refused `403`: it
        signs in with its PIN alone, which an owner sets and ten wrong ones lock (D-104).
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [google, apple] }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [code, state, code_verifier], properties: { code: { type: string, maxLength: 2048 }, state: { type: string, maxLength: 128 }, code_verifier: { type: string, pattern: '^[A-Za-z0-9._~-]{43,128}$' } } } } }
      responses:
        '204': { description: Linked }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'A child profile, which signs in with its PIN alone', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: 'This identity is linked to another account, or this account to another identity of this provider (`identity_already_linked`)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/oauth/{provider}:
    delete:
      operationId: deleteAuthOauthByProvider
      tags: [auth]
      summary: Unlink an OIDC identity
      description: 'Refused `409` (`only_credential`) if it is the account''s only credential. An account that holds none of this provider answers `404`.'
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [google, apple] }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '204': { description: Unlinked }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: This is the only credential on the account, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/mfa/enroll:
    post:
      operationId: postAuthMfaEnroll
      tags: [auth]
      summary: Begin TOTP enrolment
      description: |
        Requires the current password. Binding a new second factor is at least as sensitive as
        removing one: without re-authentication a stolen session could enrol its own authenticator,
        take the recovery codes, and lock the owner out of their own account. A wrong password
        answers `401` (`invalid_credentials`) and counts against the account as a failed sign-in
        does; an account with no password, one that signs in only with Google or Apple, sets one by
        a password reset first. An account whose address is not verified is refused `403`
        (`account_unverified`): a second step bound before the address is proven would outlive the
        reset that proves it, and lock the address's owner out. The secret waits for
        `/auth/mfa/activate`: an authenticator already on stays on until then, and a later enrolment
        replaces one not yet activated. No `Idempotency-Key` is kept, since the body carries a
        password and the answer a secret.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [password], properties: { password: { type: string } } } } }
      responses:
        '200': { description: Secret and provisioning URI, content: { application/json: { schema: { $ref: '#/components/schemas/MfaEnrolment' } } } }
        '401': { description: 'No credential (`unauthenticated`), or `password` is not the account''s (`invalid_credentials`)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { description: 'The account has not verified its address (`account_unverified`)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/mfa/activate:
    post:
      operationId: postAuthMfaActivate
      tags: [auth]
      summary: Activate TOTP by confirming a code
      description: |
        A code from the enrolled authenticator turns it on, in place of any authenticator on before,
        and answers with ten new recovery codes, which replace any earlier set. Every browser and
        device trusted to skip the second step is trusted no longer. With no enrolment waiting, or
        a code that is not the authenticator's, it answers `422` naming `/code`. Wrong codes count
        against the account as the second step's do: five in five minutes answer `429`, so that a
        session alone cannot guess its way to the recovery codes. The answer is never kept by an
        `Idempotency-Key`, since it carries the codes: a repeat answers `409`
        (`idempotency_in_progress`).
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string, maxLength: 16 } } } } }
      responses:
        '200': { description: Activated; recovery codes are returned once and never again, content: { application/json: { schema: { $ref: '#/components/schemas/MfaRecoveryCodes' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/mfa/verify:
    post:
      operationId: postAuthMfaVerify
      tags: [auth]
      summary: Complete a login challenged for MFA
      description: |
        `code` is six digits from the authenticator, or one of the recovery codes, which is spent,
        emailed about, and unlocks a locked factor. A wrong code answers `401`
        (`invalid_credentials`) and the challenge stays; a challenge that is unknown, expired or
        ended answers `401` (`unauthenticated`), and the client signs in again. Wrong codes are
        limited per account, which bounds every challenge it has: five in five minutes answer
        `429`, and ten since the last right one lock the factor and end the account's challenges,
        answering `423` (`mfa_locked`). A six-digit code is otherwise a small keyspace, and the
        second factor must not be the least defended step in the sign-in. A locked factor takes
        only a recovery code until one, or support, unlocks it.

        Answered, it signs in as `/auth/login` would have: a web session in cookies, or a device's
        token pair. `remember_device` trusts this browser, in the `__Host-hh_trust` cookie, or this
        device, in `trust_token`, to sign in without the second step for 30 days.
      security: []
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [challenge_token, code], properties: { challenge_token: { type: string, maxLength: 128 }, code: { type: string, maxLength: 16 }, remember_device: { type: boolean, default: false } } } } }
      responses:
        '200':
          description: Signed in
          headers:
            Set-Cookie: { description: 'Session and CSRF cookies, and the trust cookie when `remember_device` is set, for a web sign-in only', schema: { type: string } }
          content: { application/json: { schema: { $ref: '#/components/schemas/LoginResult' } } }
        '401': { description: 'A wrong code (`invalid_credentials`), or no live challenge (`unauthenticated`)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '423': { description: Too many failed codes; the challenge is dead and the factor is locked, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/mfa/disable:
    post:
      operationId: postAuthMfaDisable
      tags: [auth]
      summary: Disable TOTP
      description: |
        A `POST` to a sub-resource rather than a `DELETE` with a body: RFC 9110 gives a `DELETE`
        payload no defined semantics and intermediaries and generated clients drop it, which would
        strip the password that authorises this. A wrong password answers `401`
        (`invalid_credentials`) and counts against the account as a failed sign-in does. The
        authenticator, the recovery codes and every trusted browser and device go, and the
        account's address is told by email. With the second step already off it answers `204` as
        well. No `Idempotency-Key` is kept, since the body carries a password.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [password], properties: { password: { type: string } } } } }
      responses:
        '204': { description: Disabled }
        '401': { description: 'No credential (`unauthenticated`), or `password` is not the account''s (`invalid_credentials`)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/mfa/recovery-codes:
    post:
      operationId: postAuthMfaRecoveryCodes
      tags: [auth]
      summary: Make a new set of recovery codes
      description: |
        Ten new recovery codes, which retire every earlier one the moment they are made (A-6). It
        requires the current password, as enrolling does, since the codes stand in for the second
        factor; a wrong one answers `401` (`invalid_credentials`) and counts against the account as
        a failed sign-in does. With the second step off it answers `404`. No `Idempotency-Key` is
        kept, since the body carries a password and the answer the codes.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [password], properties: { password: { type: string } } } } }
      responses:
        '200': { description: 'The new codes, returned once and never again', content: { application/json: { schema: { $ref: '#/components/schemas/MfaRecoveryCodes' } } } }
        '401': { description: 'No credential (`unauthenticated`), or `password` is not the account''s (`invalid_credentials`)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /push/vapid-key:
    get:
      operationId: getPushVapidKey
      tags: [platform-services]
      summary: The Web Push VAPID public key
      description: 'The public half of the key every Web Push the server sends is signed with (RFC 8292): a browser subscribes with it as its `applicationServerKey`.'
      responses:
        '200': { description: The key, content: { application/json: { schema: { type: object, required: [key], properties: { key: { type: string, description: 'An uncompressed P-256 point in base64url.' } } } } } }
        '429': { $ref: '#/components/responses/RateLimited' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /push/subscriptions:
    post:
      operationId: postPushSubscriptions
      tags: [platform-services]
      summary: Register a push subscription or device token
      description: |
        Upserts on the endpoint or token. A browser's Web Push subscription (`web_push`) is registered
        from its web session, and reaches its user while that session lives: signing out, or being
        signed out everywhere, ends it. One subscription per endpoint, so a browser another user
        subscribed moves to the caller, and one per web session, so the one a session registers
        replaces the one it registered before. Its endpoint must be at a push service the server sends
        to, and its `keys` are the browser's own. A phone's or tablet's Expo push token (`expo`) is
        registered from the device's own sign-in, and reaches it while that sign-in lives; `device_id`,
        when given, must be that device. A token is the phone's for the app: registering it clears it
        from any other installation that held it, while the profiles signed in on one installation, a
        shared tablet's, each keep it. `201` when the subscription or the token is new, `200` when it
        was registered already. Registering again ends what failures had marked: a target marked
        stale after five failures in a row is tried again (FR-NT6). A subscription that a push service
        answers `404` or `410` is deleted, as is a token Expo reports as no longer registered. Either
        transport from the other kind of sign-in, an endpoint at a push service the server does not
        know, and keys that are not a browser's are refused `422`.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PushSubscriptionCreate' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/PushSubscription' } } } }
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/PushSubscription' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      operationId: deletePushSubscriptions
      tags: [platform-services]
      summary: Remove a push subscription
      description: 'Removes the caller''s browser subscription with this endpoint, or the Expo token of their device that it names. Idempotent: `204` even when it was already gone.'
      parameters:
        - { name: endpoint, in: query, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '204': { description: Removed }
        '429': { $ref: '#/components/responses/RateLimited' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me:
    get:
      operationId: getMe
      tags: [me]
      summary: The signed-in user
      responses:
        '200': { description: The user, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
    patch:
      operationId: patchMe
      tags: [me]
      summary: Update the signed-in user's profile
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MeUpdate' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /me/avatar:
    put:
      operationId: putMeAvatar
      tags: [me]
      summary: Upload the signed-in user's picture
      description: |
        The picture is made from the image uploaded: its centred square, scaled down to 512 pixels a
        side when it is larger and never enlarged, turned upright and written again without its
        metadata, so that no camera, time or place survives it. A JPEG, PNG, GIF or WebP image is
        taken, up to 20 MB and 64 megapixels; the app converts a HEIC photograph first. The type is sniffed from the bytes, never taken from the part's
        header. The picture replaces any the user had, and is the account's, counting against no
        household's storage (D-107). `avatar_url`, here and wherever the user appears, is a link
        pre-signed for minutes (D-9); `PATCH /me` with `avatar_url: null` removes the picture.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/AvatarUpload' }
      responses:
        '200': { description: The user with their new picture, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { description: Over 20 MB, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '415': { description: Not an image this server reads, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '502': { $ref: '#/components/responses/StorageUnavailable' }

  /me/deletion:
    post:
      operationId: postMeDeletion
      tags: [me]
      summary: Request account deletion
      description: |
        Resolves every household the user belongs to first. Blocked when the user is the sole owner
        of a household with other members, or is a billing payer, and the problem document names
        which. The account is disabled immediately; execution is irreversible after 30 days.

        A `POST` to a sub-resource rather than a `DELETE /me` with a body: RFC 9110 gives a
        `DELETE` payload no defined semantics and intermediaries and generated clients drop it,
        which would strip the confirmation that authorises this.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [password_or_confirmation], properties: { password_or_confirmation: { type: string }, delete_sole_owned_households: { type: array, items: { $ref: '#/components/schemas/Uuid' } } } } } }
      responses:
        '202': { description: Scheduled, content: { application/json: { schema: { $ref: '#/components/schemas/DeletionRequest' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: Blocked; the problem document lists the blocking households, content: { application/problem+json: { schema: { $ref: '#/components/schemas/AccountDeletionBlocked' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      operationId: deleteMeDeletion
      tags: [me]
      summary: Cancel a pending account deletion
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '204': { description: Cancelled }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /me/sessions:
    get:
      operationId: getMeSessions
      tags: [me]
      summary: List active web sessions
      responses:
        '200': { description: Sessions, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Session' } } } } } } }
        '429': { $ref: '#/components/responses/RateLimited' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      operationId: deleteMeSessions
      tags: [me]
      summary: Sign out everywhere
      description: 'Revokes every session and every refresh-token family, and so every device''s sign-in, which is then handed no PowerSync credentials (`POST …/sync/credentials`), and trusts no browser or device to skip the second step any longer.'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '204': { description: Done }
        '429': { $ref: '#/components/responses/RateLimited' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/sessions/{session_id}:
    delete:
      operationId: deleteMeSessionsBySessionId
      tags: [me]
      summary: Revoke one session
      description: 'Since the browser may be lost with a trust to skip the second step in it, no browser or device stays trusted.'
      parameters: [{ $ref: '#/components/parameters/SessionId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '204': { description: Revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /me/devices:
    get:
      operationId: getMeDevices
      tags: [me]
      summary: List mobile devices
      description: 'The devices the account is signed in on, the most recently seen first. A device signed out or revoked is not listed.'
      responses:
        '200': { description: Devices, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Device' } } } } } } }
        '429': { $ref: '#/components/responses/RateLimited' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/devices/{device_id}:
    patch:
      operationId: patchMeDevicesByDeviceId
      tags: [me]
      summary: Rename a device
      description: 'A label with control characters has them dropped, and white space around it trimmed; an empty one clears it. A device the account is not signed in on is not found.'
      parameters: [{ $ref: '#/components/parameters/DeviceId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { label: { type: string, maxLength: 80 } } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Device' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      operationId: deleteMeDevicesByDeviceId
      tags: [me]
      summary: Revoke a device
      description: 'Invalidates its refresh-token family, so its local replica is discarded rather than resumed: its access tokens stop at once, its next refresh answers `401` (`refresh_token_invalid`), and it is handed no further PowerSync credentials (`POST …/sync/credentials`), so that it syncs no longer than the token it holds lasts, five minutes at most. Since it may be lost with a trust to skip the second step in it, no browser or device stays trusted. A device the account is not signed in on is not found.'
      parameters: [{ $ref: '#/components/parameters/DeviceId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '204': { description: Revoked }
        '429': { $ref: '#/components/responses/RateLimited' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/notification-preferences:
    get:
      operationId: getMeNotificationPreferences
      tags: [me]
      summary: Notification categories and quiet hours
      description: |
        Per household. Omit `household_id` for the account-wide defaults, which a household has until
        the caller sets their own there; the built-in defaults, everything on and no quiet hours, stand
        in for an account that has set none. A household the caller is not a member of is `404`.
      parameters:
        - { name: household_id, in: query, required: false, schema: { $ref: '#/components/schemas/Uuid' } }
      responses:
        '200': { description: Preferences, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationPreferences' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      operationId: patchMeNotificationPreferences
      tags: [me]
      summary: Update notification preferences
      description: |
        A JSON merge onto the preferences in force: a member left out is unchanged. With `household_id`,
        the household's preferences become the caller's own there, starting from the account's the
        first time, and a later change of the account's no longer reaches them. A household the caller
        is not a member of is `404`; a category the contract does not name, and quiet hours that are
        not two different times of day, are refused `422`.
      parameters:
        - { name: household_id, in: query, required: false, schema: { $ref: '#/components/schemas/Uuid' } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/NotificationPreferencesUpdate' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationPreferences' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/consents:
    get:
      operationId: getMeConsents
      tags: [me]
      summary: Current consent state
      description: Analytics and marketing consent. The product works identically either way.
      responses:
        '200': { description: Consents, content: { application/json: { schema: { $ref: '#/components/schemas/Consents' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      operationId: putMeConsents
      tags: [me]
      summary: Set consent state
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Consents' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Consents' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/exports:
    get:
      operationId: getMeExports
      tags: [me]
      summary: List personal export jobs
      responses:
        '200': { description: Jobs, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/ExportJob' } } } } } } }
        '429': { $ref: '#/components/responses/RateLimited' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: postMeExports
      tags: [me]
      summary: Request a personal data export
      description: |
        Everything about the requesting user across every household they belong to, as a ZIP with
        structured JSON per module, the original files, and human-readable derivatives
        (`.ics`, `.csv`, `.md`). Ready within 24 hours; downloadable for 7 days.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '202': { description: Queued, content: { application/json: { schema: { $ref: '#/components/schemas/ExportJob' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /me/exports/{export_id}:
    get:
      operationId: getMeExportsByExportId
      tags: [me]
      summary: Export job status and download link
      parameters: [{ $ref: '#/components/parameters/ExportId' }]
      responses:
        '200': { description: The job, content: { application/json: { schema: { $ref: '#/components/schemas/ExportJob' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /me/invitations:
    get:
      operationId: getMeInvitations
      tags: [me]
      summary: Invitations addressed to the signed-in user
      description: |
        The pending email invitations to the signed-in user's address, once it is verified, to the
        households they are not a member of. Each carries the invitation's id as its `token`, which its
        addressee, signed in with that verified address, may use in place of the token the email
        carries. An invitation into a `suspended` household is not listed (D-115).
      responses:
        '200': { description: Invitations, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/InvitationForInvitee' } } } } } } }
        '429': { $ref: '#/components/responses/RateLimited' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/invitations/{token}:
    get:
      operationId: getMeInvitationsByToken
      tags: [me]
      summary: Preview an invitation
      description: |
        Shows exactly what is being granted — household, inviter, role, and the module levels — before
        acceptance. Signed in or not: the token its email or link carries opens it before the invitee
        has an account, and its id opens it for its addressee alone, signed in. A signed-in caller's
        requests count against their own limit (`429`). An invitation into a `suspended` household
        is not found, as accepting it is not (D-115, D-120).
      security: [{}, { bearerAuth: [] }, { sessionCookie: [] }]
      parameters: [{ name: token, in: path, required: true, description: 'The token the invitation''s email or link carries, or the invitation''s id for its addressee signed in with the verified address it was sent to.', schema: { type: string } }]
      responses:
        '200': { description: The invitation, content: { application/json: { schema: { $ref: '#/components/schemas/InvitationForInvitee' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { description: Expired or already used, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /me/invitations/{token}/accept:
    post:
      operationId: postMeInvitationsByTokenAccept
      tags: [me]
      summary: Accept an invitation
      description: |
        The account's address must be verified (`403 account_unverified`), and an `email` invitation's
        must be the one it was sent to, which is otherwise not found. The membership has exactly the
        role and the levels the invitation proposed. Someone already a member is answered their
        membership as it is.

        A membership is a write to the household, held to its entitlement as every other is (D-120):
        a household in a state that does not write is joined by nobody, `402` naming its state with
        the remedy `contact_owner`, and a `suspended` one is not found, by its members either. A
        household with twelve members already, the ceiling of fair use, is refused `403
        fair_use_ceiling` (PRD 04 §5).
      parameters: [{ name: token, in: path, required: true, description: 'The token the invitation''s email or link carries, or the invitation''s id for its addressee signed in with the verified address it was sent to.', schema: { type: string } }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { description: Membership created, content: { application/json: { schema: { $ref: '#/components/schemas/Membership' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { description: 'The account is unverified and cannot accept invitations (`account_unverified`), or the household has twelve members, the ceiling of fair use (`fair_use_ceiling`)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/FairUseProblem' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { description: Expired or already used, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /me/invitations/{token}/decline:
    post:
      operationId: postMeInvitationsByTokenDecline
      tags: [me]
      summary: Decline an invitation
      description: |
        Recorded, and the inviter is told. It closes the invitation, a link's too. An `email`
        invitation is declined only from the account with its address; an invitation that no longer
        works is not found, and neither is one into a household the caller is already a member of,
        which asks them into nothing.

        Declining writes into the household, held to its entitlement as accepting is (D-120): a
        household in a state that does not write records no decline until it writes again, `402`
        naming its state with the remedy `contact_owner`, and a `suspended` one is not found.
      parameters: [{ name: token, in: path, required: true, description: 'The token the invitation''s email or link carries, or the invitation''s id for its addressee signed in with the verified address it was sent to.', schema: { type: string } }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '204': { description: Declined }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/diagnostics:
    post:
      operationId: postMeDiagnostics
      tags: [me]
      summary: Attach a member-assembled diagnostic bundle to a support ticket
      description: |
        The only route by which any household data reaches platform staff, and the member composes
        it, sees it in full, and may redact it before sending. Expires after 30 days.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DiagnosticBundle' } } }
      responses:
        '201': { description: Attached, content: { application/json: { schema: { type: object, properties: { id: { $ref: '#/components/schemas/Uuid' }, expires_at: { type: string, format: date-time } } } } } }
        '429': { $ref: '#/components/responses/RateLimited' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /reference/countries:
    get:
      operationId: getReferenceCountries
      tags: [reference]
      summary: Every country profile
      description: |
        What a household in each country Household serves is offered (PRD 03 §9): the country's
        currency and standard rate of VAT, the units and first day of the week a household there
        starts with, its own word for the statutory vehicle inspection, and the keys of its sets of
        public holidays and document types. Global reference data, the same for every caller, which
        changes by data rather than by a release (D-61, D-70). Every name carries every language
        Household ships, so a client renders it in its member's language, offline too, however often
        that changes. `version` is the dataset's, for a client that caches the list.
      responses:
        '200': { description: The country profiles in the order of their codes, content: { application/json: { schema: { $ref: '#/components/schemas/CountryList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /reference/countries/{country}:
    parameters: [{ name: country, in: path, required: true, schema: { $ref: '#/components/schemas/CountryCode' } }]
    get:
      operationId: getReferenceCountriesByCountry
      tags: [reference]
      summary: One country's profile
      description: A household's country, by its code, with the profile's version as its `ETag`.
      responses:
        '200': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: The profile, content: { application/json: { schema: { $ref: '#/components/schemas/Country' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /reference/units:
    get:
      operationId: getReferenceUnits
      tags: [reference]
      summary: Every unit, by dimension
      description: |
        The units a household measures in (PRD 03 §9): metric by default, and imperial available
        for length, area, mass, temperature and volume. Each unit carries its exact conversion to its
        dimension's base unit and the unit of the other system a quantity in it is shown in. The
        dimensions are in the order of their keys; the units by dimension, metric first, and each
        system's from the smallest. `version` is the dataset's, for a client that caches it.
      responses:
        '200': { description: The dimensions and their units, content: { application/json: { schema: { $ref: '#/components/schemas/UnitList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households:
    get:
      operationId: getHouseholds
      tags: [households]
      summary: Households the signed-in user belongs to
      responses:
        '200': { description: Memberships with household summaries, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/HouseholdSummary' } } } } } } }
        '429': { $ref: '#/components/responses/RateLimited' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: postHouseholds
      tags: [households]
      summary: Create a household
      description: |
        Any user may, verified or not (FR-HH1). The creator becomes an owner and the billing payer,
        every module is enabled with the creator holding `manage` on each, the household is given its
        code, and a 30-day trial begins. `units` and `first_day_of_week` default to the country's
        profile; a country Household has no profile of is refused `422` naming `/country`, and an `id`
        another household has `422` naming `/id`. A child profile is refused `403`: it is a profile an
        owner manages in their household, never a household's owner and payer (D-17, D-104).
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/HouseholdCreate' } } }
      responses:
        '201': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Household' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'The caller owns five households already, the ceiling of fair use (`household_limit_reached`, PRD 04 §5), or is a child profile (`forbidden`)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/FairUseProblem' } } } }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    get:
      operationId: getHouseholdsByHouseholdId
      tags: [households]
      summary: Household profile and settings
      responses:
        '200': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: The household, content: { application/json: { schema: { $ref: '#/components/schemas/Household' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    patch:
      operationId: patchHouseholdsByHouseholdId
      tags: [households]
      summary: Update household settings
      description: |
        Owner only. Changing `country` changes which reference data is offered from that point on and
        never reinterprets recorded values; a country Household has no profile of is refused `422`
        naming `/country`. Changing `base_currency` recomputes totals from each row's stored rate, is
        warned in the client, and is audited; until that recomputation is built, a `base_currency`
        other than the household's is refused `422` naming `/base_currency`.
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/HouseholdUpdate' } } }
      responses:
        '200': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Household' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/join-code:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    post:
      operationId: postHouseholdsByHouseholdIdJoinCode
      tags: [households]
      summary: Make a new household code
      description: |
        Owner only. The household's code (`join_code`), which a child's sign-in names the household by
        (FR-CH1), is replaced: the old one signs nobody in from now on, and the sessions it signed in
        stay. The household's `version` moves with it.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: The household with its new code, content: { application/json: { schema: { $ref: '#/components/schemas/Household' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/deletion:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    post:
      operationId: postDeletion
      tags: [households]
      summary: Delete the household
      description: |
        Owner only, name confirmation required, all members notified, reversible for 30 days.

        A `POST` to a sub-resource rather than a `DELETE /households/{household_id}` with a body:
        RFC 9110 gives a `DELETE` payload no defined semantics and intermediaries and generated
        clients drop it, which would strip the name confirmation that is the only thing standing
        between a hijacked session and destroying the tenant.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [confirm_name], properties: { confirm_name: { type: string } } } } }
      responses:
        '202': { description: Scheduled, content: { application/json: { schema: { $ref: '#/components/schemas/DeletionRequest' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      operationId: deleteDeletion
      tags: [households]
      summary: Cancel a pending household deletion
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '204': { description: Cancelled }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/leave:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    post:
      operationId: postLeave
      tags: [households]
      summary: Leave the household
      description: |
        Any member, at any time. Content the member created stays with the household; their private
        root is deleted after a 30-day window in which they may export it. The last owner and the
        billing payer cannot leave, and one who is both is told both at once (FR-HH4). The
        invitations they sent that are still waiting are withdrawn (D-103), and so are the graduation
        links they sent. A child profile is refused `403`: it is nothing outside its household, and an
        owner removes it instead (D-104).
        The `Idempotency-Key` is kept on the account rather than in the household, whose membership,
        and the member's keys in it, leaving ends.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '204': { description: Left }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'A child profile, which an owner removes', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'You are the last owner, the billing payer, or both: promote another owner or delete the household, and hand billing to another owner', content: { application/problem+json: { schema: { $ref: '#/components/schemas/LeaveBlockedProblem' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/members:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    get:
      operationId: getMembers
      tags: [households]
      summary: List members with their roles and module grants
      description: |
        Any member: the comparison is the point of the screen (FR-HA3). A member's `email` is shown to
        the household's owners and to the member themself, and is `null` to everyone else.
      responses:
        '200': { description: Members, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Membership' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/members/{user_id}:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/UserId' }]
    get:
      operationId: getMembersByUserId
      tags: [households]
      summary: One member
      responses:
        '200': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: The member, content: { application/json: { schema: { $ref: '#/components/schemas/Membership' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    patch:
      operationId: patchMembersByUserId
      tags: [households]
      summary: Change a member's role or module grants
      description: |
        Owner only. Takes effect on the member's next request; lowering a grant emits sync
        retractions immediately, and the member is notified that their access changed.
        A `child` cannot be granted `manage` on any module, nor more than `view` on `finance`; a
        level above either, a level below `manage` for an owner, and a module Household does not
        have are refused `422` naming `/grants/<module>`. A `child` stays a child and nobody else
        becomes one (`422` naming `/role`): a child profile is created and graduated instead. An
        owner made a member keeps the levels they held until they are lowered, and the invitations
        they sent that are still waiting are withdrawn (D-103), and so are the graduation links they
        sent.
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MembershipUpdate' } } }
      responses:
        '200': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Membership' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'The `If-Match` version is stale, or the change would leave the household with no owner (`last_owner`) or its billing payer no longer an owner (`billing_payer`)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      operationId: deleteMembersByUserId
      tags: [households]
      summary: Remove a member
      description: |
        Owner only, and never the caller, who leaves instead (`403`). Immediate: their sessions stop
        resolving for this household, their replica receives retractions, the invitations they sent
        that are still waiting are withdrawn (D-103), and so are the graduation links they sent, and
        they are told. A child profile removed is signed out of every device it is signed in on,
        since nothing signs it in outside its household (D-104).
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Would remove the last owner, or the member is the billing payer', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/ownership/transfer:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    post:
      operationId: postOwnershipTransfer
      tags: [households]
      summary: Promote a member to owner
      description: |
        Owner only. There may be several owners, and billing does not move with it (FR-HH6). The new
        owner holds `manage` on every module. A `child` cannot be an owner (`422` naming `/user_id`).
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [user_id], properties: { user_id: { $ref: '#/components/schemas/Uuid' } } } } }
      responses:
        '200': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Promoted, content: { application/json: { schema: { $ref: '#/components/schemas/Membership' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/restriction:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    post:
      operationId: postHouseholdRestriction
      tags: [households]
      summary: Restrict processing — GDPR Art. 18
      description: |
        Puts the household into the `restricted` entitlement state: **everything readable,
        downloadable and exportable; nothing writable.** Any `owner` may set it, any `owner` may
        lift it, immediately, and it has no minimum duration.

        It is not a billing action and it does not touch the subscription — a restricted household
        keeps paying and keeps its plan. Writes are refused by the same middleware and the same
        `402` as `read_only`, with `code: entitlement_restricted` so a client can say which of the
        two it is looking at.

        Every member sees who restricted the household and when. A household that has silently
        stopped accepting writes is a support ticket. A lapse outranks a restriction (D-114): while
        the household is also `read_only` or `canceled` its state is that one, whose deletion date it
        is shown, and `restriction` still names who restricted it. Restricting a household already
        restricted changes nothing and answers as it stands.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: false
        content: { application/json: { schema: { type: object, properties: { reason: { type: [string, 'null'], maxLength: 500, description: Shown to members in the banner and recorded in the activity log. } } } } }
      responses:
        '200': { description: Restricted, content: { application/json: { schema: { $ref: '#/components/schemas/EntitlementSummary' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      operationId: deleteHouseholdRestriction
      tags: [households]
      summary: Lift the restriction
      description: |
        Any `owner`. Returns the household to whatever state its subscription puts it in — which
        may not be `active`, if the subscription lapsed while the household was restricted. Lifting a
        restriction there is none of changes nothing and answers as the household stands.

        **Never refused with `402`.** A restriction you cannot lift is a household nobody can use.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { description: Lifted; the resulting state is in the body, content: { application/json: { schema: { $ref: '#/components/schemas/EntitlementSummary' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/invitations:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    get:
      operationId: getInvitations
      tags: [households]
      summary: The household's invitations
      description: Every invitation, newest first, whatever its `status`, to a member with `view` on `admin`, the module whose data they are.
      responses:
        '200': { description: Invitations, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Invitation' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      operationId: postInvitations
      tags: [households]
      summary: Invite a member
      description: |
        Owner only, and only once the owner's own address is verified (`403 account_unverified`).
        Carries the proposed role, the module grant matrix and optionally a starting dashboard
        layout, so what the invitee accepts is what they get; a module the matrix leaves out takes the
        role's default. A `child` is never invited: a child profile is created (`422` naming `/role`).
        `email` invitations expire in 14 days and are accepted by the one account with that address;
        one to an address with an invitation waiting, or a member's, is refused `422` naming `/email`.
        `link` invitations expire in 72 hours and are accepted by up to `max_uses` accounts. A household
        sends 20 invitations a day, resends included (`429`); one refused is not counted. The link is
        in the response once, which its `Idempotency-Key` does not keep.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/InvitationCreate' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Invitation' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/invitations/{invitation_id}:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/InvitationId' }]
    delete:
      operationId: deleteInvitationsByInvitationId
      tags: [households]
      summary: Revoke an invitation
      description: Owner only. Its email or link no longer works. An accepted invitation is a membership, and is not found here.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '204': { description: Revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/invitations/{invitation_id}/resend:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/InvitationId' }]
    post:
      operationId: postInvitationsByInvitationIdResend
      tags: [households]
      summary: Resend an email invitation
      description: |
        Owner only, once the owner's address is verified (`403 account_unverified`). Sends a new link,
        which replaces the old one, valid for another 14 days, from this owner. A declined, revoked or
        expired invitation is open again. A `link` invitation, which has no address, an accepted one,
        one to an address that is a member's by now, and one whose address has another invitation
        waiting are not found. Counted against the household's 20 invitations a day, unless it is
        refused.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '202': { description: Sent }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { description: 'Not an owner, or the owner''s address is unverified', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/children:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    post:
      operationId: postChildren
      tags: [households]
      summary: Create a managed child profile
      description: |
        Owner only. No email address is required and none is collected. The child signs in with the
        household code, their profile and a PIN. Child profiles are excluded from analytics entirely.

        `id` is the profile's: its account's and its membership's alike, the `user_id` its other
        operations name. Its levels are FR-AC4's defaults with `grants` over them: `manage`, or more
        than `view` on `finance`, is refused `422` naming `/grants/<module>`. It speaks the household's
        language, and its dashboard is locked unless `lock_dashboard` is false. A `year_of_birth`
        after this year in the household's timezone is refused `422`, and so is an `avatar_url` other
        than null: a picture is uploaded with `putChildrenByUserIdAvatar` once the profile exists. An `id` another account or profile has is refused `422` naming `/id`.
        No `Idempotency-Key` is kept, since its fingerprint would be a fast hash of the PIN: a repeat
        of one that was created answers `422` naming `/id`, and the profile is read at
        `getMembersByUserId`.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ChildProfileCreate' } } }
      responses:
        '201': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Membership' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/children/{user_id}/pin:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/UserId' }]
    put:
      operationId: putChildrenByUserIdPin
      tags: [households]
      summary: Set or reset a child's PIN
      description: |
        Owner only (FR-CH5). The new PIN replaces the old one and unlocks the profile, and every device
        the profile is signed in on is signed out, since whoever knew the old PIN may hold one of them
        (D-104); a sign-in that was checking the old PIN meanwhile signs nobody in. A member who is not
        a child profile answers `404`. No `Idempotency-Key` is kept, since its fingerprint would be a
        fast hash of the PIN: a repeat sets the same PIN again.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [pin], properties: { pin: { type: string, pattern: '^[0-9]{4,6}$' } } } } }
      responses:
        '204': { description: Set }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/children/{user_id}/unlock:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/UserId' }]
    post:
      operationId: postChildrenByUserIdUnlock
      tags: [households]
      summary: Unlock a child profile after failed PIN attempts
      description: |
        Owner only (FR-CH5). The wrong PINs counted since the last right one are cleared, and the
        profile's PIN works again, counting from the unlock: a sign-in that was checking a PIN
        meanwhile signs nobody in. A profile that is not locked is left as it is. A member who is not
        a child profile answers `404`.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '204': { description: Unlocked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/children/{user_id}/graduate:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/UserId' }]
    post:
      operationId: postChildrenByUserIdGraduate
      tags: [households]
      summary: Convert a child profile into a full member
      description: |
        Owner only, and only once the owner's own address is verified, since the link is trust extended
        beyond the household (FR-ID1): `403` (`account_unverified`) until then. Sends the address a
        link, valid 14 days, with which the young adult chooses a password
        (`postAuthGraduationConfirm`); that verifies the address and makes the profile a `member`,
        keeping everything it made (FR-CH4, D-104). The profile stays a child, signing in with its
        PIN, until then. Sending again sends a new link, to the same address or another, and the one
        before stops working. The link is its sender's, and lapses with their ownership, as an
        invitation does (D-103). An address an account has answers `409` (`email_taken`); a member who
        is not a child profile answers `404`. Each link counts among the twenty emails a day a
        household sends with its invitations (`429`), and so does each address refused `409`, since
        that refusal says an account has it.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string, format: email } } } } }
      responses:
        '202': { description: Link sent }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { description: 'Not an owner (`forbidden`), or the owner''s address is unverified (`account_unverified`)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'That address belongs to an account (`email_taken`)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/children/{user_id}/avatar:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/UserId' }]
    put:
      operationId: putChildrenByUserIdAvatar
      tags: [households]
      summary: Upload a child profile's picture
      description: |
        Owner only. The picture is made as `putMeAvatar` makes one, and is the child's account's, as a
        member's own picture is theirs: it counts against no household's storage (D-107). It replaces
        any picture the profile had, and moves the membership's version. A member who is not a child
        profile is not found.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/AvatarUpload' }
      responses:
        '200': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: The profile with its new picture, content: { application/json: { schema: { $ref: '#/components/schemas/Membership' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { description: Over 20 MB, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '415': { description: Not an image this server reads, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '502': { $ref: '#/components/responses/StorageUnavailable' }
    delete:
      operationId: deleteChildrenByUserIdAvatar
      tags: [households]
      summary: Remove a child profile's picture
      description: Owner only. The membership's version moves with it; a profile with no picture is answered as it is.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: The profile without a picture, content: { application/json: { schema: { $ref: '#/components/schemas/Membership' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/modules:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    get:
      operationId: getModules
      tags: [households]
      summary: Module enablement and the caller's effective level for each
      description: Any member, every module in the order of `ModuleKeyValue`.
      responses:
        '200': { description: Modules, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/ModuleState' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/modules/{module}:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/ModuleKey' }]
    patch:
      operationId: patchModulesByModule
      tags: [households]
      summary: Enable or disable a module for the household
      description: |
        Owner only. Disabling makes the module's routes `404`, removes its widgets, stops and retracts
        its sync entities, and **retains its data**. Re-enabling restores everything. `admin`, the
        household's settings, is never disabled (`403`).
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [enabled], properties: { enabled: { type: boolean } } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/ModuleState' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/exports:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    get:
      operationId: getExports
      tags: [households]
      summary: List household export jobs
      responses:
        '200': { description: Jobs, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/ExportJob' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      operationId: postExports
      tags: [households]
      summary: Request a full household export
      description: Owner only. Available in **every** entitlement state, including `read_only` and `canceled`.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '202': { description: Queued, content: { application/json: { schema: { $ref: '#/components/schemas/ExportJob' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

