      responses:
        '200': { description: The picture, content: { application/json: { schema: { $ref: '#/components/schemas/ChatStorage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/chat/search:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    get:
      operationId: getChatSearch
      tags: [chat]
      summary: Search within conversations the caller is in
      description: The floor applies — a member cannot search text they cannot read.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2 } }
        - { name: conversation_id, in: query, required: false, schema: { $ref: '#/components/schemas/Uuid' } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { description: Hits, content: { application/json: { schema: { $ref: '#/components/schemas/MessagePage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /platform/households:
    get:
      operationId: getPlatformHouseholds
      tags: [platform]
      summary: Search households — metadata only
      description: |
        **No endpoint under `/platform` returns household content.** There is no impersonation, no
        "view as", no content-reading endpoint, and no database role that bypasses row-level
        security for content tables but one, which no staff member, staff tool or support system
        connects with: PowerSync's replication role, the sync service's own credential (D-3, D-93),
        whose reach the generated streams and a read-path isolation test hold instead. This is
        enforced by the absence of a mechanism, not by policy.
      parameters:
        - { name: q, in: query, required: false, schema: { type: string }, description: 'Matches household id, name, or a member email.' }
        - { name: state, in: query, required: false, schema: { $ref: '#/components/schemas/EntitlementState' } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
