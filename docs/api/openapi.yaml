      summary: One property with its items and costs
      responses:
        '200': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: The property, content: { application/json: { schema: { $ref: '#/components/schemas/PropertyDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
