# Local development services (PL-8). `pnpm run up` starts them and waits until each is
# healthy; `pnpm run down` stops them and keeps their volumes. PowerSync (ADR 0001) is in the `sync`
# profile: it replicates only once `pnpm run db:setup` has made its role, its publication and its
# storage, and `pnpm run up:sync` starts it then. The converter sidecar (ADR 0015) is in the
# `convert` profile, built here from deploy/converter: `pnpm run up:convert` builds and starts it,
# and without it an office document or a PDF is kept download-only, with no preview.
#
# Every credential here is a public, well-known development default, so every port is
# published on 127.0.0.1 only. Override the ports in a `.env` beside this file
# (`.env.example` lists them).
name: household

services:
  postgres:
    # The CI service container in .github/workflows/ci.yml runs this same image, and
    # tooling/src/workspace.test.ts fails when the two disagree.
    image: postgres:17.11-trixie
    # Logical replication, which PowerSync streams from (ADR 0001). A replication slot keeps the
    # write-ahead log PowerSync has not read, up to max_slot_wal_keep_size, past which the slot is
    # lost and PowerSync replicates again from the start (docs/runbooks/replication-slot.md).
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
      - -c
      - max_slot_wal_keep_size=2GB
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: household
    ports:
      - 127.0.0.1:${HOUSEHOLD_PG_PORT:-5432}:5432
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      # Over TCP. On a fresh volume the image first runs a temporary server that listens
      # only on the Unix socket, then restarts; probing the socket would report healthy
      # during that window, before anything outside the container can connect.
      test: [CMD-SHELL, pg_isready --host=127.0.0.1 --username=postgres --dbname=household]
      interval: 2s
      timeout: 5s
      retries: 30

  # S3-compatible object storage. PL-8 named MinIO, whose repository is archived and
  # whose images are no longer published; RustFS speaks the same S3 API. The server makes its
  # bucket, `household`, when it starts in development; the Go tests make one of their own each.
  # The CI service container in .github/workflows/ci.yml runs this same image with these
  # credentials, and tooling/src/workspace.test.ts fails when the two disagree.
  objectstore:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: household
      RUSTFS_SECRET_KEY: household-local-only
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
    ports:
      - 127.0.0.1:${HOUSEHOLD_S3_PORT:-9000}:9000
      - 127.0.0.1:${HOUSEHOLD_S3_CONSOLE_PORT:-9001}:9001
    volumes:
      - objectstore:/data
    healthcheck:
      test: [CMD, curl, --fail, --silent, --show-error, http://127.0.0.1:9000/health]
      interval: 2s
      timeout: 5s
      retries: 30

  # LibreOffice headless and poppler behind the converter's own HTTP server (server/cmd/converter),
  # which the files pipeline derives an office document's PDF and a PDF's first page through. A
  # deployment runs it with no route out, since a document may name remote resources; here the API
  # runs on the host and reaches it at its published port.
  converter:
    build:
      context: .
      dockerfile: deploy/converter/Dockerfile
    image: household-converter:dev
    profiles: [convert]
    ports:
      - 127.0.0.1:${HOUSEHOLD_CONVERTER_PORT:-3100}:3100

  # Catches every email the server sends; nothing leaves the machine.
  mail:
    image: axllent/mailpit:v1.31.2
    ports:
      - 127.0.0.1:${HOUSEHOLD_SMTP_PORT:-1025}:1025
      - 127.0.0.1:${HOUSEHOLD_MAIL_UI_PORT:-8025}:8025

  # The sync engine's read half (ADR 0001, D-93): the Open Edition service, pinned, which the
  # conformance suite's stack runs too (tooling/src/workspace.test.ts holds the two to one image).
  # It fetches the keys it verifies a client's token with from the API on the host
  # (deploy/powersync/powersync.yaml).
  powersync:
    image: journeyapps/powersync-service:1.26.1
    profiles: [sync]
    command: [start, -r, unified]
    environment:
      POWERSYNC_CONFIG_PATH: /config/powersync.yaml
    volumes:
      - ./deploy/powersync:/config:ro
    ports:
      - 127.0.0.1:${HOUSEHOLD_POWERSYNC_PORT:-8081}:8080
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres:
  objectstore:
