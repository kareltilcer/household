# The page of primitives opens on a device, and a sheet opens over it and closes (plan item
# 28): React Native's `Modal`, the sheet's own close control, and the screen behind it back in
# reach when it has gone. What a sheet does with the focus and with what is behind it is its
# own Jest test; this reads that the native half of it is there.
#
# Written ahead of the controls, against names their dev page does not have yet: `awaiting`
# keeps it out of every run until the controls are merged, the three names below are theirs or
# are replaced by theirs, and the tag is taken off.
appId: com.kareltilcer.household.dev
tags:
  - awaiting
---
- launchApp
- extendedWaitUntil:
    visible:
      id: 'route:.*'
    timeout: 60000
- openLink: household-dev:///dev/primitives
- extendedWaitUntil:
    visible:
      id: 'household-dev-screen:primitives'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'dev-controls:sheet:open'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'dev-controls:sheet:open'
- extendedWaitUntil:
    visible:
      id: 'dev-controls:sheet'
    timeout: 15000
- takeScreenshot: sheet
- tapOn:
    id: 'dev-controls:sheet:close'
- extendedWaitUntil:
    notVisible:
      id: 'dev-controls:sheet'
    timeout: 15000
# The opener is in reach again: the page behind the sheet takes a press once it has closed.
- assertVisible:
    id: 'dev-controls:sheet:open'
