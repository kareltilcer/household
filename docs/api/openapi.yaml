              occurrences: { type: array, items: { $ref: '#/components/schemas/ChoreOccurrence' } }
        household_progress: { type: object, properties: { done: { type: integer }, total: { type: integer } } }

    ChoreSwapCreate:
      type: object
      required: [id, occurrence_id, to_user_id]
      properties: { id: { $ref: '#/components/schemas/Uuid' }, occurrence_id: { $ref: '#/components/schemas/Uuid' }, to_user_id: { $ref: '#/components/schemas/Uuid' }, note: { type: string } }

    ChoreSwap:
      type: object
      required: [id]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        occurrence_id: { $ref: '#/components/schemas/Uuid' }
        from: { $ref: '#/components/schemas/ActorRef' }
        to: { $ref: '#/components/schemas/ActorRef' }
        status: { type: string, enum: [requested, accepted, declined] }
        note: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }

    ChorePointEntry:
      type: object
      required: [id]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        user: { $ref: '#/components/schemas/ActorRef' }
        points: { type: integer, description: Negative for a deduction. }
        reason: { type: string, description: Required. A silent deduction is worse than none. }
        kind: { type: string, enum: [chore, bonus, penalty, redemption, adjustment] }
        occurrence_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        by: { $ref: '#/components/schemas/ActorRef' }
        created_at: { type: string, format: date-time }

    ChorePointEntryCreate:
      type: object
      required: [id, user_id, points, reason]
      properties: { id: { $ref: '#/components/schemas/Uuid' }, user_id: { $ref: '#/components/schemas/Uuid' }, points: { type: integer }, reason: { type: string, minLength: 1 } }

    ChorePointPage:
      type: object
      required: [items, meta]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ChorePointEntry' } }
