        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/pets/{pet_id}/health:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/PetId' }]
    get:
      operationId: getPetsByPetIdHealth
      tags: [pets]
      summary: The health record
      parameters:
        - { name: type, in: query, required: false, schema: { $ref: '#/components/schemas/PetHealthEntryType' } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/DateCursor' }
      responses:
        '200': { description: Entries, content: { application/json: { schema: { $ref: '#/components/schemas/PetHealthPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      operationId: postPetsByPetIdHealth
      tags: [pets]
      summary: Add a health entry
      description: Vaccination, treatment, condition, procedure, weight or note. `additive` offline — a record of something that happened.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PetHealthEntryCreate' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/PetHealthEntry' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/pets/health/{entry_id}:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { name: entry_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }]
    patch:
      operationId: patchPetsHealthByEntryId
      tags: [pets]
      summary: Correct a health entry
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PetHealthEntryUpdate' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/PetHealthEntry' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      operationId: deletePetsHealthByEntryId
      tags: [pets]
      summary: Delete a health entry
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/pets/{pet_id}/medications:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/PetId' }]
    get:
      operationId: getPetsByPetIdMedications
      tags: [pets]
      summary: Medication courses with their dose occurrences
      responses:
        '200': { description: Medications, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/PetMedication' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      operationId: postPetsByPetIdMedications
      tags: [pets]
      summary: Start a medication course
      description: |
        A dose, a frequency and a course length produce **per-dose occurrences** a member ticks.
        A twice-daily antibiotic for ten days is exactly the situation where "did you already give
        it" is a real question with a bad answer.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PetMedicationCreate' } } }
      responses:
        '201': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/PetMedication' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/pets/medications/{medication_id}:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { name: medication_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }]
    patch:
      operationId: patchPetsMedicationsByMedicationId
      tags: [pets]
      summary: Update or end a medication course
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PetMedicationUpdate' } } }
      responses:
        '200': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/PetMedication' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/pets/doses/{dose_id}:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { name: dose_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }]
    put:
      operationId: putPetsDosesByDoseId
      tags: [pets]
      summary: Record or unrecord a dose
      description: |
        **Desired state, not a toggle**, and completion is **shared** — anyone in the household can
        record a dose and everyone sees it immediately, because "did you already give it" must have
        one answer.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [given], properties: { given: { type: boolean }, note: { type: string }, client_time: { type: string, format: date-time } } } } }
      responses:
        '200': { description: Recorded, content: { application/json: { schema: { $ref: '#/components/schemas/PetMedicationDose' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/pets/{pet_id}/routine:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/PetId' }]
    get:
      operationId: getPetsByPetIdRoutine
      tags: [pets]
      summary: Today's routine, showing who did what and when
      description: |
        Deliberately not Chores — a chore has a rotation, points and a schedule; a pet's daily
        routine is a shared checklist that resets, and modelling it as chores makes it heavier than
        it deserves.
      parameters: [{ name: for_date, in: query, required: false, schema: { type: string, format: date } }]
      responses:
        '200': { description: The routine, content: { application/json: { schema: { $ref: '#/components/schemas/PetRoutineDay' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      operationId: postPetsByPetIdRoutine
      tags: [pets]
      summary: Add a routine item
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PetRoutineItemCreate' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/PetRoutineItem' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/pets/routine-items/{item_id}/done:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/ItemId' }]
    put:
      operationId: putPetsRoutineItemsByItemIdDone
      tags: [pets]
      summary: Mark a routine item done or not done for a day
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [for_date, done], properties: { for_date: { type: string, format: date }, done: { type: boolean }, client_time: { type: string, format: date-time } } } } }
      responses:
        '200': { description: Recorded, content: { application/json: { schema: { $ref: '#/components/schemas/PetRoutineCompletion' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/pets/{pet_id}/vet:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/PetId' }]
    put:
      operationId: putPetsByPetIdVet
      tags: [pets]
      summary: Set the vet practice and out-of-hours number
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PetVetUpsert' } } }
      responses:
        '200': { description: Set, content: { application/json: { schema: { $ref: '#/components/schemas/PetVet' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/chat/conversations:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    get:
      operationId: getChatConversations
      tags: [chat]
      summary: Conversations the caller is in
      description: |
        `last_message` is **bounded by the caller's floor** and is null both for a room nobody has
        written in and for a member whose floor sits above everything written so far.
      parameters: [{ name: include_deleted, in: query, required: false, schema: { type: boolean, default: false } }]
      responses:
        '200': { description: Conversations, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Conversation' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      operationId: postChatConversations
      tags: [chat]
      summary: Create a group conversation
      description: A `general` conversation containing every member is created with the household and cannot be deleted.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ConversationCreate' } } }
      responses:
        '201': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Conversation' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/chat/conversations/{conversation_id}:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/ConversationId' }]
    get:
      operationId: getChatConversationsByConversationId
      tags: [chat]
      summary: One conversation
      description: A conversation the caller is not in **does not exist** as far as this API is concerned — `404`, never `403`.
      responses:
        '200': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: The conversation, content: { application/json: { schema: { $ref: '#/components/schemas/ConversationDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    patch:
      operationId: patchChatConversationsByConversationId
      tags: [chat]
      summary: Rename a conversation
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { name: { type: string }, icon: { type: string } } } } }
      responses:
        '200': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Conversation' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      operationId: deleteChatConversationsByConversationId
      tags: [chat]
      summary: Delete a conversation
      parameters: [{ $ref: '#/components/parameters/Hard' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The general conversation cannot be deleted, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/chat/conversations/{conversation_id}/restore:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/ConversationId' }]
    post:
      operationId: postChatConversationsByConversationIdRestore
      tags: [chat]
      summary: Restore a soft-deleted conversation
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '204': { description: Restored }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/chat/conversations/{conversation_id}/members:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/ConversationId' }]
    get:
      operationId: getChatConversationsByConversationIdMembers
      tags: [chat]
      summary: Conversation members with their floors
      responses:
        '200': { description: Members, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/ConversationMember' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      operationId: postChatConversationsByConversationIdMembers
      tags: [chat]
      summary: Add a member
      description: |
        The new member receives an `effective_from` **floor** and sees nothing before it — somebody
        added today should not be handed the household's back catalogue.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [user_id], properties: { user_id: { $ref: '#/components/schemas/Uuid' } } } } }
      responses:
        '201': { description: Added, content: { application/json: { schema: { $ref: '#/components/schemas/ConversationMember' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/chat/conversations/{conversation_id}/members/{user_id}:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/ConversationId' }, { $ref: '#/components/parameters/UserId' }]
    delete:
      operationId: deleteChatConversationsByConversationIdMembersByUserId
      tags: [chat]
      summary: Remove a member
      description: Emits sync retractions for everything they can no longer see.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/chat/conversations/{conversation_id}/messages:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/ConversationId' }]
    get:
      operationId: getChatConversationsByConversationIdMessages
      tags: [chat]
      summary: Messages, newest first, bounded by the caller's floor
      parameters: [{ $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' }]
      responses:
        '200': { description: Messages, content: { application/json: { schema: { $ref: '#/components/schemas/MessagePage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      operationId: postChatConversationsByConversationIdMessages
      tags: [chat]
      summary: Send a message
      description: |
        The message reaches its conversation's members through its stream on PowerSync's
        connection, as every row does (D-93, D-124): its readers, the members whose floor it is at or
        above, are written with it.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MessageCreate' } } }
      responses:
        '201': { description: Sent, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { description: Read-only participation — `view` can read but not post, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/chat/messages/{message_id}:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/MessageId' }]
    patch:
      operationId: patchChatMessagesByMessageId
      tags: [chat]
      summary: Edit one's own message within the edit window
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [body], properties: { body: { type: string } } } } }
      responses:
        '200': { description: Edited, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The edit window has closed, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      operationId: deleteChatMessagesByMessageId
      tags: [chat]
      summary: Delete a message
      description: Tombstoned, showing "message deleted" in place.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/chat/messages/{message_id}/reactions:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/MessageId' }]
    put:
      operationId: putChatMessagesByMessageIdReactions
      tags: [chat]
      summary: Set a reaction
      description: |
        Takes the **desired state**, not a toggle, because the gesture that drives it is a double tap
        — a gesture fires twice far more easily than a button does, and a toggle applied twice lands
        on the opposite of what the member meant. The emoji rides in the body, never in the path.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [emoji, reacted], properties: { emoji: { type: string }, reacted: { type: boolean } } } } }
      responses:
        '200': { description: Set, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: Not one of the supported emoji, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ValidationProblem' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/chat/conversations/{conversation_id}/read:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/ConversationId' }]
    put:
      operationId: putChatConversationsByConversationIdRead
      tags: [chat]
      summary: Advance the caller's read marker
      description: Monotonic — a read marker only ever moves forward.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [last_read_message_id], properties: { last_read_message_id: { $ref: '#/components/schemas/Uuid' } } } } }
      responses:
        '200': { description: Advanced, content: { application/json: { schema: { $ref: '#/components/schemas/ConversationMember' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/chat/conversations/{conversation_id}/attachments:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { $ref: '#/components/parameters/ConversationId' }]
    post:
      operationId: postChatConversationsByConversationIdAttachments
      tags: [chat]
      summary: Upload an attachment
      description: Same sniffing, size caps and quota enforcement as Documents. Counts toward the storage meter, which is why the clean-up page exists.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/ChatAttachmentUpload' }
      responses:
        '201': { description: Uploaded, content: { application/json: { schema: { $ref: '#/components/schemas/ChatAttachment' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { description: Over the size cap, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '415': { description: A blocked type, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '502': { $ref: '#/components/responses/StorageUnavailable' }

  /households/{household_id}/chat/attachments/{attachment_id}:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { name: attachment_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }]
    get:
      operationId: getChatAttachmentsByAttachmentId
      tags: [chat]
      summary: A short-lived link to an attachment or its thumbnail
      parameters: [{ name: variant, in: query, required: false, schema: { type: string, enum: [original, thumbnail], default: original } }]
      responses:
        '200': { description: A signed link, content: { application/json: { schema: { $ref: '#/components/schemas/ContentLink' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      operationId: deleteChatAttachmentsByAttachmentId
      tags: [chat]
      summary: Delete an attachment
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/chat/attachments/{attachment_id}/move-to-documents:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { name: attachment_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }]
    post:
      operationId: postChatAttachmentsByAttachmentIdMoveToDocuments
      tags: [chat]
      summary: Move an attachment into Documents
      description: |
        A **custody transfer, not a copy** — the bytes move to the documents prefix, the message
        keeps a reference, and the household stops paying for it twice.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: false
        content: { application/json: { schema: { type: object, properties: { folder_id: { $ref: '#/components/schemas/Uuid' }, title: { type: string } } } } }
      responses:
        '200': { headers: { ETag: { $ref: '#/components/headers/ETag' } }, description: Moved, content: { application/json: { schema: { $ref: '#/components/schemas/Document' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { description: The caller lacks `contribute` on Documents, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/chat/storage:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    get:
      operationId: getChatStorage
      tags: [chat]
