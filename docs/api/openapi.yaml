      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [accepted], properties: { accepted: { type: boolean }, note: { type: string } } } } }
      responses:
        '200': { description: Recorded }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Mobile clients. A 15-minute EdDSA access token carrying only `sub`, `sid`, `iat`, `exp` and
        `client` — **no roles and no grants**, so revoking access takes effect on the next request
        rather than in fifteen minutes.
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-hh_session
      description: |
        Web clients. `HttpOnly; Secure; SameSite=Lax; Path=/`, lasting 30 days from the session's
        last use. State-changing requests additionally require `X-CSRF-Token` matching the readable
        `__Host-hh_csrf` cookie, the token the session was given, and an `Origin` on the allowlist;
        without them they answer `403` (`csrf_failed`). The CSRF cookie carries the `__Host-`
        prefix as the session cookie does, so a sibling subdomain cannot set it.

  parameters:
    HouseholdId:
      name: household_id
      in: path
      required: true
      description: The tenant. Resolved in middleware, which verifies membership and sets the database tenant context.
      schema: { $ref: '#/components/schemas/Uuid' }
    UserId: { name: user_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    SessionId: { name: session_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    DeviceId: { name: device_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    ExportId: { name: export_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    InvitationId: { name: invitation_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    BoardId: { name: board_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    ColumnId: { name: column_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    CardId: { name: card_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    CalendarId: { name: calendar_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    EventId: { name: event_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    ConnectionId: { name: connection_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    ListId: { name: list_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    ItemId: { name: item_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    ChoreId: { name: chore_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    OccurrenceId: { name: occurrence_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    NoteId: { name: note_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    FolderId: { name: folder_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    DocumentId: { name: document_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    AccountId: { name: account_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    TransactionId: { name: transaction_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    ServiceId: { name: service_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    MeterId: { name: meter_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    TariffId: { name: tariff_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    PeriodId: { name: period_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    CropId: { name: crop_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    BedId: { name: bed_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    PlantingId: { name: planting_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    GardenTaskId: { name: task_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    SeasonYear: { name: year, in: path, required: true, schema: { type: integer, minimum: 1900, maximum: 2200 } }
    VehicleId: { name: vehicle_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    PetId: { name: pet_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    ConversationId: { name: conversation_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    MessageId: { name: message_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    ModuleKey:
      name: module
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ModuleKeyValue' }
    AssetEntityType:
      name: entity_type
      in: path
      required: true
      description: Which module owns the asset. The service engine is shared by Property, Vehicles and Pets.
      schema: { type: string, enum: [property_item, vehicle, pet] }
    AssetEntityId: { name: entity_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }

    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      required: false
      description: An opaque keyset cursor from a previous response. A malformed cursor is `422`, never a silent page one.
      schema: { type: string }
    DateCursor:
      name: cursor
      in: query
      required: false
      description: |
        An opaque cursor keyed on the collection's **natural chronological key** rather than on the
        row id, because ordering by a generated id misplaces a back-filled row. A malformed cursor
        is `422`.
      schema: { type: string }
    IncludeArchived:
      name: include_archived
      in: query
      required: false
      schema: { type: boolean, default: false }
    Hard:
      name: hard
      in: query
      required: false
      description: Purge rather than soft-delete. Requires `manage`, and for documents also purges object storage.
      schema: { type: boolean, default: false }
    Cascade:
      name: cascade
      in: query
      required: false
      description: Delete children too. Without it a non-empty container answers `409` with the child count.
      schema: { type: boolean, default: false }
    RootScope:
      name: root
      in: query
      required: false
      description: |
        Which tree to address. `shared` is the household's; `private` is the caller's own private
        root. A household with N members has `1 + N` roots per module.
      schema: { type: string, enum: [shared, private], default: shared }
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: |
        The entity-tag the client last saw, as returned in that representation's `ETag` response
        header — the `version` in decimal, in double quotes: `If-Match: "42"`. RFC 9110 defines
        `If-Match` over entity-tags, so a bare integer is malformed and intermediaries and standard
        HTTP libraries may reject or drop it.

        A mismatch answers `409` with the current representation.

        **Omitting it writes unconditionally.** There is no concurrency check, so a member holding
        a stale representation silently overwrites whatever changed underneath it — last write
        wins, and the loser is never told. The header is optional only so that a create-then-edit
        on a row the client has never read is not forced to invent an entity-tag; any client that
        is editing a representation it read **must** send the tag it read. The offline path states
        the same rule per mutation as `base_version`, whose absence is likewise an unconditional
        apply.
      schema: { type: string, pattern: '^(W/)?"[^"]+"$', examples: ['"42"'] }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Accepted on every unsafe method. Retained 7 days; replaying a key returns the stored result
        rather than repeating the effect. An offline-first client that retries a `POST` whose
        response was lost needs this to avoid creating the row twice — declaring it on the
        operation is what lets a generated client send it at all.

        A key is the caller's own, so a request made before signing in, which has no caller, keeps
        none, and a repeat of it runs again (see the description of the API); nor does a request
        whose body carries a password, `/auth/password`, or a child profile's PIN, `postChildren` and
        `putChildrenByUserIdPin`. A repeat of a request that ended the
        session it was made with, signing out for instance, answers `401`: that session makes no
        further request. Only a `2xx` response is stored: a repeat of a request that was refused
        before it took effect runs it again. A repeat while the first request is still running
        answers `409` (`idempotency_in_progress`). So does a repeat of a request that took effect
        but whose response was not kept, because the server stopped before storing it, the body was
        larger than 1 MiB, or the request was answered with anything but `2xx` after it took
        effect, until the key expires: running it again would repeat the effect. A first request
        that has not taken effect five minutes after it arrived is taken to have failed: a repeat
        then runs it, and the first, if it is still running, can no longer take effect and answers
        `409` (`idempotency_in_progress`) itself. A key reused for a request with a different
        method, path, query, `If-Match`, `Content-Type` or JSON body answers `422` naming
        `header:Idempotency-Key`. A multipart form, an upload, is compared by its media type
        without its `boundary`, and neither by its length nor by its bytes: a client draws a form's
        boundary afresh each time it sends it, some browsers of more than one length, so the same
        upload sent again differs in both. A key is drawn for one upload, and one sent again with
        another upload to the same route is answered as the first was. Any other body that is not
        JSON is compared by its length alone.
      schema: { type: string, minLength: 1, maxLength: 128 }
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Retained 7 days; replaying returns the stored result. Required here because clients retry
        batches wholesale. A repeat while the first request is still running answers `409`
        (`idempotency_in_progress`), for five minutes, after which a repeat runs a first request
        that has not taken effect; a key reused for a different request answers `422`.
      schema: { type: string, minLength: 1, maxLength: 128 }

  headers:
    ETag:
      description: |
        The entity-tag of this representation — the entity's `version` in decimal, in double
        quotes. Send it back in `If-Match` on the next unsafe request to get optimistic
        concurrency. Emitting it is what makes `If-Match` a standard HTTP exchange rather than a
        private protocol wearing a standard header's name: without it a client would have to dig
        `version` out of the JSON body and hand-build the header.
      schema: { type: string, examples: ['"42"'] }

  responses:
    Unauthorized:
      description: No credential, or an invalid or expired one.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Forbidden:
      description: |
        The caller may see the resource but not perform this action. **Never used for a resource
        the caller may not see** — that is `404`, because a `403` is an existence oracle. A create
        that would take the household past a fair-use ceiling is `fair_use_ceiling`, naming the
        `resource` and its `ceiling` (PRD 04 §5).
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/FairUseProblem' } } }
    NotFound:
      description: |
        Not found, **or** not visible to the caller — a module they have `none` on, a private item
        they do not own, a conversation they are not in, or anything in a `suspended` household. The
        two are deliberately indistinguishable.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Unprocessable:
      description: Validation failed. `errors` names each offending field.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ValidationProblem' } } }
    VersionConflict:
      description: |
        The `If-Match` version did not match. The current representation is returned so the client
        can merge or re-present. A `409` from an operation that accepts `Idempotency-Key` can
        instead be `idempotency_in_progress`, a plain `Problem` with no `current`, so a client
        switches on `code` before it reads `current`.
      headers: { ETag: { $ref: '#/components/headers/ETag' } }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ConflictProblem' } } }
    PaymentRequired:
      description: |
        The household's entitlement state does not permit this. `grace` and `read_only` block
        uploads and writes respectively; `restricted` blocks writes at the owner's own request
        (GDPR Art. 18); over-quota blocks uploads. Switch on `code` to tell them apart —
        `entitlement_read_only` is "somebody needs to pay", `entitlement_restricted` is "an owner
        turned this off and can turn it back on", and `storage_ceiling_reached` is "the household
        stores as much as it may": an upload that would take it past the storage ceiling (FR-FL4,
        D-33), with `over_by_bytes` and `blocks_at_ceiling`, whose remedy is `free_storage`.

        **Reads, downloads and exports are never blocked with `402`, in any state**, and neither are
        billing, export, household deletion, leaving, setting or lifting a restriction, or a
        replica's credentials; a `suspended` household answers every one of its routes `404`
        instead, these too (D-115). `remedy` is what fixes it, for the caller: an owner is told to
        `subscribe`, to `update_payment_method` after a failed payment, or to `lift_restriction`;
        anyone else to `contact_owner`, since only an owner can (FR-BI5).
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/EntitlementProblem' } } }
    StorageUnavailable:
      description: |
        The object store could not be reached, and nothing was committed: the upload may be sent
        again (FR-NF3). What is already stored still reads, and its links still work.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    RateLimited:
      description: Too many requests. Limits are per user **and** per household, so one tenant cannot degrade another.
      headers:
        Retry-After: { schema: { type: integer }, description: Seconds }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }

  schemas:

    Uuid:
      type: string
      format: uuid
      pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
      description: |
        A UUIDv7. Clients generate them for entities they create — an offline create must have a
        stable identity immediately.

        The `pattern` is asserted rather than left to `format`, which is annotation-only in JSON
        Schema 2020-12. It is what keeps an id path segment from capturing a literal one: without
        it `/pets/health/{entry_id}` and `/pets/{pet_id}/health` both match `/pets/health/health`,
        and which route wins is decided by framework registration order rather than by this
        contract.
      examples: ['0190f3a2-4c1b-7c3e-9a5f-2b6d8e4f1a90']

    ModuleKeyValue:
      type: string
      enum: [dashboard, tasks, reminders, calendar, shopping, chores, notes, documents, finance, utilities, garden, property, vehicles, pets, chat, activity, admin]

    AccessLevel:
      type: string
      enum: [none, view, contribute, manage]
      description: |
        `none` means **absent**, not hidden — the module's routes `404`, its entities never sync, its
        widgets are not listed, its events are filtered out, and its deep links resolve to a neutral
        screen. `manage` is required for structural changes and hard deletes.

    HouseholdRole:
      type: string
      enum: [owner, member, child]
      description: '`owner` implies `manage` everywhere. A `child` can never be granted `manage` on any module.'

    ClientType:
      type: string
      enum: [web, mobile]

    Via:
      type: string
      enum: [web, mobile, dashboard, sync, import, system]
      description: Recorded on the audit event, so "did I do this on my phone or did the importer?" is answerable.

    Money:
      type: object
      required: [amount_minor, currency]
      description: An integer in the currency's minor unit plus an ISO 4217 code. **Never a float.**
      properties:
        amount_minor: { type: integer, format: int64, description: 'Minor units. The exponent comes from ISO 4217 reference data and is not assumed to be 2.' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
      examples: [{ amount_minor: 145050, currency: 'CZK' }]

    ForeignAmount:
      type: object
      description: |
        Present when a transaction was entered in a currency other than the household's base. The
        rate is **captured at entry and stored on the row** — re-converting history with live rates
        would mean last month's total changes every time it is looked at.
      required: [original, fx_rate, fx_source]
      properties:
        original: { $ref: '#/components/schemas/Money' }
        fx_rate: { type: string, description: 'Decimal as a string, to avoid a float anywhere near money.' }
        fx_source: { type: string, enum: [manual, ecb_reference] }
        fx_captured_on: { type: string, format: date }

    ProblemCode:
      type: string
      description: |
        The stable, machine-readable discriminator clients switch on. Enumerated rather than left
        an open string so that a generated client gets exhaustiveness checking and a renamed or
        removed code breaks the build instead of failing silently at runtime, and so that server
        and client cannot drift on spelling.

        Every value below corresponds to a condition this document describes on some response,
        except the protocol-level codes, which no operation declares: `method_not_allowed`
        (`405`, a method the path does not serve, with an `Allow` header) and `internal` (`500`,
        a failure the caller cannot act on), which any operation can answer with,
        `idempotency_in_progress` (`409`, a repeated `Idempotency-Key` whose first request is
        still running or whose response was not kept), which any operation that accepts
        `Idempotency-Key` can, `csrf_failed` (`403`, an unsafe request from an origin that is
        not Household's own, or one the session cookie authenticates without its CSRF token),
        which any unsafe operation can, and `update_required` (`400`, a client older than the
        oldest version the server serves, an `UpdateRequiredProblem`), which any operation can.
        Adding a code is a contract change and belongs in the same review as the endpoint that
        raises it.
      enum:
        # Cross-cutting — the reusable responses in `components.responses`
        - unauthenticated
        - forbidden
        - not_found
        - validation_failed
        - version_conflict
        - entitlement_read_only
        - entitlement_restricted
        - rate_limited
        # Protocol-level — declared on no operation (see the description)
        - method_not_allowed
        - internal
        - idempotency_in_progress
        - csrf_failed
        - update_required
        # Authentication and identity
        - invalid_credentials
        - refresh_token_invalid
        - account_disabled
        - account_unverified
        - email_taken
        - mfa_required
        - mfa_locked
        - child_profile_locked
        - link_required
        - identity_already_linked
        - only_credential
        - token_expired
        - token_already_used
        - redirect_uri_not_registered
        # Households, membership and billing
        - household_limit_reached
        - fair_use_ceiling
        - last_owner
        - billing_payer
        - storage_ceiling_reached
        - account_deletion_blocked
        - layout_locked
        - read_only_participation
        # Sync
        - resnapshot_required
        - batch_too_large
        # Generic resource conflicts
        - not_empty
        - in_use
        - duplicate_date
        - duplicate_year
        - already_closed
        - not_closed
        - edit_window_closed
        - season_closed
        - slug_conflict
        - undeletable
        - variant_pending
        - catalog_rule
        - cycle
        # Domain rules
        - insufficient_balance
        - monotonicity_violation
        - coverage_gap
        - period_overlap
        - no_period
        - no_income
        - no_reference_rate
        # Payloads
        - payload_too_large
        - unsupported_media_type
        - storage_unavailable

    Problem:
      type: object
      description: RFC 9457. Clients switch on `code`, never on `detail`, which is human-readable and translated.
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code: { $ref: '#/components/schemas/ProblemCode' }
        detail: { type: string }
        instance: { type: string }
        request_id: { type: string }

    UpdateRequiredProblem:
      description: 'The `400 update_required` any operation answers a client older than the oldest version the server serves (see Clients in the description of the API).'
      allOf:
        - { $ref: '#/components/schemas/Problem' }
        - type: object
          required: [minimum_version]
          properties:
            minimum_version: { type: string, description: 'The oldest version of the client''s type the server serves, MAJOR.MINOR.PATCH.', examples: ['1.6.0'] }

    ValidationProblem:
      allOf:
        - { $ref: '#/components/schemas/Problem' }
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              items:
                type: object
                required: [field, code]
                properties:
                  field:
                    type: string
                    description: |
                      An RFC 6901 JSON Pointer into the request body, empty for the body as a
                      whole; or, for a parameter, `<in>:<name>` as declared, such as `query:limit`.
                    examples: ['/name', 'query:limit']
                  code:
                    type: string
                    description: |
                      The check that failed, in snake_case — a JSON Schema keyword such as
                      `required` or `max_length`; `malformed` for a value that does not parse; or
                      `invalid` for a refusal no keyword names, such as a body on an operation
                      that takes none.
                    examples: [required, max_length, malformed, invalid]
                  message: { type: string }

    ConflictProblem:
      allOf:
        - { $ref: '#/components/schemas/Problem' }
        - type: object
          required: [current, current_version]
          properties:
            current: { description: 'The server''s current representation, so the client can merge or re-present the member''s change.' }
            current_version: { type: integer, format: int64 }

    NonEmptyProblem:
      allOf:
        - { $ref: '#/components/schemas/Problem' }
        - type: object
          properties:
            child_count: { type: integer }

    EntitlementProblem:
      allOf:
        - { $ref: '#/components/schemas/Problem' }
        - type: object
          required: [state, remedy]
          properties:
            state: { $ref: '#/components/schemas/EntitlementState' }
            remedy: { type: string, enum: [subscribe, update_payment_method, free_storage, contact_owner, lift_restriction] }
            over_by_bytes: { type: integer, format: int64 }
            blocks_at_ceiling: { type: integer, description: 'Set when the block ceiling was reached. Uploads stop; reads, downloads and exports never do.' }

    FairUseProblem:
      description: 'A `403`. When `code` is `fair_use_ceiling` or `household_limit_reached`, a create that would pass a fair-use ceiling (PRD 04 §5): `resource` names it, and `module` the module whose rows they are.'
      allOf:
        - { $ref: '#/components/schemas/Problem' }
        - type: object
          properties:
            resource: { type: string, enum: [members, rows, objects] }
            ceiling: { type: integer }
            module: { $ref: '#/components/schemas/ModuleKeyValue' }

    AccountDeletionBlocked:
      allOf:
        - { $ref: '#/components/schemas/Problem' }
        - type: object
          properties:
            sole_owned_households:
              type: array
              items:
                type: object
                properties:
                  household_id: { $ref: '#/components/schemas/Uuid' }
                  name: { type: string }
                  member_count: { type: integer }
            billing_payer_for: { type: array, items: { $ref: '#/components/schemas/Uuid' } }

    LeaveBlockedProblem:
      description: 'Why the caller cannot leave yet (FR-HH4): `code` is `last_owner` when they are the last owner and `billing_payer` otherwise, and `blocked_by` lists every reason at once.'
      allOf:
        - { $ref: '#/components/schemas/Problem' }
        - type: object
          required: [blocked_by]
          properties:
            blocked_by: { type: array, minItems: 1, items: { type: string, enum: [last_owner, billing_payer] } }

    DocumentReferencedProblem:
      allOf:
        - { $ref: '#/components/schemas/Problem' }
        - type: object
          properties:
            references:
              type: array
              description: What points at this document, named in words — 'the service invoice on your Škoda'.
              items:
                type: object
                properties:
                  module: { $ref: '#/components/schemas/ModuleKeyValue' }
                  entity_type: { type: string }
                  entity_id: { $ref: '#/components/schemas/Uuid' }
                  label: { type: string }

    PageMeta:
      type: object
      required: [has_more]
      properties:
        next_cursor: { type: [string, 'null'] }
        has_more: { type: boolean }

    Readiness:
      type: object
      properties:
        status: { type: string, enum: [ok, degraded, down] }
        checks:
          type: object
          additionalProperties: { type: string, enum: [ok, down] }

    LocalizedText:
      type: object
      description: |
        One text in each language Household ships (PRD 03 §9): reference data is translated as
        data, not as strings. A client shows its member's language. A language added later arrives
        as a further member, which a client that does not know it ignores.
      required: [en, cs, sk, de, pl]
      properties:
        en: { type: string }
        cs: { type: string }
        sk: { type: string }
        de: { type: string }
        pl: { type: string }
      additionalProperties: { type: string }

    CountryCode:
      type: string
      pattern: '^[A-Z]{2}$'
      description: ISO 3166-1 alpha-2. The United Kingdom is `GB`.
      examples: ['CZ']

    UnitSystem:
      type: string
      enum: [metric, imperial]
      description: Metric by default, imperial available for length, area, mass, temperature and volume (PRD 03 §9).

    Country:
      type: object
      description: |
        What a household in the country is offered: the defaults it starts from, and the keys of
        the country's own sets, which the modules that offer them define. Changing a household's
        country changes what it is offered from then on, never what it has recorded (FR-HA1).
      required: [code, version, name, currency, vat_standard_percent, default_units, first_day_of_week, holiday_set, inspection_label, document_type_set]
      properties:
        code: { $ref: '#/components/schemas/CountryCode' }
        version: { type: integer, format: int64, description: Incremented each time the profile changes. }
        name: { $ref: '#/components/schemas/LocalizedText' }
        currency: { type: string, pattern: '^[A-Z]{3}$', description: 'The country''s currency, ISO 4217: the base currency a household created there starts with.' }
        vat_standard_percent: { type: string, examples: ['21'], description: 'The standard rate of VAT, a decimal percent as a string: the rate a tariff or an expense in the country starts from.' }
        default_units: { $ref: '#/components/schemas/UnitSystem' }
        first_day_of_week: { type: integer, minimum: 0, maximum: 6, description: 'The day a week starts on in the country, 0 for Sunday to 6 for Saturday, as JavaScript''s Date#getDay and Go''s time.Weekday count. A household and each member may override it.' }
        holiday_set: { type: string, examples: ['cz'], description: 'The key of the country''s set of public holidays, which Calendar offers.' }
        inspection_label: { type: string, examples: ['STK'], description: 'The country''s own word for the statutory vehicle inspection (STK, TK, HU/AU, Przegląd techniczny, MOT), shown as it is in every language.' }
        document_type_set: { type: string, examples: ['cz'], description: 'The key of the country''s set of document types, which Documents offers.' }

    CountryList:
      type: object
      required: [version, items]
      properties:
        version: { type: integer, format: int64, description: 'The dataset''s version: incremented whenever a profile changes, 0 before any is loaded.' }
        items: { type: array, items: { $ref: '#/components/schemas/Country' } }

    UnitDimension:
      type: object
      description: A kind of quantity, and the unit its units convert to.
      required: [key, version, name, base_unit]
      properties:
        key: { type: string, examples: ['length'] }
        version: { type: integer, format: int64, description: Incremented each time the dimension changes. }
        name: { $ref: '#/components/schemas/LocalizedText' }
        base_unit: { type: string, examples: ['m'], description: The key of the unit every unit of the dimension converts to. }

    Unit:
      type: object
      required: [key, version, dimension, system, symbol, cldr, name, to_base, counterpart]
      properties:
        key: { type: string, examples: ['km'] }
        version: { type: integer, format: int64, description: Incremented each time the unit changes. }
        dimension: { type: string, examples: ['length'] }
        system: { $ref: '#/components/schemas/UnitSystem' }
        symbol: { type: string, examples: ['km'], description: The same in every language. }
        cldr: { type: string, examples: ['kilometer'], description: 'The unit''s Unicode CLDR identifier, which ICU formats a quantity in: Intl.NumberFormat''s unit style, where the platform supports the unit.' }
        name: { $ref: '#/components/schemas/LocalizedText' }
        to_base: { $ref: '#/components/schemas/UnitConversion' }
        counterpart: { type: [string, 'null'], description: 'The key of the unit of the other system a quantity in this unit is shown in when the household uses that system; null where it is shown as it is.' }

    UnitConversion:
      type: object
      description: |
        The exact conversion of a quantity to its dimension's base unit: base = (value + offset) ×
        numerator ÷ denominator. Each is a decimal as a string, to keep floats out of the
        arithmetic, and the two are a fraction where the factor has no finite decimal, 5/9 for °F.
      required: [offset, numerator, denominator]
      properties:
        offset: { type: string, examples: ['-32'] }
        numerator: { type: string, examples: ['0.3048'] }
        denominator: { type: string, examples: ['1'] }

    UnitList:
      type: object
      required: [version, dimensions, units]
      properties:
        version: { type: integer, format: int64, description: 'The dataset''s version: incremented whenever a dimension or a unit changes, 0 before any is loaded.' }
        dimensions: { type: array, items: { $ref: '#/components/schemas/UnitDimension' } }
        units: { type: array, items: { $ref: '#/components/schemas/Unit' } }

    ActorRef:
      type: object
      description: A denormalised label so a record still renders after the member has left the household.
      properties:
        user_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        label: { type: string }
        is_former_member: { type: boolean }

    RegisterRequest:
      type: object
      required: [email, password, display_name]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 12, description: 'Length plus a breached-password screen against a local dataset. No composition rules — forced symbol classes produce worse passwords and more resets.' }
        display_name: { type: string, minLength: 1, maxLength: 80, description: 'Leading and trailing white space is dropped, and a name of nothing else is refused.' }
        locale: { type: string, examples: ['cs-CZ'], description: 'A BCP 47 language tag. Left out, the first language of `Accept-Language` that Household ships, else English.' }

    LoginRequest:
      type: object
      required: [email, password, client_type]
      properties:
        email: { type: string, format: email }
        password: { type: string }
        client_type: { $ref: '#/components/schemas/ClientType' }
        device: { $ref: '#/components/schemas/DeviceSignIn' }
        trust_token: { type: string, maxLength: 128, description: 'For `client_type=mobile`: the token a second step answered with `remember_device` gave this device, which signs it in without the second step until it expires. A browser holds the same in the `__Host-hh_trust` cookie.' }

    DeviceSignIn:
      type: object
      description: 'The device a mobile sign-in is for, required with `client_type=mobile` and refused `422` without it. `id` is the installation''s own, which the client keeps; a device signs in once at a time, so signing in again on it ends the sign-in it held.'
      required: [id]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        label: { type: string, maxLength: 80 }
        platform: { type: string, enum: [ios, android] }
        app_version: { type: string, maxLength: 64, description: 'Recorded as the device''s; the version in `Household-Client`, when the request carries one, is recorded instead.' }

    ChildLoginRequest:
      type: object
      required: [household_code, profile_id, pin, device]
      properties:
        household_code: { type: string, maxLength: 32, description: 'The household''s code (`Household.join_code`); case, spaces and dashes do not matter.' }
        profile_id: { $ref: '#/components/schemas/Uuid', description: 'The profile''s `id` in `postAuthChildProfiles`.' }
        pin: { type: string, pattern: '^[0-9]{4,6}$' }
        device: { $ref: '#/components/schemas/DeviceSignIn' }

    ChildProfileList:
      type: object
      description: The household a code opens, and its child profiles to pick one from (A-15).
      required: [household_name, items]
      properties:
        household_name: { type: string }
        items:
          type: array
          description: The household's child profiles, in the order they were made. No adult is listed.
          items:
            type: object
            required: [id, display_name]
            properties:
              id: { $ref: '#/components/schemas/Uuid', description: 'The profile, which the sign-in names as its `profile_id`.' }
              display_name: { type: string }
              avatar_url: { type: [string, 'null'], description: 'A link to the profile''s picture, pre-signed for minutes (D-9); null for none.' }

    LoginResult:
      type: object
      properties:
        user: { $ref: '#/components/schemas/Me' }
        tokens: { oneOf: [{ $ref: '#/components/schemas/TokenPair' }, { type: 'null' }] }
        trust_token: { type: [string, 'null'], description: 'Set only by a mobile sign-in''s second step answered with `remember_device`: send it back as the sign-in''s `trust_token` to skip the second step on this device for 30 days.' }

    TokenPair:
      type: object
      required: [access_token, expires_in, refresh_token]
      properties:
        access_token: { type: string }
        expires_in: { type: integer, description: Seconds. 900. }
        refresh_token: { type: string, description: 'Single-use and rotating, with no expiry of its own: the device''s sign-in lasts until it is revoked. Presenting a used token invalidates the whole family and notifies the user, unless it is presented again within a minute of its use while the token it was exchanged for is still unused, which is a retry whose answer was lost.' }
        token_type: { const: Bearer }

    MfaChallenge:
      type: object
      required: [error, challenge_token, methods]
      properties:
        error: { const: mfa_required }
        challenge_token: { type: string, description: 'Answered at `/auth/mfa/verify` within ten minutes.' }
        methods: { type: array, items: { type: string, enum: [totp, recovery_code] }, description: 'The ways the second step may be answered now: `totp` is left out while the factor is locked.' }
        recovery_codes_left: { type: integer, minimum: 0, description: 'How many unused recovery codes the account holds, shown before one is spent.' }

    MfaEnrolment:
      type: object
      required: [secret, otpauth_uri]
      properties:
        secret: { type: string, description: 'The authenticator''s key in base32, to type in when the QR code cannot be scanned.' }
        otpauth_uri: { type: string, description: 'The otpauth:// URI a QR code carries.' }

    MfaRecoveryCodes:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes: { type: array, minItems: 10, maxItems: 10, items: { type: string, pattern: '^[2-9A-HJ-NP-Z]{4}-[2-9A-HJ-NP-Z]{4}$' }, description: 'Ten codes, each spent once in place of a code from the authenticator. Case, spaces and the dash do not matter when one is typed.' }

    OauthCallbackRequest:
      type: object
      required: [code, state, code_verifier]
      properties:
        code: { type: string, maxLength: 2048 }
        state: { type: string, maxLength: 128 }
        code_verifier: { type: string, pattern: '^[A-Za-z0-9._~-]{43,128}$', description: 'The verifier whose S256 challenge the start named (RFC 7636).' }
        client_type: { description: 'Not read: the sign-in is for the client type its start named.', allOf: [{ $ref: '#/components/schemas/ClientType' }] }
        device: { $ref: '#/components/schemas/DeviceSignIn' }
        trust_token: { type: string, maxLength: 128, description: 'As `LoginRequest.trust_token`.' }
        display_name: { type: string, maxLength: 80, description: 'A new account''s name, when the provider gives none: Apple gives the client the person''s name once, at their first sign-in.' }
        locale: { type: string, description: 'A new account''s BCP 47 language tag, as at registering.' }

    Me:
      type: object
      required: [id, display_name, email_verified]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        email: { oneOf: [{ type: string, format: email }, { type: 'null' }], description: 'Null for a managed child profile — no email is required and none is collected.' }
        email_verified: { type: boolean }
        display_name: { type: string }
        avatar_url: { type: [string, 'null'], description: 'A link to the user''s picture, pre-signed for minutes (D-9); null for none. Uploaded with `putMeAvatar`.' }
        locale: { type: string, description: 'A BCP 47 language tag: the language the member reads, and the formatting of dates, numbers and money.' }
        timezone: { type: [string, 'null'], description: 'The member''s own IANA timezone, overriding each household''s; null follows the household''s (PRD 03 §9).' }
        first_day_of_week: { type: [integer, 'null'], minimum: 0, maximum: 6, description: 'The member''s own first day of the week, 0 for Sunday to 6 for Saturday; null follows their locale.' }
        is_child: { type: boolean }
        mfa_enabled: { type: boolean }
        mfa_recovery_codes_left: { type: [integer, 'null'], minimum: 0, description: 'How many unused recovery codes the account holds; null while the second step is off.' }
        credentials: { type: array, items: { type: string, enum: [password, google, apple, child_pin] } }
        deletion_scheduled_at: { type: [string, 'null'], format: date-time }

    MeUpdate:
      type: object
      description: 'A JSON merge: a member left out is unchanged, and null clears one that may be null.'
      properties:
        display_name: { type: string, minLength: 1, maxLength: 80, description: 'Leading and trailing white space is dropped, and a name of nothing else is refused.' }
        locale: { type: string, description: 'A BCP 47 language tag.' }
        timezone: { type: [string, 'null'], description: 'An IANA timezone name, or null to follow each household''s.' }
        first_day_of_week: { type: [integer, 'null'], minimum: 0, maximum: 6, description: '0 for Sunday to 6 for Saturday, or null to follow the locale.' }
        avatar_url: { type: [string, 'null'], description: 'Only null, which removes the picture: one is uploaded with `putMeAvatar`. Any other value is refused `422`.' }

    Session:
      type: object
      required: [id]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        approximate_location: { type: [string, 'null'], description: Derived from IP at coarse granularity. Never a device location. }
        user_agent: { type: string }
        is_current: { type: boolean }

    Device:
      type: object
      required: [id]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        label: { type: string, description: 'As the device named itself, or as it was renamed; empty when it named nothing.' }
        platform: { type: string, enum: [ios, android] }
        app_version: { type: string }
        last_seen_at: { type: string, format: date-time, description: 'When it last signed in or refreshed its tokens.' }
        push_enabled: { type: boolean, description: 'Whether it has registered an Expo push token that has not been marked stale by five failures in a row (FR-NT6).' }
        is_current: { type: boolean, description: 'Whether the request came from this device.' }

    NotificationCategory:
      type: string
      enum: [direct, household, reminders, digest]
      description: Independently mutable per member per household, under a master switch and quiet hours in the member's own timezone.

    NotificationPreferences:
      type: object
      required: [household_id, enabled, categories, quiet_hours]
      properties:
        household_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'The household they are for, null for the account-wide defaults.' }
        enabled: { type: boolean, description: 'The master switch: off, no push reaches the member. The email of the fixed set (security, billing, invitations and a removal) arrives whatever it says (FR-NT1).' }
        categories:
          type: object
          required: [direct, household, reminders, digest]
          properties:
            direct: { type: boolean }
            household: { type: boolean }
            reminders: { type: boolean }
            digest: { type: boolean }
        quiet_hours:
          description: 'Read on the member''s own clock: their timezone, or the household''s. A window whose `to` is earlier than its `from` runs past midnight. A push due in it waits until it ends, and is never dropped for it.'
          oneOf:
            - { type: 'null' }
            - type: object
              required: [from, to]
              properties:
                from: { type: string, pattern: '^\d{2}:\d{2}$' }
                to: { type: string, pattern: '^\d{2}:\d{2}$' }

    NotificationPreferencesUpdate:
      type: object
      properties:
        enabled: { type: boolean }
        categories: { type: object, additionalProperties: { type: boolean }, description: 'Any of the four categories, each on or off.' }
        quiet_hours: { oneOf: [{ type: 'null' }, { type: object, required: [from, to], properties: { from: { type: string }, to: { type: string } } }], description: 'Two different times of day as HH:MM, 00:00 to 23:59, or null for none.' }

    PushSubscriptionCreate:
      type: object
      required: [transport, endpoint]
      properties:
        transport: { type: string, enum: [web_push, expo] }
        endpoint: { type: string, maxLength: 2048, description: 'The Web Push endpoint, an https URL at a push service, or the Expo push token.' }
        keys: { type: object, required: [p256dh, auth], properties: { p256dh: { type: string }, auth: { type: string } }, description: 'A Web Push subscription''s keys, base64url, as the browser gives them; required for `web_push`.' }
        device_id: { $ref: '#/components/schemas/Uuid', description: 'For `expo`: the device the request is signed in on, which is the one registered whether or not it is named.' }

    PushSubscription:
      type: object
      required: [id, transport, created_at, last_seen_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid', description: 'The subscription''s, or for `expo` the device''s.' }
        transport: { type: string, enum: [web_push, expo] }
        created_at: { type: string, format: date-time, description: 'When the subscription, or the token, was first registered.' }
        last_seen_at: { type: string, format: date-time, description: 'When the subscription was last registered, or the device last signed in or refreshed its tokens.' }

    Consents:
      type: object
      description: The product works identically either way — no feature is degraded for declining, which is what makes consent freely given and therefore valid.
      properties:
        analytics: { type: boolean, default: false }
        marketing_email: { type: boolean, default: false }
        updated_at: { type: string, format: date-time, readOnly: true }

    ExportJob:
      type: object
      required: [id]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        scope: { type: string, enum: [user, household] }
        household_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        status: { type: string, enum: [queued, running, ready, failed, expired] }
        requested_at: { type: string, format: date-time }
        ready_at: { type: [string, 'null'], format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }
        download_url: { type: [string, 'null'], format: uri }
        size_bytes: { type: [integer, 'null'], format: int64 }
        contents:
          type: array
          description: 'Structured JSON per module, the original files, and human-readable derivatives — `.ics`, `.csv`, `.md`, `chat.html`.'
          items: { type: string }

    DeletionRequest:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        scope: { type: string, enum: [user, household] }
        requested_at: { type: string, format: date-time }
        executes_at: { type: string, format: date-time, description: 30 days out. Reversible until then. }
        cancel_token: { type: [string, 'null'] }

    DiagnosticBundle:
      type: object
      description: |
        Assembled by the member, shown to them **in full before sending**, redactable, and expiring
        after 30 days. The only route by which household data reaches platform staff.
      required: [screen, payload]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        screen: { type: string }
        household_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        ticket_reference: { type: [string, 'null'] }
        payload: { type: object, additionalProperties: true, description: Exactly what the member saw and approved. }
        redacted_fields: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time, readOnly: true }
        expires_at: { type: string, format: date-time, readOnly: true }

    HouseholdCreate:
      type: object
      required: [id, name, country, timezone, base_currency, locale]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string, maxLength: 80 }
        country: { $ref: '#/components/schemas/CountryCode', description: 'A country Household has a profile of (`getReferenceCountries`). Drives tariff presets, document types, statutory vehicle schedules, holidays and default VAT.' }
        timezone: { type: string }
        base_currency: { type: string, pattern: '^[A-Z]{3}$' }
        locale: { type: string }
        units: { $ref: '#/components/schemas/UnitSystem', description: 'When omitted, the `default_units` of the country''s profile.' }
        first_day_of_week: { type: integer, minimum: 0, maximum: 6, description: '0 for Sunday to 6 for Saturday, as JavaScript''s Date#getDay and Go''s time.Weekday count. When omitted, the `first_day_of_week` of the country''s profile.' }

    Household:
      allOf:
        - { $ref: '#/components/schemas/HouseholdCreate' }
        - type: object
          properties:
            version: { type: integer, format: int64 }
            join_code: { type: string, pattern: '^[A-HJ-NP-Z2-9]{8}$', description: 'The household code, used with a profile and a PIN for child sign-in (FR-CH1). Eight characters without 0, O, 1 and I; clients may show it as two groups of four. Shown to owners only.' }
            created_at: { type: string, format: date-time }
            entitlement: { $ref: '#/components/schemas/EntitlementSummary' }
            my_role: { $ref: '#/components/schemas/HouseholdRole' }
            my_grants: { type: object, additionalProperties: { $ref: '#/components/schemas/AccessLevel' } }

    HouseholdUpdate:
      type: object
      properties:
        name: { type: string, maxLength: 80 }
        country: { $ref: '#/components/schemas/CountryCode' }
        timezone: { type: string }
        base_currency: { type: string, pattern: '^[A-Z]{3}$', description: 'Recomputes totals from each row''s stored rate. Warned in the client and audited — silently redenominating a household''s history would be the worst bug the product could ship.' }
        locale: { type: string }
        units: { $ref: '#/components/schemas/UnitSystem' }
        first_day_of_week: { type: integer, minimum: 0, maximum: 6, description: '0 for Sunday to 6 for Saturday, as JavaScript''s Date#getDay and Go''s time.Weekday count.' }

    HouseholdSummary:
      type: object
      required: [id]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        avatar_url: { type: [string, 'null'] }
        my_role: { $ref: '#/components/schemas/HouseholdRole' }
        member_count: { type: integer }
        entitlement: { $ref: '#/components/schemas/EntitlementSummary' }

    Membership:
      type: object
      properties:
        user_id: { $ref: '#/components/schemas/Uuid' }
        household_id: { $ref: '#/components/schemas/Uuid' }
        display_name: { type: string }
        email: { type: [string, 'null'] }
        avatar_url: { type: [string, 'null'], description: 'A link to the member''s picture, pre-signed for minutes (D-9); null for none.' }
        role: { $ref: '#/components/schemas/HouseholdRole' }
        grants: { type: object, additionalProperties: { $ref: '#/components/schemas/AccessLevel' } }
        is_billing_payer: { type: boolean }
        joined_at: { type: string, format: date-time }
        last_active_at: { type: [string, 'null'], format: date-time, description: 'When the member last changed anything in the household, from its activity log.' }
        version: { type: integer, format: int64, description: 'The membership''s version, its `ETag`, which moves with its role and its grants, and with a child profile''s PIN, its lock, its picture as an owner sets it (`putChildrenByUserIdAvatar`, `deleteChildrenByUserIdAvatar`) and its graduation. A picture a member sets for themselves (`putMeAvatar`, `patchMe`), a child profile included, is their account''s, and moves no membership''s version.' }
        child:
          description: What the membership says of a child profile; null for any other member.
          oneOf:
            - { type: 'null' }
            - type: object
              properties:
                year_of_birth: { type: [integer, 'null'], description: 'Shown to the household''s owners and to the child themself, as `email` is; null to anyone else.' }
                pin_locked: { type: boolean, description: 'Ten wrong PINs since the last right one have locked the profile until an owner unlocks it or sets a new PIN.' }
                dashboard_locked: { type: boolean }

    MembershipUpdate:
      type: object
      properties:
        role: { $ref: '#/components/schemas/HouseholdRole' }
        grants:
          type: object
          description: Partial — only the modules named are changed. Lowering a grant emits sync retractions immediately and notifies the member.
          additionalProperties: { $ref: '#/components/schemas/AccessLevel' }

    InvitationCreate:
      type: object
      required: [id, kind, role]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string, enum: [email, link] }
        email: { type: string, format: email, description: Required for `kind=email`. }
        role: { $ref: '#/components/schemas/HouseholdRole' }
        grants: { type: object, additionalProperties: { $ref: '#/components/schemas/AccessLevel' } }
        dashboard_layout: { oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/DashboardLayoutUpdate' }] }
        message: { type: string, maxLength: 500 }
        max_uses: { type: integer, minimum: 1, maximum: 12, description: 'For `kind=link`: how many accounts may accept it, 1 when omitted, and at most the members'' fair-use ceiling. An `email` invitation is accepted once.' }

    Invitation:
      type: object
      required: [id]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string, enum: [email, link] }
        email: { type: [string, 'null'] }
        role: { $ref: '#/components/schemas/HouseholdRole' }
        grants: { type: object, additionalProperties: { $ref: '#/components/schemas/AccessLevel' } }
        url: { type: [string, 'null'], description: 'Present for `kind=link`, returned once.' }
        invited_by: { $ref: '#/components/schemas/ActorRef' }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        status: { type: string, enum: [pending, accepted, declined, revoked, expired] }
        max_uses: { type: integer, description: How many accounts may accept it. }
        uses: { type: integer, description: 'How many have; it is `accepted` once they are `max_uses`.' }

    InvitationForInvitee:
      type: object
      description: What the invitee sees before accepting — exactly what they are being given.
      properties:
        token: { type: string, description: 'How the request named it: the token its email or link carries, or its id in `getMeInvitations`.' }
        household_name: { type: string }
        household_avatar_url: { type: [string, 'null'] }
        invited_by: { type: string }
        role: { $ref: '#/components/schemas/HouseholdRole' }
        modules:
          type: array
          items:
            type: object
            properties:
              module: { $ref: '#/components/schemas/ModuleKeyValue' }
              level: { $ref: '#/components/schemas/AccessLevel' }
        message: { type: [string, 'null'] }
        expires_at: { type: string, format: date-time }

    ChildProfileCreate:
      type: object
      required: [id, display_name, pin]
      description: No email is required and none is collected. Child profiles are excluded from analytics entirely.
      properties:
        id: { $ref: '#/components/schemas/Uuid', description: 'The profile''s: its account''s and its membership''s alike.' }
        display_name: { type: string, maxLength: 80 }
        year_of_birth: { type: [integer, 'null'], minimum: 1900, description: 'Optional, and a year rather than a full date — used only for age-appropriate defaults. A year after this one in the household''s timezone is refused.' }
        avatar_url: { type: [string, 'null'], description: 'Refused unless null: a picture is uploaded with `putChildrenByUserIdAvatar` once the profile exists.' }
        pin: { type: string, pattern: '^[0-9]{4,6}$' }
        grants: { type: object, additionalProperties: { $ref: '#/components/schemas/AccessLevel' } }
        lock_dashboard: { type: boolean, default: true }

    ModuleState:
      type: object
      properties:
        module: { $ref: '#/components/schemas/ModuleKeyValue' }
        enabled: { type: boolean }
        my_level: { $ref: '#/components/schemas/AccessLevel' }
        needs_setup: { type: boolean }
        entity_count: { type: [integer, 'null'] }

    EntitlementState:
      type: string
      enum: [trialing, active, past_due, grace, read_only, restricted, canceled, suspended]

    EntitlementSummary:
      type: object
      description: The household's state, what it permits, and what its banner says, which every member reads (DD-9, FR-BI7, D-32).
      properties:
        state: { $ref: '#/components/schemas/EntitlementState' }
        trial_ends_at: { type: [string, 'null'], format: date-time, description: Set while the subscription is trialing. }
        trial_notice: { type: string, enum: [none, notice, banner], description: 'DD-9''s stage of the trial: none for twenty days, a dismissible `notice` on days 21 to 25, then a persistent `banner` for the last five. `none` outside the trial.' }
        can_write: { type: boolean }
        can_upload: { type: boolean }
        grace_ends_at: { type: [string, 'null'], format: date-time, description: Set while the subscription is in grace. }
        data_retained_until: { type: [string, 'null'], format: date-time, description: 'Set while it is `read_only` or `canceled`: the day the household''s data is deleted, 12 months after it lapsed and 30 days of warnings more (D-32, D-119). Shown from the day it lapses.' }
        restriction:
          description: 'An owner''s restriction of processing, null for none: who restricted the household, when and why (FR-BI7). Set whatever the state, so that a household whose lapse outranks it is still told of it (D-114).'
          oneOf:
            - { type: 'null' }
            - type: object
              required: [restricted_by, restricted_at]
              properties:
                restricted_by: { $ref: '#/components/schemas/ActorRef' }
                restricted_at: { type: string, format: date-time }
                reason: { type: [string, 'null'] }
        suspended_at: { type: [string, 'null'], format: date-time, description: 'When the platform suspended the household, for the lockout.' }
        storage_used_bytes: { type: integer, format: int64 }
        storage_included_bytes: { type: integer, format: int64, description: 'The base allowance plus any blocks currently in effect.' }
        storage_blocks: { type: integer, description: '10 GB blocks currently in effect, above the base allowance.' }

    Subscription:
      type: object
      properties:
        household_id: { $ref: '#/components/schemas/Uuid' }
        state: { $ref: '#/components/schemas/EntitlementState' }
        interval: { type: [string, 'null'], enum: [month, year, null] }
        current_period_end: { type: [string, 'null'], format: date-time }
        cancel_at_period_end: { type: boolean }
        trial_ends_at: { type: [string, 'null'], format: date-time }
        grace_ends_at: { type: [string, 'null'], format: date-time }
        data_retained_until: { type: [string, 'null'], format: date-time, description: 'When a lapsed household''s data is deleted: it is retained 12 months, then its owners are warned three times over 30 days, a month, a week and a day before (D-119). Export works in every state.' }
        payer: { $ref: '#/components/schemas/ActorRef' }
        payment_method:
          oneOf:
            - { type: 'null' }
            - type: object
              description: A summary only. Card data never touches Household's servers.
              properties:
                brand: { type: string }
                last4: { type: string }
                exp_month: { type: integer }
                exp_year: { type: integer }
        base_price: { $ref: '#/components/schemas/Money' }
        included_storage_bytes: { type: integer, format: int64, description: 'The base allowance. 5 GB at launch.' }
        storage_block_bytes: { type: integer, format: int64, description: 'The size of one purchasable block. 10 GB at launch.' }
        price_per_storage_block: { $ref: '#/components/schemas/Money' }
        max_storage_blocks: { type: integer, description: 'The hard ceiling. Set so the storage line cannot exceed roughly four times the base fee; 20 at launch.' }

    Invoice:
      type: object
      required: [id]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        number: { type: string }
        issued_on: { type: string, format: date }
        period_from: { type: string, format: date }
        period_to: { type: string, format: date }
        status: { type: string, enum: [draft, open, paid, uncollectible, void] }
        total: { $ref: '#/components/schemas/Money' }
        tax: { $ref: '#/components/schemas/Money' }
        lines:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, enum: [base, storage_blocks, credit, adjustment] }
              description: { type: string }
              quantity: { type: [string, 'null'], description: 'For `storage_blocks`, the whole number of 10 GB blocks billed for the period.' }
              amount: { $ref: '#/components/schemas/Money' }
        pdf_url: { type: [string, 'null'], format: uri }

    InvoicePage:
      type: object
      required: [items, meta]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Invoice' } }
        meta: { $ref: '#/components/schemas/PageMeta' }

    UsageSummary:
      type: object
      description: |
        Extra storage is sold in whole **10 GB blocks**, computed once per period from the daily
        samples:

        ```
        blocks = ceil( max(0, mean(daily stored_bytes) - included_bytes_base) / block_bytes )
        ```

        The **daily average**, not the peak — 40 GB uploaded and deleted the same day moves a
        monthly average by about 1.3 GB and therefore costs nothing. An invoice is never the first
        time a customer learns the number.
      properties:
        period_from: { type: string, format: date }
        period_to: { type: string, format: date }
        current_bytes: { type: integer, format: int64 }
        mtd_average_bytes: { type: integer, format: int64 }
        projected_average_bytes: { type: integer, format: int64 }
        included_bytes: { type: integer, format: int64 }
        included_bytes_base: { type: integer, format: int64, description: 'The base allowance, before blocks.' }
        blocks_now: { type: integer, description: 'Blocks the current daily-average would require.' }
        blocks_projected: { type: integer, description: 'Blocks the projected month-end average would require. This is the number that will be billed.' }
        projected_charge: { $ref: '#/components/schemas/Money', description: '`blocks_projected` x the block price. Shown daily, so an invoice is never the first time a customer learns the number.' }
        bytes_to_next_block: { type: integer, format: int64, description: 'How much more the household can store before another block is added.' }
        bytes_to_drop_a_block: { type: [integer, 'null'], format: int64, description: 'How much would have to be freed to fall back one block. Null at zero blocks.' }
        upload_blocked: { type: boolean }
        hard_ceiling_bytes: { type: integer, format: int64, description: 'Unbounded consumer metering ends in a chargeback, so uploads stop here. Reads, downloads and exports never do.' }

    StorageReport:
      type: object
      required: [total_bytes, included_bytes, object_count, by_module, by_member, largest, trend]
      description: |
        What the household keeps now, as its files record it, beside the trend of its daily samples.
        Every member's bytes count in the totals and in the split by member, which say how much and
        whose, never what. `by_module` leaves out every module the reader cannot see, which is absent
        for them (FR-AC2, D-16), and `largest` what the reader could not open: another member's
        private item, but for an owner a child profile's, which they may read (D-19), and anything in
        a module they cannot see (D-108).
      properties:
        total_bytes: { type: integer, format: int64, description: 'Every byte stored, derived variants included (FR-ST3).' }
        included_bytes: { type: integer, format: int64, description: 'The base allowance. Billing adds the blocks in effect (plan item 19).' }
        object_count: { type: integer, format: int64 }
        by_module:
          type: array
          description: 'The modules that keep files and the reader can see, the largest first. A module they hold `none` on, or the household disables, has no line, though its bytes count in the totals.'
          items:
            type: object
            required: [module, bytes, derived_bytes, object_count]
            properties:
              module: { $ref: '#/components/schemas/ModuleKeyValue' }
              bytes: { type: integer, format: int64, description: 'The originals, as uploaded.' }
              derived_bytes: { type: integer, format: int64, description: 'Thumbnails and preview PDFs, shown separately because "why is my 2 MB file using 3 MB" is otherwise a support ticket.' }
              object_count: { type: integer, format: int64 }
        by_member:
          type: array
          description: 'The members the files count against, as their modules attribute them (FR-ST1), the largest first; a former member''s stay until the files go.'
          items:
            type: object
            required: [user, bytes]
            properties:
              user: { $ref: '#/components/schemas/ActorRef' }
              bytes: { type: integer, format: int64 }
        largest:
          type: array
          description: 'The ten largest items the reader may open, by what deleting each would recover.'
          items:
            type: object
            required: [module, entity_id, label, bytes, recoverable_bytes]
            properties:
              module: { $ref: '#/components/schemas/ModuleKeyValue' }
              entity_id: { $ref: '#/components/schemas/Uuid' }
              label: { type: string, description: 'As the module names the item, or its file''s name; empty for neither.' }
              bytes: { type: integer, format: int64, description: 'The original, as uploaded.' }
              recoverable_bytes: { type: integer, format: int64, description: 'The original and every variant derived from it: what deleting the item frees.' }
        trend:
          type: array
          description: 'The daily samples of the last 90 days, oldest first, each dated by the UTC day it was taken on, never a day in the household''s timezone (D-109). A day with no sample is absent.'
          items:
            type: object
            required: [date, bytes]
            properties:
              date: { type: string, format: date }
              bytes: { type: integer, format: int64, description: 'Every byte stored when the day was sampled.' }

    PlatformHousehold:
      type: object
      required: [id]
      description: Metadata only. No field of this schema carries household content.
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        country: { type: string }
        created_at: { type: string, format: date-time }
        state: { $ref: '#/components/schemas/EntitlementState' }
        member_count: { type: integer }
        members:
          type: array
          items:
            type: object
            properties:
              user_id: { $ref: '#/components/schemas/Uuid' }
              email: { type: [string, 'null'] }
              role: { $ref: '#/components/schemas/HouseholdRole' }
              is_child: { type: boolean }
        modules_enabled: { type: array, items: { $ref: '#/components/schemas/ModuleKeyValue' } }
        storage_bytes: { type: integer, format: int64 }
        storage_by_module: { type: object, additionalProperties: { type: integer, format: int64 } }
        recent_action_keys:
          type: array
          description: Audit **action keys** only — no summaries, no diffs, no entity ids.
          items: { type: object, properties: { action: { type: string }, count: { type: integer } } }
        limit_overrides: { type: array, items: { $ref: '#/components/schemas/PlatformLimitOverride' } }

    PlatformHouseholdPage:
      type: object
      required: [items, meta]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PlatformHousehold' } }
        meta: { $ref: '#/components/schemas/PageMeta' }

    PlatformUserPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              email: { type: [string, 'null'] }
              email_verified: { type: boolean }
              locale: { type: string }
              created_at: { type: string, format: date-time }
              last_sign_in_at: { type: [string, 'null'], format: date-time }
              household_count: { type: integer }
              is_child: { type: boolean }
              deletion_scheduled_at: { type: [string, 'null'], format: date-time }
        meta: { $ref: '#/components/schemas/PageMeta' }

    PlatformLimitOverride:
      type: object
      properties:
        key: { type: string, enum: [members, rows_per_module, chat_messages, sync_mutations_per_day, api_rate, object_count, file_size_bytes] }
        value: { type: integer, format: int64 }
        reason: { type: string }
        set_by: { $ref: '#/components/schemas/ActorRef' }
        set_at: { type: string, format: date-time }

    PlatformAuditPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              occurred_at: { type: string, format: date-time }
              actor: { $ref: '#/components/schemas/ActorRef' }
              action: { type: string }
              household_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
              target_user_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
              reason: { type: [string, 'null'] }
        meta: { $ref: '#/components/schemas/PageMeta' }
    SyncCredentials:
      type: object
      required: [endpoint, token, expires_at]
      properties:
        endpoint: { type: string, format: uri, description: Where the client reaches PowerSync. }
        token: { type: string, description: 'A JWT PowerSync verifies: EdDSA, carrying `sub`, `aud`, `iat` and `exp`.' }
        expires_at: { type: string, format: date-time, description: When the token expires; the client asks for another before then. }

    JsonWebKeySet:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            required: [kty, crv, x, kid, alg, use]
            properties:
              kty: { const: OKP }
              crv: { const: Ed25519 }
              x: { type: string, description: 'The public key, base64url.' }
              kid: { type: string, description: 'Its RFC 7638 thumbprint, which a token''s header names.' }
              alg: { const: EdDSA }
              use: { const: sig }

    SyncMutationOp:
      type: string
      enum: [create, update, delete, action]

    SyncMutation:
      type: object
      required: [mutation_id, entity_type, entity_id, op]
      properties:
        mutation_id: { $ref: '#/components/schemas/Uuid' }
        entity_type: { type: string }
        entity_id: { $ref: '#/components/schemas/Uuid' }
        op: { $ref: '#/components/schemas/SyncMutationOp' }
        base_version: { type: [integer, 'null'], format: int64, description: Null on create. }
        action: { type: [string, 'null'], description: 'Present when `op = action` — `complete`, `move`, `check`, and so on.' }
        fields: { type: object, additionalProperties: true, description: Only the fields the client actually changed. Field-level merge depends on this. }
        client_time: { type: string, format: date-time, description: 'Advisory data, never authority. Ordering is by server receipt; anything more than 24 hours out is clamped and flagged.' }

    SyncMutationBatch:
      type: object
      required: [mutations]
      properties:
        device_id: { $ref: '#/components/schemas/Uuid' }
        mutations:
          type: array
          minItems: 1
          description: At most 500; a larger batch is refused whole, `413` (`batch_too_large`).
          items: { $ref: '#/components/schemas/SyncMutation' }

    SyncMutationResult:
      type: object
      required: [mutation_id, outcome]
      properties:
        mutation_id: { $ref: '#/components/schemas/Uuid' }
        outcome:
          type: string
          enum: [applied, merged, conflict, rejected, deferred]
          description: |
            `applied` — committed. `merged` — committed, but over a change the client had not seen:
            an `lww_field` or `lww_row` write made against an older version than the row's
            (`concurrent_change`), its row attached, so that a field the member set and another's
            write overrode can be surfaced. `conflict` — refused on `base_version`; the server's row
            is attached so the member's change can be re-presented. `rejected` — invalid,
            unauthorised, or a dangling reference. `deferred` — a dependency earlier in this batch
            failed.
        version: { type: [integer, 'null'], format: int64 }
        row: { description: 'The canonical representation after the mutation, or the server''s current one on conflict.' }
        code: { type: [string, 'null'] }
        message: { type: [string, 'null'] }

    SyncMutationBatchResult:
      type: object
      required: [results]
      description: The answer to each mutation, in the order the batch carried them. Under D-93 no client pulls a feed, so no feed sequence comes with it (D-121).
      properties:
        results: { type: array, items: { $ref: '#/components/schemas/SyncMutationResult' } }

    ReplicaDigest:
      type: object
      required: [replica_id, checkpoint, entries, health]
      description: What one replica believes it holds, as hashes only, and its health. No row data is sent.
      properties:
        replica_id: { $ref: '#/components/schemas/Uuid' }
        checkpoint:
          type: string
          description: The checkpoint the replica last applied, as PowerSync names it, which the sync-health screen shows (FR-HA19). The server compares against what the caller may see as the report arrives (D-125).
        algorithm:
          type: string
          enum: [xxh3-64]
          default: xxh3-64
          description: 'Named so it can be changed without guessing what an old client sent: each pair''s hash is the xxh3-64 of `<entity_id>:<version>`, and an entry''s is their sum modulo 2^64.'
        health:
          type: object
          required: [pending_mutations, unresolved, checksum_failures]
          properties:
            pending_mutations: { type: integer, minimum: 0, description: The mutations the replica holds queued or held to replay. }
            unresolved: { type: integer, minimum: 0, description: The conflicts and rejections the member has not resolved. }
            checksum_failures: { type: integer, minimum: 0, description: The bucket checksums PowerSync found failing since the replica last reported. }
        entries:
          type: array
          maxItems: 200
          items:
            type: object
            required: [entity_type, hash, count]
            properties:
              entity_type: { type: string, description: 'Module-qualified, e.g. `garden.planting`.' }
              hash: { type: string, pattern: '^[0-9a-f]{16}$', description: 'Order-independent rolling hash over the `(entity_id, version)` pairs held for this entity type.' }
              count: { type: integer, description: How many rows that hash covers. Carried because a count mismatch localises the fault faster than a hash mismatch alone. }

    ReplicaDigestVerdict:
      type: object
      required: [matched, resnapshot_required, entries]
      properties:
        matched: { type: boolean, description: True when every entity type agreed. }
        resnapshot_required:
          type: boolean
          description: |
            When true the replica downloads itself again: once its queue has drained it clears its
            replica and connects afresh, PowerSync sending every bucket whole. The server has marked
            it, divergent or asked for (`POST …/sync/reset`), so `GET …/sync/state` reports
            `needs_resnapshot` for it until it reports again.
        entries:
          type: array
          items:
            type: object
            required: [entity_type, matched]
            properties:
              entity_type: { type: string }
              matched: { type: boolean }
              server_count: { type: integer, description: How many rows the server believes the caller should hold. The client count is echoed back by the caller's own request. }

    SyncState:
      type: object
      description: When offline-first goes wrong, this is the screen that tells a member why — and its absence is why sync bugs become support tickets. Each of the caller's replicas as it last reported itself (D-125).
      properties:
        replicas:
          type: array
          items:
            type: object
            properties:
              replica_id: { $ref: '#/components/schemas/Uuid' }
              device_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: The device the replica reported from; null for a web session's. }
              label: { type: string, description: 'The device''s label, or the browser''s.' }
              checkpoint: { type: [string, 'null'], description: The checkpoint it had applied when it last reported. }
              last_report_at: { type: [string, 'null'], format: date-time, description: When it last reported through `POST …/sync/digest`. }
              pending_mutations: { type: integer }
              unresolved_conflicts: { type: integer }
              checksum_failures: { type: integer, description: 'The bucket checksums PowerSync found failing, as its last report said.' }
              needs_resnapshot: { type: boolean }
              digest_mismatch_entity_types:
                type: array
                items: { type: string }
                description: |
                  Entity types whose replica hash disagreed at the last check (D-85). Empty is the
                  healthy state. It is metadata — no row values — which is why the diagnostic
                  bundle can carry it.

    SearchHit:
      type: object
      properties:
        module: { $ref: '#/components/schemas/ModuleKeyValue' }
        entity_type: { type: string }
        entity_id: { $ref: '#/components/schemas/Uuid' }
        title: { type: string }
        snippet: { type: [string, 'null'] }
        path: { type: [string, 'null'] }
        updated_at: { type: string, format: date-time }
        score: { type: number }

    SearchResultPage:
      type: object
      required: [items, meta]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/SearchHit' } }
        meta: { $ref: '#/components/schemas/PageMeta' }
        searched_modules: { type: array, items: { $ref: '#/components/schemas/ModuleKeyValue' } }

    ActivityEvent:
      type: object
      required: [id]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        occurred_at: { type: string, format: date-time }
        actor: { $ref: '#/components/schemas/ActorRef' }
        actor_type: { type: string, enum: [user, system, service] }
        module: { $ref: '#/components/schemas/ModuleKeyValue' }
        action: { type: string }
        entity_type: { type: [string, 'null'] }
        entity_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: Dropped when the event is redacted for a non-owner. }
        level: { type: string, enum: [info, notice, warn] }
        summary: { type: string, description: 'Rendered in the **reader''s** language from a stored key and arguments, so two members of one household read the same event correctly in different languages.' }
        redacted: { type: boolean }
        via: { $ref: '#/components/schemas/Via' }
        changes:
          type: array
          description: Empty when redacted.
          items:
            type: object
            properties:
              field: { type: string }
              old: {}
              new: {}

    ActivityEventPage:
      type: object
      required: [items, meta]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ActivityEvent' } }
        meta: { $ref: '#/components/schemas/PageMeta' }

    ActivityStats:
      type: object
      properties:
        by_module: { type: array, items: { type: object, properties: { module: { $ref: '#/components/schemas/ModuleKeyValue' }, count: { type: integer } } } }
        by_action: { type: array, items: { type: object, properties: { action: { type: string }, count: { type: integer } } } }
        by_actor: { type: array, items: { type: object, properties: { actor: { $ref: '#/components/schemas/ActorRef' }, count: { type: integer } } } }

    ReminderLead:
      type: string
      enum: ['0d', '1d', '3d', '1w', '2w', '1m', '3m', '6m', custom]

    ReminderKind:
      type: object
      properties:
        key: { type: string, examples: ['vehicles.inspection_due'] }
        module: { $ref: '#/components/schemas/ModuleKeyValue' }
        label: { type: string }
        completion_scope:
          type: string
          enum: [household, personal]
          description: |
            Declared by the kind, **not chosen by the member** — it is a property of the obligation.
            The boiler service is done for everyone; renewing *your* passport is not.
        default_lead: { $ref: '#/components/schemas/ReminderLead' }
        default_lead_days: { type: [integer, 'null'] }
        subscription: { oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/ReminderSubscription' }] }

    ReminderSubscription:
      type: object
      properties:
        kind_key: { type: string }
        lead: { $ref: '#/components/schemas/ReminderLead' }
        lead_days: { type: [integer, 'null'] }
        channel: { type: string, enum: ['off', in_app, push, both] }

    ReminderSubscriptionUpdate:
      type: object
      properties:
        lead: { $ref: '#/components/schemas/ReminderLead' }
        lead_days: { type: [integer, 'null'] }
        channel: { type: string, enum: ['off', in_app, push, both] }

    ReminderOccurrenceRef:
      type: object
      required: [source, source_id, occurrence_on]
      properties:
        source: { type: string, description: 'The reminder kind key, or `reminders.reminder` for the module''s own.' }
        source_id: { $ref: '#/components/schemas/Uuid' }
        occurrence_on: { type: string, format: date }

    ReminderOccurrence:
      type: object
      properties:
        source: { type: string }
        source_id: { $ref: '#/components/schemas/Uuid' }
        occurrence_on: { type: string, format: date }
        module: { $ref: '#/components/schemas/ModuleKeyValue' }
        title: { type: string }
        detail: { type: [string, 'null'] }
        due_on: { type: string, format: date }
        lead_open_on: { type: string, format: date }
        is_overdue: { type: boolean }
        completed: { type: boolean }
        completed_by: { oneOf: [{ $ref: '#/components/schemas/ActorRef' }, { type: 'null' }] }
        completion_scope: { type: string, enum: [household, personal] }
        snoozed_until: { type: [string, 'null'], format: date, description: 'Snoozing is always **personal**, even when completion is shared — you can stop being told without marking it done for everybody.' }
        entity_ref: { type: object, properties: { entity_type: { type: string }, entity_id: { $ref: '#/components/schemas/Uuid' } } }

    ReminderOccurrencePage:
      type: object
      required: [items, meta]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ReminderOccurrence' } }
        meta: { $ref: '#/components/schemas/PageMeta' }

    Reminder:
      type: object
      required: [id, version]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, format: int64 }
        title: { type: string }
        note: { type: [string, 'null'] }
        due_on: { type: string, format: date, description: 'A reminder is a **day**. Anything needing a time is a Calendar event.' }
        rrule: { type: [string, 'null'] }
        rrule_until: { type: [string, 'null'], format: date }
        rrule_count: { type: [integer, 'null'] }
        completion_scope: { type: string, enum: [household, personal] }
        is_anniversary: { type: boolean }
        since_year: { type: [integer, 'null'] }
        archived: { type: boolean }
        created_by: { $ref: '#/components/schemas/ActorRef' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ReminderCreate:
      type: object
      required: [id, title, due_on]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        title: { type: string }
        note: { type: string }
        due_on: { type: string, format: date }
        rrule: { type: string, description: 'An RRULE subset — daily, weekly with weekdays, monthly by day-of-month or nth-weekday, yearly, each with an interval. Short months clamp: a monthly reminder on the 31st fires on the 28th, 29th or 30th.' }
        rrule_until: { type: string, format: date }
        rrule_count: { type: integer }
        completion_scope: { type: string, enum: [household, personal], default: household }
        is_anniversary: { type: boolean, default: false }
        since_year: { type: integer }

    ReminderUpdate:
      type: object
      description: Edits apply to the **series**; a one-off is a new reminder.
      properties:
        title: { type: string }
        note: { type: [string, 'null'] }
        due_on: { type: string, format: date }
        rrule: { type: [string, 'null'] }
        rrule_until: { type: [string, 'null'], format: date }
        rrule_count: { type: [integer, 'null'] }
        completion_scope: { type: string, enum: [household, personal] }
        archived: { type: boolean }

    ReminderPage:
      type: object
      required: [items, meta]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Reminder' } }
        meta: { $ref: '#/components/schemas/PageMeta' }

    NotificationCatalog:
      type: object
      description: From the live registry, so keys are picked rather than typed.
      properties:
        actions:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              module: { $ref: '#/components/schemas/ModuleKeyValue' }
              label: { type: string }
              sample_summary: { type: string }
        metrics:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              module: { $ref: '#/components/schemas/ModuleKeyValue' }
              label: { type: string }
              unit: { type: string }
              scope: { type: string, enum: [household, per_recipient] }
        tokens: { type: array, items: { type: object, properties: { token: { type: string }, context: { type: string }, description: { type: string } } } }
        members: { type: array, items: { $ref: '#/components/schemas/ActorRef' } }

    TemplateSet:
      type: object
      description: One template per supported language. A recipient receives their own; the household default fills the gaps.
      additionalProperties:
        type: object
        properties:
          title: { type: string }
          body: { type: string }

    NotificationRule:
      type: object
      required: [id, version]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, format: int64 }
        name: { type: string }
        enabled: { type: boolean }
        action_key: { type: [string, 'null'] }
        action_prefix: { type: [string, 'null'] }
        filter_module: { oneOf: [{ $ref: '#/components/schemas/ModuleKeyValue' }, { type: 'null' }] }
        filter_entity_type: { type: [string, 'null'] }
        filter_level: { type: [string, 'null'] }
        audience: { $ref: '#/components/schemas/Audience' }
        exclude_actor: { type: boolean }
        coalesce_window_seconds: { type: integer }
        category: { $ref: '#/components/schemas/NotificationCategory' }
        templates: { $ref: '#/components/schemas/TemplateSet' }

    NotificationRuleUpdate:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        enabled: { type: boolean, default: true }
        action_key: { type: string }
        action_prefix: { type: string }
        filter_module: { $ref: '#/components/schemas/ModuleKeyValue' }
        filter_entity_type: { type: string }
        filter_level: { type: string }
        audience: { $ref: '#/components/schemas/Audience' }
        exclude_actor: { type: boolean, default: false }
        coalesce_window_seconds: { type: integer, default: 60 }
        templates: { $ref: '#/components/schemas/TemplateSet' }

    NotificationRuleCreate:
      allOf: [{ $ref: '#/components/schemas/NotificationRuleUpdate' }, { required: [id, name, templates] }]

    Audience:
      type: object
      properties:
        kind: { type: string, enum: [all, members, role] }
        user_ids: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
        role: { $ref: '#/components/schemas/HouseholdRole' }

    NotificationSchedule:
      type: object
      required: [id, version]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, format: int64 }
        name: { type: string }
        enabled: { type: boolean }
        time_local: { type: string, pattern: '^\d{2}:\d{2}$', description: 'Resolved against the **household''s** timezone, DST included.' }
        days: { type: string, enum: [daily, weekdays, weekends, custom, day_of_month] }
        weekdays: { type: array, items: { type: integer, minimum: 0, maximum: 6 } }
        day_of_month: { type: [integer, 'null'], minimum: 1, maximum: 31, description: '29–31 clamps to the month''s last day, so "the 31st" fires on 28 or 29 February.' }
        audience: { $ref: '#/components/schemas/Audience' }
        templates: { $ref: '#/components/schemas/TemplateSet' }

    NotificationScheduleUpdate:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        enabled: { type: boolean, default: true }
        time_local: { type: string }
        days: { type: string, enum: [daily, weekdays, weekends, custom, day_of_month] }
        weekdays: { type: array, items: { type: integer } }
        day_of_month: { type: integer, minimum: 1, maximum: 31 }
        audience: { $ref: '#/components/schemas/Audience' }
        templates: { $ref: '#/components/schemas/TemplateSet' }

    NotificationScheduleCreate:
      allOf: [{ $ref: '#/components/schemas/NotificationScheduleUpdate' }, { required: [id, name, time_local, days, templates] }]

    NotificationDeliveryPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              sent_at: { type: string, format: date-time }
              category: { $ref: '#/components/schemas/NotificationCategory' }
              rule_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
              user: { $ref: '#/components/schemas/ActorRef' }
              transport: { type: string, enum: [web_push, expo, email] }
              status: { type: string, enum: [queued, sent, failed, dropped] }
              reason: { type: [string, 'null'] }
        meta: { $ref: '#/components/schemas/PageMeta' }

    BroadcastRequest:
      type: object
      required: [title, body]
      properties:
        title: { type: string }
        body: { type: string }
        audience: { $ref: '#/components/schemas/Audience' }
        url: { type: string }

    WidgetSize:
      type: string
      enum: [small, medium, large]

    WidgetCatalogEntry:
      type: object
      properties:
        key: { type: string, examples: ['garden.work'] }
        module: { $ref: '#/components/schemas/ModuleKeyValue' }
        title: { type: string }
        description: { type: string }
        default_size: { $ref: '#/components/schemas/WidgetSize' }
        required_level: { $ref: '#/components/schemas/AccessLevel' }

    WidgetPayload:
      type: object
      properties:
        key: { type: string }
        size: { $ref: '#/components/schemas/WidgetSize' }
        data: { description: Provider-specific. }
        error: { type: [string, 'null'], description: 'Set when the provider failed or timed out — the screen renders without it, because one slow module must never blank the dashboard.' }

    DashboardLayoutEntry:
      type: object
      required: [widget_key, visible, size]
      properties:
        widget_key: { type: string }
        visible: { type: boolean }
        size: { $ref: '#/components/schemas/WidgetSize' }

    DashboardLayout:
      type: object
      properties:
        entries: { type: array, items: { $ref: '#/components/schemas/DashboardLayoutEntry' } }
        source: { type: string, enum: [default, invitation, custom] }
        is_locked: { type: boolean, description: 'An owner may lock a child''s layout, in which case the arrange affordances are absent rather than disabled.' }
        household_default_changed: { type: boolean, description: The member is offered the new default and may decline. Silently rearranging somebody's home screen is not a feature. }

    DashboardLayoutUpdate:
      type: object
      required: [entries]
      properties:
        entries: { type: array, items: { $ref: '#/components/schemas/DashboardLayoutEntry' } }

    DashboardDefaultLayout:
      type: object
      properties:
        audience: { type: string, enum: [all, child] }
        entries: { type: array, items: { $ref: '#/components/schemas/DashboardLayoutEntry' } }
        lock: { type: boolean }

    DashboardDefaultLayoutUpdate:
      type: object
      required: [entries]
      properties:
        entries: { type: array, items: { $ref: '#/components/schemas/DashboardLayoutEntry' } }
        lock: { type: boolean, default: false }

    DashboardRender:
      type: object
      properties:
        layout: { $ref: '#/components/schemas/DashboardLayout' }
        widgets: { type: array, items: { $ref: '#/components/schemas/WidgetPayload' } }

    Board:
      type: object
      required: [id, version]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, format: int64 }
        name: { type: string }
        description: { type: [string, 'null'] }
        icon: { type: [string, 'null'] }
        position: { type: string }
        archived: { type: boolean }
        card_count: { type: integer }

    BoardCreate:
      type: object
      required: [id, name]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        description: { type: string }
        icon: { type: string }
        template: { type: string, enum: [simple, household, project, empty], default: household, description: 'A shape, not content. Templates are translated reference data.' }
        position: { type: string }

    BoardUpdate:
      type: object
      properties: { name: { type: string }, description: { type: [string, 'null'] }, icon: { type: [string, 'null'] }, archived: { type: boolean }, position: { type: string } }

    Column:
      type: object
      required: [id, version]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, format: int64 }
        board_id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        kind: { type: string, enum: [normal, now, done], description: 'What lets the *Doing* widget and completion semantics work without hardcoding column names.' }
        position: { type: string }

    ColumnCreate:
      type: object
      required: [id, name]
      properties: { id: { $ref: '#/components/schemas/Uuid' }, name: { type: string }, kind: { type: string, enum: [normal, now, done], default: normal }, position: { type: string } }

    ColumnUpdate:
      type: object
      properties: { name: { type: string }, kind: { type: string, enum: [normal, now, done] }, position: { type: string } }

    Card:
      type: object
      required: [id, version]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, format: int64 }
        board_id: { $ref: '#/components/schemas/Uuid' }
        column_id: { $ref: '#/components/schemas/Uuid' }
        title: { type: string }
        body_md: { type: [string, 'null'] }
        assignee: { oneOf: [{ $ref: '#/components/schemas/ActorRef' }, { type: 'null' }] }
        due_on: { type: [string, 'null'], format: date }
        priority: { type: [integer, 'null'] }
        position: { type: string }
        done_at: { type: [string, 'null'], format: date-time }
        archived: { type: boolean }
        labels: { type: array, items: { $ref: '#/components/schemas/Label' } }
        checklist_progress: { type: object, properties: { done: { type: integer }, total: { type: integer } } }
        comment_count: { type: integer }

    CardCreate:
      type: object
      required: [id, column_id, title]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        column_id: { $ref: '#/components/schemas/Uuid' }
        title: { type: string }
        body_md: { type: string }
        assignee_id: { $ref: '#/components/schemas/Uuid' }
        due_on: { type: string, format: date }
        priority: { type: integer }
        position: { type: string }
        label_ids: { type: array, items: { $ref: '#/components/schemas/Uuid' } }

    CardUpdate:
      type: object
      properties:
        title: { type: string }
        body_md: { type: [string, 'null'] }
        assignee_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        due_on: { type: [string, 'null'], format: date }
        priority: { type: [integer, 'null'] }
        archived: { type: boolean }

    CardDetail:
      allOf:
        - { $ref: '#/components/schemas/Card' }
        - type: object
          properties:
            checklist: { type: array, items: { $ref: '#/components/schemas/ChecklistItem' } }
            links: { type: array, items: { $ref: '#/components/schemas/Link' } }
            comments: { type: array, items: { $ref: '#/components/schemas/Comment' } }

    CardPage:
      type: object
      required: [items, meta]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/Card' } }, meta: { $ref: '#/components/schemas/PageMeta' } }

    BoardTree:
      type: object
      properties:
        board: { $ref: '#/components/schemas/Board' }
        columns:
          type: array
          items:
            allOf:
              - { $ref: '#/components/schemas/Column' }
              - type: object
                properties: { cards: { type: array, items: { $ref: '#/components/schemas/Card' } } }
        labels: { type: array, items: { $ref: '#/components/schemas/Label' } }

    ChecklistItem:
      type: object
      required: [id]
      properties: { id: { $ref: '#/components/schemas/Uuid' }, text: { type: string }, done: { type: boolean }, position: { type: string } }

    Label:
      type: object
      required: [id]
      properties: { id: { $ref: '#/components/schemas/Uuid' }, name: { type: string }, colour: { type: string, description: Never the only carrier of meaning — the name is always shown. } }

    LabelUpdate:
      type: object
      properties: { id: { $ref: '#/components/schemas/Uuid' }, name: { type: string }, colour: { type: string } }

    LabelCreate:
      allOf: [{ $ref: '#/components/schemas/LabelUpdate' }, { required: [id, name] }]

    Link:
      type: object
      required: [id]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string, enum: [url, document] }
        url: { type: [string, 'null'] }
        document: { oneOf: [{ $ref: '#/components/schemas/DocumentRef' }, { type: 'null' }] }
        label: { type: [string, 'null'] }

    LinkCreate:
      type: object
      required: [id, kind]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string, enum: [url, document] }
        url: { type: string }
        document_id: { $ref: '#/components/schemas/Uuid' }
        label: { type: string }

    DocumentRef:
      type: object
      description: |
        A **platform-resolved reference**. The referring module stores only the id; the platform
        resolves it, applies the caller's Documents grant and the document's privacy, and returns
        what the caller may see — or `visible: false` with no other detail.
      properties:
        document_id: { $ref: '#/components/schemas/Uuid' }
        visible: { type: boolean }
        title: { type: [string, 'null'] }
        content_type: { type: [string, 'null'] }
        byte_size: { type: [integer, 'null'], format: int64 }
        thumbnail_available: { type: boolean }

    Comment:
      type: object
      required: [id]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        body: { type: string }
        author: { $ref: '#/components/schemas/ActorRef' }
        created_at: { type: string, format: date-time }
        edited_at: { type: [string, 'null'], format: date-time }
        mentions: { type: array, items: { $ref: '#/components/schemas/Uuid' } }

    CommentCreate:
      type: object
      required: [id, body]
      properties: { id: { $ref: '#/components/schemas/Uuid' }, body: { type: string }, mentions: { type: array, items: { $ref: '#/components/schemas/Uuid' } } }

    CommentPage:
      type: object
      required: [items, meta]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/Comment' } }, meta: { $ref: '#/components/schemas/PageMeta' } }

    BulkResult:
      type: object
      properties:
        succeeded: { type: integer }
        failed: { type: integer }
        results:
          type: array
          items:
            type: object
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              ok: { type: boolean }
              code: { type: [string, 'null'] }
              message: { type: [string, 'null'] }

    AvatarUpload:
      type: object
      required: [file]
      properties:
        file: { type: string, format: binary, description: 'A JPEG, PNG, GIF or WebP image, up to 20 MB.' }

    ContentLink:
      type: object
      description: A pre-signed URL for **one object**, expiring in minutes. Never issued for a prefix.
      properties:
        url: { type: string, format: uri }
        expires_at: { type: string, format: date-time }
        content_type: { type: string }
        byte_size: { type: integer, format: int64 }
        disposition: { type: string, enum: [inline, attachment], description: 'Active types — HTML, SVG, anything scriptable — are always `attachment` and are never rendered in the app''s origin.' }
        etag: { type: [string, 'null'], description: 'The SHA-256 checksum. Bytes never change, so the cache policy is immutable.' }

    PinScope:
      type: string
      enum: [household, personal]
      description: |
        `household` is a shared, audited mutation requiring `contribute`. `personal` is a per-member
        view preference requiring only `view`, and is not audited.

    PinState:
      type: object
      properties:
        household: { type: boolean }
        personal: { type: boolean }
        position: { type: [string, 'null'] }

    ResolveResult:
      type: object
      required: [id]
      properties:
        type: { type: string, enum: [folder, note, document] }
        id: { $ref: '#/components/schemas/Uuid' }

    Folder:
      type: object
      required: [id, version]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, format: int64 }
        parent_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        name: { type: string }
        slug: { type: string }
        slug_path: { type: string }
        icon: { type: [string, 'null'] }
        position: { type: string }
        visibility: { type: string, enum: [shared, private] }
        owner: { oneOf: [{ $ref: '#/components/schemas/ActorRef' }, { type: 'null' }] }
        archived: { type: boolean }

    FolderCreate:
      type: object
      required: [id, name]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        parent_id: { $ref: '#/components/schemas/Uuid' }
        icon: { type: string }
        position: { type: string }
        visibility: { type: string, enum: [shared, private], default: shared }

    FolderUpdate:
      type: object
      properties: { name: { type: string }, icon: { type: [string, 'null'] }, archived: { type: boolean } }
    RecurrenceEditScope:
      type: string
      enum: [this, this_and_following, all]
      description: |
        `this` writes a per-occurrence override plus an `EXDATE` on the master. `this_and_following`
        truncates the master with an `UNTIL` and creates a new series carrying the change.
        `all` edits the master, surfacing rather than silently dropping overrides that no longer apply.

    RsvpStatus:
      type: string
      enum: [needs_action, accepted, declined, tentative]

    Calendar:
      type: object
      required: [id, version]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, format: int64 }
        name: { type: string }
        colour: { type: string }
        scope: { type: string, enum: [household, personal, member_shared, external] }
        owner: { oneOf: [{ $ref: '#/components/schemas/ActorRef' }, { type: 'null' }] }
        member_ids: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
        connection_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        read_only: { type: boolean }
        detail_level: { type: string, enum: [full, busy_only] }
        ics_url: { type: [string, 'null'] }

    CalendarCreate:
      type: object
      required: [id, name, scope]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        colour: { type: string }
        scope: { type: string, enum: [household, personal, member_shared] }
        member_ids: { type: array, items: { $ref: '#/components/schemas/Uuid' } }

    CalendarUpdate:
      type: object
      properties: { name: { type: string }, colour: { type: string }, member_ids: { type: array, items: { $ref: '#/components/schemas/Uuid' } } }

    Event:
      type: object
      required: [id, version]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, format: int64 }
        calendar_id: { $ref: '#/components/schemas/Uuid' }
        title: { type: string }
        description: { type: [string, 'null'] }
        location: { type: [string, 'null'], description: 'Free text. **Never a coordinate, never geocoded** — no module requests location permission.' }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        timezone: { type: string, description: 'IANA name, **stored on the event**. A recurring 08:00 school run stays 08:00 across a DST boundary and abroad.' }
        all_day: { type: boolean }
        rrule: { type: [string, 'null'] }
        rdate: { type: array, items: { type: string, format: date-time } }
        exdate: { type: array, items: { type: string, format: date-time } }
        status: { type: string, enum: [confirmed, tentative, cancelled] }
        visibility: { type: string, enum: [default, private], description: 'A private event on a shared calendar contributes a busy block with no title.' }
        external: { oneOf: [{ type: 'null' }, { type: object, properties: { connection_id: { $ref: '#/components/schemas/Uuid' }, uid: { type: string }, owned_by: { type: string, enum: [household, remote] } } }] }
        created_by: { $ref: '#/components/schemas/ActorRef' }

    EventCreate:
      type: object
      required: [id, calendar_id, title, starts_at, ends_at, timezone]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        calendar_id: { $ref: '#/components/schemas/Uuid' }
        title: { type: string }
        description: { type: string }
        location: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        timezone: { type: string }
        all_day: { type: boolean, default: false }
        rrule: { type: string }
        status: { type: string, enum: [confirmed, tentative], default: confirmed }
        visibility: { type: string, enum: [default, private], default: default }
        participant_ids: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
        reminders: { type: array, items: { $ref: '#/components/schemas/ReminderLead' } }

    EventUpdate:
      type: object
      required: [scope]
      properties:
        scope: { $ref: '#/components/schemas/RecurrenceEditScope' }
        recurrence_id: { type: string, format: date-time, description: Required when `scope` is `this` or `this_and_following`. }
        title: { type: string }
        description: { type: [string, 'null'] }
        location: { type: [string, 'null'] }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        timezone: { type: string }
        all_day: { type: boolean }
        rrule: { type: [string, 'null'] }
        status: { type: string, enum: [confirmed, tentative, cancelled] }
        visibility: { type: string, enum: [default, private] }
        participant_ids: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
        reminders: { type: array, items: { $ref: '#/components/schemas/ReminderLead' } }

    EventDetail:
      allOf:
        - { $ref: '#/components/schemas/Event' }
        - type: object
          properties:
            participants: { type: array, items: { $ref: '#/components/schemas/EventParticipant' } }
            reminders: { type: array, items: { $ref: '#/components/schemas/ReminderLead' } }
            overrides:
              type: array
              items:
                type: object
                properties:
                  recurrence_id: { type: string, format: date-time }
                  changed_fields: { type: array, items: { type: string } }
                  cancelled: { type: boolean }

    EventOccurrence:
      type: object
      properties:
        event_id: { $ref: '#/components/schemas/Uuid' }
        recurrence_id: { type: [string, 'null'], format: date-time }
        calendar_id: { $ref: '#/components/schemas/Uuid' }
        calendar_colour: { type: string }
        title: { type: [string, 'null'], description: 'Null when the calendar is imported as busy-only, or the event is private to another member.' }
        location: { type: [string, 'null'] }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        all_day: { type: boolean }
        is_override: { type: boolean }
        status: { type: string, enum: [confirmed, tentative, cancelled] }
        busy_only: { type: boolean }
        participants: { type: array, items: { $ref: '#/components/schemas/EventParticipant' } }

    EventParticipant:
      type: object
      properties:
        user: { $ref: '#/components/schemas/ActorRef' }
        status: { $ref: '#/components/schemas/RsvpStatus' }
        note: { type: [string, 'null'] }
        is_organiser: { type: boolean }

    CalendarConnection:
      type: object
      required: [id]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        provider: { type: string, enum: [google, apple, caldav, ics_url] }
        account_label: { type: string }
        owner: { $ref: '#/components/schemas/ActorRef' }
        health: { type: string, enum: [ok, degraded, auth_failed] }
        last_sync_at: { type: [string, 'null'], format: date-time }
        last_error: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }

    CalendarConnectionCreate:
      type: object
      required: [id, provider]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        provider: { type: string, enum: [google, apple, caldav, ics_url] }
        oauth_code: { type: string, description: For `google`. }
        oauth_state: { type: string }
        code_verifier: { type: string }
        server_url: { type: string, description: For `caldav`. }
        username: { type: string }
        app_password: { type: string, description: 'For `apple` and `caldav`. Stored encrypted, excluded from every export and every log.' }
        ics_url: { type: string, format: uri, description: For `ics_url`. Read-only. }

    CalendarConnectionDetail:
      allOf:
        - { $ref: '#/components/schemas/CalendarConnection' }
        - type: object
          properties:
            calendars: { type: array, items: { $ref: '#/components/schemas/CalendarConnectionCalendar' } }

    CalendarConnectionCalendar:
      type: object
      properties:
        remote_calendar_id: { type: string }
        name: { type: string }
        colour: { type: [string, 'null'] }
        direction: { type: string, enum: ['off', import, two_way] }
        detail: { type: string, enum: [full, busy_only] }
        local_calendar_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        writable_remotely: { type: boolean }

    CalendarConnectionCalendarUpdate:
      type: object
      required: [direction]
      properties:
        direction: { type: string, enum: ['off', import, two_way] }
        detail: { type: string, enum: [full, busy_only], default: full }

    CalendarConflictPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              event_id: { $ref: '#/components/schemas/Uuid' }
              connection_id: { $ref: '#/components/schemas/Uuid' }
              detected_at: { type: string, format: date-time }
              winner: { type: string, enum: [local, remote] }
              local_version: { $ref: '#/components/schemas/Event' }
              remote_version: { $ref: '#/components/schemas/Event' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    ShoppingList:
      type: object
      required: [id, version]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, format: int64 }
        name: { type: string }
        icon: { type: [string, 'null'] }
        store: { type: [string, 'null'] }
        is_default: { type: boolean }
        position: { type: string }
        archived: { type: boolean }
        unchecked_count: { type: integer }
        checked_count: { type: integer }
        category_order: { type: array, items: { $ref: '#/components/schemas/Uuid' }, description: 'The store layout — an ordering of categories matching how the shop is actually laid out, so the list reads in walking order.' }

    ShoppingListCreate:
      type: object
      required: [id, name]
      properties: { id: { $ref: '#/components/schemas/Uuid' }, name: { type: string }, icon: { type: string }, store: { type: string }, is_default: { type: boolean }, position: { type: string } }

    ShoppingListUpdate:
      type: object
      properties: { name: { type: string }, icon: { type: [string, 'null'] }, store: { type: [string, 'null'] }, is_default: { type: boolean }, archived: { type: boolean } }

    ShoppingListDetail:
      allOf:
        - { $ref: '#/components/schemas/ShoppingList' }
        - type: object
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/ShoppingItem' } }
            groups:
              type: array
              description: Items grouped by category in the store-layout order.
              items:
                type: object
                properties:
                  category: { oneOf: [{ $ref: '#/components/schemas/ShoppingCategory' }, { type: 'null' }] }
                  item_ids: { type: array, items: { $ref: '#/components/schemas/Uuid' } }

    ShoppingItem:
      type: object
      required: [id, version]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, format: int64 }
        list_id: { $ref: '#/components/schemas/Uuid' }
        text: { type: string }
        quantity: { type: [string, 'null'], description: Decimal as a string. Parsed opportunistically; parsing never blocks the add. }
        unit: { type: [string, 'null'] }
        category_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        note: { type: [string, 'null'] }
        checked: { type: boolean }
        checked_by: { oneOf: [{ $ref: '#/components/schemas/ActorRef' }, { type: 'null' }], description: '"Did you already get the milk" is the question this module exists to prevent.' }
        checked_at: { type: [string, 'null'], format: date-time }
        assigned_to: { oneOf: [{ $ref: '#/components/schemas/ActorRef' }, { type: 'null' }] }
        price: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        position: { type: string }
        source_ref: { type: [object, 'null'], additionalProperties: true, description: 'Unused in 1.0. Present so a recipe or a pantry low-stock rule can arrive later without a migration.' }

    ShoppingQuickAdd:
      type: object
      required: [text]
      properties:
        text: { type: string, description: 'Split on commas and newlines; each line parsed for a leading quantity and unit. "milk, bread, 2 kg potatoes" creates three items.' }
        ids:
          type: array
          items: { $ref: '#/components/schemas/Uuid' }
          description: |
            Client-generated ids, one per resulting item, in order. The item count is derived only
            from the split — `text` cut on commas and newlines with empty segments discarded — so a
            client computes it without reproducing the quantity and unit parsing, which changes an
            item's fields but never how many there are.

            Supplying `ids` is optional; supplying a count that does not equal the number of split
            segments is `422` naming `ids`, and nothing is created. The server never invents an id
            for a shortfall: a partially client-identified batch would leave the offline replica
            holding rows it can never reconcile, which is the failure client-generated ids exist to
            prevent.
        assigned_to: { $ref: '#/components/schemas/Uuid' }

    ShoppingItemUpdate:
      type: object
      properties:
        text: { type: string }
        quantity: { type: [string, 'null'] }
        unit: { type: [string, 'null'] }
        category_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        note: { type: [string, 'null'] }
        assigned_to: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        price: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        position: { type: string }

    ShoppingClearRequest:
      type: object
      properties:
        record_trip: { type: boolean, default: false }
        store: { type: string }
        total: { $ref: '#/components/schemas/Money' }
        record_as_expense: { type: boolean, default: false, description: 'Offered, never forced, and only when the caller has `contribute` on Finance.' }

    ShoppingClearResult:
      type: object
      properties:
        cleared: { type: integer }
        trip: { oneOf: [{ $ref: '#/components/schemas/ShoppingTrip' }, { type: 'null' }] }
        undo_token: { type: string, description: Cleared items are soft-deleted; this restores them within the undo window. }

    ShoppingCategory:
      type: object
      required: [id]
      properties: { id: { $ref: '#/components/schemas/Uuid' }, name: { type: string }, icon: { type: [string, 'null'] }, is_builtin: { type: boolean }, position: { type: string } }

    ShoppingCategoryCreate:
      type: object
      required: [id, name]
      properties: { id: { $ref: '#/components/schemas/Uuid' }, name: { type: string }, icon: { type: string }, position: { type: string } }

    ShoppingStaple:
      type: object
      required: [id]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        text: { type: string }
        category_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        source: { type: string, enum: [learned, explicit] }
        frequency_days: { type: [integer, 'null'], description: A recurring staple reappears on the list on this cadence. It never notifies — a push about milk is how notifications get turned off. }
        last_added_on: { type: [string, 'null'], format: date }
        times_bought: { type: integer }

    ShoppingStapleCreate:
      type: object
      required: [id, text]
      properties: { id: { $ref: '#/components/schemas/Uuid' }, text: { type: string }, category_id: { $ref: '#/components/schemas/Uuid' }, frequency_days: { type: integer }, list_id: { $ref: '#/components/schemas/Uuid' } }

    ShoppingTrip:
      type: object
      required: [id]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        list_id: { $ref: '#/components/schemas/Uuid' }
        shopped_on: { type: string, format: date }
        store: { type: [string, 'null'] }
        total: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        item_count: { type: integer }
        by: { $ref: '#/components/schemas/ActorRef' }

    ShoppingTripPage:
      type: object
      required: [items, meta]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/ShoppingTrip' } }, meta: { $ref: '#/components/schemas/PageMeta' } }

    ChoreScheduleKind:
      type: string
      enum: [fixed_interval, calendar, monthly_nth, on_demand]
      description: |
        `fixed_interval` anchors on the **last completion**, so a chore done late does not accumulate
        a debt of missed occurrences. `calendar` is grid-anchored and is correct for a bin
        collection. Choosing the wrong one is the most common way a chore app becomes a guilt
        generator.

    ChoreAssignmentMode:
      type: string
      enum: [unassigned, fixed, rotating, weekly_rotation]

    ChoreOccurrenceStatus:
      type: string
      enum: [open, done, skipped, awaiting_verification, snoozed]

    Chore:
      type: object
      required: [id, version]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, format: int64 }
        name: { type: string }
        description: { type: [string, 'null'] }
        icon: { type: [string, 'null'] }
        area: { type: [string, 'null'] }
        estimated_minutes: { type: [integer, 'null'] }
        points: { type: [integer, 'null'] }
        schedule_kind: { $ref: '#/components/schemas/ChoreScheduleKind' }
        interval_days: { type: [integer, 'null'] }
        weekdays: { type: array, items: { type: integer, minimum: 0, maximum: 6 } }
        month_nth: { type: [integer, 'null'] }
        month_weekday: { type: [integer, 'null'] }
        assignment_mode: { $ref: '#/components/schemas/ChoreAssignmentMode' }
        current_assignee: { oneOf: [{ $ref: '#/components/schemas/ActorRef' }, { type: 'null' }] }
        rotation: { type: array, items: { $ref: '#/components/schemas/ActorRef' }, description: 'Rotation state is stored explicitly, not derived from history, so reordering it is a comprehensible edit rather than a recomputation of the past.' }
        requires_verification: { type: boolean, description: Off by default — a household that wants trust-based chores should not have to switch supervision off. }
        archived: { type: boolean }
        next_due_on: { type: [string, 'null'], format: date }

    ChoreFields:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        description: { type: string }
        icon: { type: string }
        area: { type: string }
        estimated_minutes: { type: integer }
        points: { type: integer }
        schedule_kind: { $ref: '#/components/schemas/ChoreScheduleKind' }
        interval_days: { type: integer }
        weekdays: { type: array, items: { type: integer } }
        month_nth: { type: integer }
        month_weekday: { type: integer }
        assignment_mode: { $ref: '#/components/schemas/ChoreAssignmentMode' }
        assignee_id: { $ref: '#/components/schemas/Uuid' }
        rotation_user_ids: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
        requires_verification: { type: boolean, default: false }
        starts_on: { type: string, format: date }

    ChoreCreate:
      allOf: [{ $ref: '#/components/schemas/ChoreFields' }, { required: [id, name, schedule_kind, assignment_mode] }]

    ChoreUpdate:
      allOf: [{ $ref: '#/components/schemas/ChoreFields' }, { type: object, properties: { archived: { type: boolean } } }]

    ChoreDetail:
      allOf:
        - { $ref: '#/components/schemas/Chore' }
        - type: object
          properties:
            recent: { type: array, items: { $ref: '#/components/schemas/ChoreOccurrence' } }
            streak: { type: integer, description: The member's own streak. There is deliberately no ranking of members against each other. }

    ChoreOccurrence:
      type: object
      required: [id]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        chore_id: { $ref: '#/components/schemas/Uuid' }
        chore_name: { type: string }
        due_on: { type: string, format: date }
        assignee: { oneOf: [{ $ref: '#/components/schemas/ActorRef' }, { type: 'null' }] }
        status: { $ref: '#/components/schemas/ChoreOccurrenceStatus' }
        completed_by: { oneOf: [{ $ref: '#/components/schemas/ActorRef' }, { type: 'null' }] }
        completed_at: { type: [string, 'null'], format: date-time }
        skipped_reason: { type: [string, 'null'] }
        snoozed_until: { type: [string, 'null'], format: date }
        points_awarded: { type: [integer, 'null'] }
        is_overdue: { type: boolean }
        stale: { type: boolean, description: 'Untouched and overdue past the threshold — flagged to an owner as possibly not a real chore, with a one-tap delete or reschedule. Pruning the list is a feature.' }

    ChoreBoard:
      type: object
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        members: { type: array, items: { $ref: '#/components/schemas/ActorRef' } }
        cells:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
