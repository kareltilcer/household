  /households/{household_id}/chores/swaps/{swap_id}:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { name: swap_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }]
    post:
      operationId: postChoresSwapsBySwapId
      tags: [chores]
      summary: Accept or decline a swap
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [accept], properties: { accept: { type: boolean } } } } }
      responses:
        '200': { description: Recorded, content: { application/json: { schema: { $ref: '#/components/schemas/ChoreSwap' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/chores/points:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    get:
      operationId: getChoresPoints
      tags: [chores]
      summary: The point ledger
      description: |
        A ledger, not a counter — every award, deduction and adjustment is a row with a reason and
        an actor. A member always sees their own entries. There is deliberately **no ranking of
        members against each other** anywhere in this module.
      parameters:
        - { name: user_id, in: query, required: false, schema: { $ref: '#/components/schemas/Uuid' } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { description: Entries with balances, content: { application/json: { schema: { $ref: '#/components/schemas/ChorePointPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      operationId: postChoresPoints
      tags: [chores]
      summary: Award or deduct points manually
      description: Requires `manage`, and a reason. A deduction is always shown to the member in full.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ChorePointEntryCreate' } } }
      responses:
        '201': { description: Recorded, content: { application/json: { schema: { $ref: '#/components/schemas/ChorePointEntry' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/chores/rewards:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    get:
      operationId: getChoresRewards
      tags: [chores]
      summary: Available rewards
      responses:
        '200': { description: Rewards, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/ChoreReward' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      operationId: postChoresRewards
      tags: [chores]
      summary: Define a reward
      description: Household-defined and non-monetary. Household never processes pocket money.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ChoreRewardCreate' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/ChoreReward' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/chores/redemptions:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    post:
      operationId: postChoresRedemptions
      tags: [chores]
      summary: Request a reward redemption
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [reward_id], properties: { id: { $ref: '#/components/schemas/Uuid' }, reward_id: { $ref: '#/components/schemas/Uuid' } } } } }
      responses:
        '201': { description: Requested, content: { application/json: { schema: { $ref: '#/components/schemas/ChoreRedemption' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Insufficient balance, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /households/{household_id}/chores/redemptions/{redemption_id}:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { name: redemption_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }]
    post:
      operationId: postChoresRedemptionsByRedemptionId
