# What each member replicates (plan item 5). Throwaway.
#
# The effective level on a module is the tenant middleware's (internal/platform/tenant):
# none when the household has the module disabled, manage for an owner, the grant otherwise.
# A member replicates a household's shopping items while that level is above none.
#
# The compiler takes inner joins only (a LEFT JOIN is refused as "FULL JOIN is not
# supported") and no OR across the joined tables, so "an owner, or a member with a grant" is
# two streams, one per arm; a row reached by both is held once on the client. The client
# table is named after the FROM alias, so the data query takes none.
config:
  edition: 3

streams:
  shopping_items_owner:
    auto_subscribe: true
    query: |
      SELECT * FROM shopping_items
      WHERE deleted_at IS NULL
        AND household_id IN (
          SELECT m.household_id FROM memberships m
            JOIN module_enablement e ON e.household_id = m.household_id
          WHERE m.user_id = auth.user_id() AND m.role = 'owner'
            AND e.module = 'shopping' AND e.enabled
        )

  shopping_items_granted:
    auto_subscribe: true
    query: |
      SELECT * FROM shopping_items
      WHERE deleted_at IS NULL
        AND household_id IN (
          SELECT g.household_id FROM module_grants g
            JOIN module_enablement e ON e.household_id = g.household_id AND e.module = g.module
          WHERE g.user_id = auth.user_id() AND g.module = 'shopping' AND g.level <> 'none'
            AND e.enabled
        )

  # The visibility axis (PRD 03 §2.3, D-88). A private row reaches its owner whole; its
  # redacted form reaches everyone, its owner too, since a stream cannot say owner_id <>
  # auth.user_id(), into a table of its own.
  spike_notes_shared:
    auto_subscribe: true
    query: |
      SELECT * FROM spike_notes
      WHERE visibility = 'shared' AND household_id IN (
        SELECT g.household_id FROM module_grants g
          JOIN module_enablement e ON e.household_id = g.household_id AND e.module = g.module
        WHERE g.user_id = auth.user_id() AND g.module = 'spike' AND g.level <> 'none' AND e.enabled)

  spike_notes_private:
    auto_subscribe: true
    query: |
      SELECT * FROM spike_notes
      WHERE visibility = 'private' AND owner_id = auth.user_id() AND household_id IN (
        SELECT g.household_id FROM module_grants g
          JOIN module_enablement e ON e.household_id = g.household_id AND e.module = g.module
        WHERE g.user_id = auth.user_id() AND g.module = 'spike' AND g.level <> 'none' AND e.enabled)

  spike_notes_redacted:
    auto_subscribe: true
    query: |
      SELECT id, household_id, owner_id, version FROM spike_notes AS spike_notes_redacted
      WHERE visibility = 'private' AND household_id IN (
        SELECT g.household_id FROM module_grants g
          JOIN module_enablement e ON e.household_id = g.household_id AND e.module = g.module
        WHERE g.user_id = auth.user_id() AND g.module = 'spike' AND g.level <> 'none' AND e.enabled)

  # The audience axis with its floor (D-90), through the readers the server keeps on the row.
  spike_messages:
    auto_subscribe: true
    query: |
      SELECT id, household_id, conversation_id, seq, body, version FROM spike_messages
      WHERE auth.user_id() IN readers AND household_id IN (
        SELECT g.household_id FROM module_grants g
          JOIN module_enablement e ON e.household_id = g.household_id AND e.module = g.module
        WHERE g.user_id = auth.user_id() AND g.module = 'spike' AND g.level <> 'none' AND e.enabled)
