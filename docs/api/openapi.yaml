    ChoreReward:
      type: object
      required: [id]
      properties: { id: { $ref: '#/components/schemas/Uuid' }, name: { type: string }, description: { type: [string, 'null'] }, cost_points: { type: integer }, active: { type: boolean } }

    ChoreRewardCreate:
      type: object
      required: [id, name, cost_points]
