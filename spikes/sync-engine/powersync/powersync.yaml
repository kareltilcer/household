# PowerSync, self-hosted for the spike (plan item 5). Throwaway.
replication:
  connections:
    - type: postgresql
      uri: postgresql://spike_powersync:spike_powersync@pg:5432/household
      sslmode: disable

storage:
  type: postgresql
  uri: postgresql://spike_powersync_storage:spike_powersync_storage@pg:5432/powersync_storage
  sslmode: disable

port: 8080

sync_config:
  path: sync-config.yaml

# The spike's backend signs the clients' tokens with this key (HS256); `sub` is the user id.
client_auth:
  audience: [powersync]
  jwks:
    keys:
      - kty: oct
        alg: HS256
        kid: spike
        k: aG91c2Vob2xkLXNwaWtlLWhzMjU2LXNlY3JldC1ub3QtYS1yZWFsLWtleQ

telemetry:
  disable_telemetry_sharing: true

# The spike validates candidate stream definitions through the admin API.
api:
  tokens: [spike-admin-token]
