# The sync-engine spike (plan item 5). Throwaway: deleted before the PR merges.
#
# A PostgreSQL 17 with logical replication, carrying item 4's schema (applied by the real
# `household-api bootstrap` and `migrate`) plus one shopping table, and the two candidates,
# self-hosted beside it:
#   - PowerSync, replicating into bucket storage held in a second database of the same server;
#   - Electric, serving shapes over HTTP.
# Every port is published on 127.0.0.1 only, and every credential is a throwaway.
name: household-spike

services:
  pg:
    image: postgres:17.11-trixie
    command: [postgres, -c, wal_level=logical, -c, max_replication_slots=20, -c, max_wal_senders=20]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: household
    ports:
      - 127.0.0.1:5442:5432
    healthcheck:
      test: [CMD-SHELL, pg_isready --host=127.0.0.1 --username=postgres --dbname=household]
      interval: 2s
      timeout: 5s
      retries: 30

  powersync:
    image: journeyapps/powersync-service:1.26.1
    command: [start, -r, unified]
    environment:
      POWERSYNC_CONFIG_PATH: /config/powersync.yaml
    volumes:
      - ./powersync:/config:ro
    ports:
      - 127.0.0.1:8090:8080
    extra_hosts:
      - host.docker.internal:host-gateway
    profiles: [engines]

  electric:
    image: electricsql/electric:1.8.1
    environment:
      DATABASE_URL: postgresql://spike_electric:spike_electric@pg:5432/household?sslmode=disable
      # The spike's proxy (backend/) is the only client; a real deployment sets ELECTRIC_SECRET.
      ELECTRIC_INSECURE: 'true'
      ELECTRIC_USAGE_REPORTING: 'false'
      ELECTRIC_MANUAL_TABLE_PUBLISHING: 'true'
    ports:
      - 127.0.0.1:3010:3000
    profiles: [engines]
