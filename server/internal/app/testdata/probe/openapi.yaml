openapi: 3.1.0
info: { title: The probe module's contract, version: '1' }
paths:
  /healthz:
    get: { operationId: getHealthz, security: [], responses: { '200': { description: Alive } } }
  /readyz:
    get: { operationId: getReadyz, security: [], responses: { '200': { description: Ready }, '503': { description: Not ready } } }
  /reference/countries:
    get: { operationId: getReferenceCountries, responses: { '200': { description: Listed }, '401': { $ref: '#/components/responses/Problem' } } }
  /reference/countries/{country}:
    parameters: [{ name: country, in: path, required: true, schema: { type: string, pattern: '^[A-Z]{2}$' } }]
    get: { operationId: getReferenceCountriesByCountry, responses: { '200': { description: Found }, '401': { $ref: '#/components/responses/Problem' }, '404': { $ref: '#/components/responses/Problem' } } }
  /reference/units:
    get: { operationId: getReferenceUnits, responses: { '200': { description: Listed }, '401': { $ref: '#/components/responses/Problem' } } }
  # The account routes the router always serves (item 8), declared as loosely as the tests need.
  /auth/register:
    post: { operationId: postAuthRegister, security: [], requestBody: { $ref: '#/components/requestBodies/Any' }, responses: { '202': { description: Accepted }, default: { $ref: '#/components/responses/Problem' } } }
  /auth/verify-email:
    post: { operationId: postAuthVerifyEmail, security: [], requestBody: { $ref: '#/components/requestBodies/Any' }, responses: { '204': { description: Verified }, default: { $ref: '#/components/responses/Problem' } } }
  /auth/verify-email/resend:
    post: { operationId: postAuthVerifyEmailResend, security: [], requestBody: { $ref: '#/components/requestBodies/Any' }, responses: { '202': { description: Accepted }, default: { $ref: '#/components/responses/Problem' } } }
  /auth/login:
    post: { operationId: postAuthLogin, security: [], requestBody: { $ref: '#/components/requestBodies/Any' }, responses: { '200': { description: Signed in }, default: { $ref: '#/components/responses/Problem' } } }
  /auth/logout:
    post: { operationId: postAuthLogout, responses: { '204': { description: Signed out }, default: { $ref: '#/components/responses/Problem' } } }
  /auth/password-reset:
    post: { operationId: postAuthPasswordReset, security: [], requestBody: { $ref: '#/components/requestBodies/Any' }, responses: { '202': { description: Accepted }, default: { $ref: '#/components/responses/Problem' } } }
  /auth/password-reset/confirm:
    post: { operationId: postAuthPasswordResetConfirm, security: [], requestBody: { $ref: '#/components/requestBodies/Any' }, responses: { '204': { description: Set }, default: { $ref: '#/components/responses/Problem' } } }
  /auth/password:
    post: { operationId: postAuthPassword, requestBody: { $ref: '#/components/requestBodies/Any' }, responses: { '204': { description: Changed }, default: { $ref: '#/components/responses/Problem' } } }
  /auth/token:
    post: { operationId: postAuthToken, security: [], requestBody: { $ref: '#/components/requestBodies/Any' }, responses: { '200': { description: Refreshed }, default: { $ref: '#/components/responses/Problem' } } }
  /auth/mfa/enroll:
    post: { operationId: postAuthMfaEnroll, requestBody: { $ref: '#/components/requestBodies/Any' }, responses: { '200': { description: Enrolled }, default: { $ref: '#/components/responses/Problem' } } }
  /auth/mfa/activate:
    post: { operationId: postAuthMfaActivate, requestBody: { $ref: '#/components/requestBodies/Any' }, responses: { '200': { description: Activated }, default: { $ref: '#/components/responses/Problem' } } }
  /auth/mfa/verify:
    post: { operationId: postAuthMfaVerify, security: [], requestBody: { $ref: '#/components/requestBodies/Any' }, responses: { '200': { description: Signed in }, default: { $ref: '#/components/responses/Problem' } } }
  /auth/mfa/disable:
    post: { operationId: postAuthMfaDisable, requestBody: { $ref: '#/components/requestBodies/Any' }, responses: { '204': { description: Disabled }, default: { $ref: '#/components/responses/Problem' } } }
  /auth/mfa/recovery-codes:
    post: { operationId: postAuthMfaRecoveryCodes, requestBody: { $ref: '#/components/requestBodies/Any' }, responses: { '200': { description: Made }, default: { $ref: '#/components/responses/Problem' } } }
  /auth/oauth/{provider}/start:
    parameters: [{ name: provider, in: path, required: true, schema: { type: string } }]
    post: { operationId: postAuthOauthByProviderStart, security: [], requestBody: { $ref: '#/components/requestBodies/Any' }, responses: { '200': { description: Begun }, default: { $ref: '#/components/responses/Problem' } } }
  /auth/oauth/{provider}/callback:
    parameters: [{ name: provider, in: path, required: true, schema: { type: string } }]
    post: { operationId: postAuthOauthByProviderCallback, security: [], requestBody: { $ref: '#/components/requestBodies/Any' }, responses: { '200': { description: Signed in }, default: { $ref: '#/components/responses/Problem' } } }
  /auth/oauth/{provider}/link:
    parameters: [{ name: provider, in: path, required: true, schema: { type: string } }]
    post: { operationId: postAuthOauthByProviderLink, requestBody: { $ref: '#/components/requestBodies/Any' }, responses: { '204': { description: Linked }, default: { $ref: '#/components/responses/Problem' } } }
  /auth/oauth/{provider}:
    parameters: [{ name: provider, in: path, required: true, schema: { type: string } }]
    delete: { operationId: deleteAuthOauthByProvider, responses: { '204': { description: Unlinked }, default: { $ref: '#/components/responses/Problem' } } }
  /me/devices:
    get: { operationId: getMeDevices, responses: { '200': { description: Devices }, default: { $ref: '#/components/responses/Problem' } } }
  /me/devices/{device_id}:
    parameters: [{ name: device_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }]
    patch: { operationId: patchMeDevicesByDeviceId, requestBody: { $ref: '#/components/requestBodies/Any' }, responses: { '200': { description: Renamed }, default: { $ref: '#/components/responses/Problem' } } }
    delete: { operationId: deleteMeDevicesByDeviceId, responses: { '204': { description: Revoked }, default: { $ref: '#/components/responses/Problem' } } }
  /me:
    get: { operationId: getMe, responses: { '200': { description: The user }, default: { $ref: '#/components/responses/Problem' } } }
    patch: { operationId: patchMe, requestBody: { $ref: '#/components/requestBodies/Any' }, responses: { '200': { description: Updated }, default: { $ref: '#/components/responses/Problem' } } }
  /me/avatar:
    put: { operationId: putMeAvatar, requestBody: { $ref: '#/components/requestBodies/Upload' }, responses: { '200': { description: The user }, default: { $ref: '#/components/responses/Problem' } } }
  /me/sessions:
    get: { operationId: getMeSessions, responses: { '200': { description: Sessions }, default: { $ref: '#/components/responses/Problem' } } }
    delete: { operationId: deleteMeSessions, responses: { '204': { description: Done }, default: { $ref: '#/components/responses/Problem' } } }
  /me/sessions/{session_id}:
    parameters: [{ name: session_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }]
    delete: { operationId: deleteMeSessionsBySessionId, responses: { '204': { description: Revoked }, default: { $ref: '#/components/responses/Problem' } } }
  # The household routes the router always serves (item 10), declared as loosely as the tests need.
  /households:
    get: { operationId: getHouseholds, responses: { '200': { description: Listed }, default: { $ref: '#/components/responses/Problem' } } }
    post: { operationId: postHouseholds, requestBody: { $ref: '#/components/requestBodies/Any' }, responses: { '201': { description: Created }, default: { $ref: '#/components/responses/Problem' } } }
  /households/{household_id}:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    get: { operationId: getHouseholdsByHouseholdId, responses: { '200': { description: Found }, default: { $ref: '#/components/responses/Problem' } } }
    patch: { operationId: patchHouseholdsByHouseholdId, requestBody: { $ref: '#/components/requestBodies/Any' }, responses: { '200': { description: Updated }, default: { $ref: '#/components/responses/Problem' } } }
  # The sync routes the router always serves (item 13), declared as loosely as the tests need.
  /sync/jwks:
    get: { operationId: getSyncJwks, security: [], responses: { '200': { description: The keys } } }
  /households/{household_id}/sync/credentials:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    post: { operationId: postSyncCredentials, responses: { '200': { description: Credentials }, default: { $ref: '#/components/responses/Problem' } } }
  /households/{household_id}/sync/mutations:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    post: { operationId: postSyncMutations, requestBody: { $ref: '#/components/requestBodies/Any' }, responses: { '200': { description: Answered }, default: { $ref: '#/components/responses/Problem' } } }
  /households/{household_id}/join-code:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    post: { operationId: postHouseholdsByHouseholdIdJoinCode, responses: { '200': { description: Made }, default: { $ref: '#/components/responses/Problem' } } }
  /households/{household_id}/leave:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    post: { operationId: postLeave, responses: { '204': { description: Left }, default: { $ref: '#/components/responses/Problem' } } }
  /households/{household_id}/restriction:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    post: { operationId: postHouseholdRestriction, requestBody: { required: false, content: { application/json: { schema: { type: object } } } }, responses: { '200': { description: Restricted }, default: { $ref: '#/components/responses/Problem' } } }
    delete: { operationId: deleteHouseholdRestriction, responses: { '200': { description: Lifted }, default: { $ref: '#/components/responses/Problem' } } }
  /households/{household_id}/members:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    get: { operationId: getMembers, responses: { '200': { description: Listed }, default: { $ref: '#/components/responses/Problem' } } }
  /households/{household_id}/members/{user_id}:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { name: user_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }]
    get: { operationId: getMembersByUserId, responses: { '200': { description: Found }, default: { $ref: '#/components/responses/Problem' } } }
    patch: { operationId: patchMembersByUserId, requestBody: { $ref: '#/components/requestBodies/Any' }, responses: { '200': { description: Updated }, default: { $ref: '#/components/responses/Problem' } } }
    delete: { operationId: deleteMembersByUserId, responses: { '204': { description: Removed }, default: { $ref: '#/components/responses/Problem' } } }
  /households/{household_id}/ownership/transfer:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    post: { operationId: postOwnershipTransfer, requestBody: { $ref: '#/components/requestBodies/Any' }, responses: { '200': { description: Promoted }, default: { $ref: '#/components/responses/Problem' } } }
  /households/{household_id}/invitations:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    get: { operationId: getInvitations, responses: { '200': { description: Listed }, default: { $ref: '#/components/responses/Problem' } } }
    post: { operationId: postInvitations, requestBody: { $ref: '#/components/requestBodies/Any' }, responses: { '201': { description: Created }, default: { $ref: '#/components/responses/Problem' } } }
  /households/{household_id}/invitations/{invitation_id}:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { name: invitation_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }]
    delete: { operationId: deleteInvitationsByInvitationId, responses: { '204': { description: Revoked }, default: { $ref: '#/components/responses/Problem' } } }
  /households/{household_id}/invitations/{invitation_id}/resend:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { name: invitation_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }]
    post: { operationId: postInvitationsByInvitationIdResend, responses: { '202': { description: Sent }, default: { $ref: '#/components/responses/Problem' } } }
  /households/{household_id}/modules:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    get: { operationId: getModules, responses: { '200': { description: Listed }, default: { $ref: '#/components/responses/Problem' } } }
  /households/{household_id}/modules/{module}:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { name: module, in: path, required: true, schema: { type: string } }]
    patch: { operationId: patchModulesByModule, requestBody: { $ref: '#/components/requestBodies/Any' }, responses: { '200': { description: Updated }, default: { $ref: '#/components/responses/Problem' } } }
  # The child profiles' routes the router always serves (item 11), declared as loosely as the tests need.
  /auth/child/profiles:
    post: { operationId: postAuthChildProfiles, security: [], requestBody: { $ref: '#/components/requestBodies/Any' }, responses: { '200': { description: Listed }, default: { $ref: '#/components/responses/Problem' } } }
  /auth/child/login:
    post: { operationId: postAuthChildLogin, security: [], requestBody: { $ref: '#/components/requestBodies/Any' }, responses: { '200': { description: Signed in }, default: { $ref: '#/components/responses/Problem' } } }
  /auth/graduation/confirm:
    post: { operationId: postAuthGraduationConfirm, security: [], requestBody: { $ref: '#/components/requestBodies/Any' }, responses: { '204': { description: Graduated }, default: { $ref: '#/components/responses/Problem' } } }
  /households/{household_id}/children:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    post: { operationId: postChildren, requestBody: { $ref: '#/components/requestBodies/Any' }, responses: { '201': { description: Created }, default: { $ref: '#/components/responses/Problem' } } }
  /households/{household_id}/children/{user_id}/pin:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { name: user_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }]
    put: { operationId: putChildrenByUserIdPin, requestBody: { $ref: '#/components/requestBodies/Any' }, responses: { '204': { description: Set }, default: { $ref: '#/components/responses/Problem' } } }
  /households/{household_id}/children/{user_id}/unlock:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { name: user_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }]
    post: { operationId: postChildrenByUserIdUnlock, responses: { '204': { description: Unlocked }, default: { $ref: '#/components/responses/Problem' } } }
  /households/{household_id}/children/{user_id}/graduate:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { name: user_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }]
    post: { operationId: postChildrenByUserIdGraduate, requestBody: { $ref: '#/components/requestBodies/Any' }, responses: { '202': { description: Sent }, default: { $ref: '#/components/responses/Problem' } } }
  /households/{household_id}/children/{user_id}/avatar:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { name: user_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }]
    put: { operationId: putChildrenByUserIdAvatar, requestBody: { $ref: '#/components/requestBodies/Upload' }, responses: { '200': { description: Set }, default: { $ref: '#/components/responses/Problem' } } }
    delete: { operationId: deleteChildrenByUserIdAvatar, responses: { '200': { description: Removed }, default: { $ref: '#/components/responses/Problem' } } }
  /households/{household_id}/storage:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    get: { operationId: getStorage, responses: { '200': { description: The picture }, default: { $ref: '#/components/responses/Problem' } } }
  /push/vapid-key:
    get: { operationId: getPushVapidKey, responses: { '200': { description: The key }, default: { $ref: '#/components/responses/Problem' } } }
  /push/subscriptions:
    post: { operationId: postPushSubscriptions, requestBody: { $ref: '#/components/requestBodies/Any' }, responses: { '200': { description: Updated }, '201': { description: Created }, default: { $ref: '#/components/responses/Problem' } } }
    delete: { operationId: deletePushSubscriptions, parameters: [{ name: endpoint, in: query, required: true, schema: { type: string } }], responses: { '204': { description: Removed }, default: { $ref: '#/components/responses/Problem' } } }
  /me/notification-preferences:
    parameters: [{ name: household_id, in: query, required: false, schema: { $ref: '#/components/schemas/Uuid' } }]
    get: { operationId: getMeNotificationPreferences, responses: { '200': { description: Preferences }, default: { $ref: '#/components/responses/Problem' } } }
    patch: { operationId: patchMeNotificationPreferences, requestBody: { $ref: '#/components/requestBodies/Any' }, responses: { '200': { description: Updated }, default: { $ref: '#/components/responses/Problem' } } }
  /me/invitations:
    get: { operationId: getMeInvitations, responses: { '200': { description: Listed }, default: { $ref: '#/components/responses/Problem' } } }
  /me/invitations/{token}:
    parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
    get: { operationId: getMeInvitationsByToken, security: [], responses: { '200': { description: Found }, default: { $ref: '#/components/responses/Problem' } } }
  /me/invitations/{token}/accept:
    parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
    post: { operationId: postMeInvitationsByTokenAccept, responses: { '200': { description: Joined }, default: { $ref: '#/components/responses/Problem' } } }
  /me/invitations/{token}/decline:
    parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
    post: { operationId: postMeInvitationsByTokenDecline, responses: { '204': { description: Declined }, default: { $ref: '#/components/responses/Problem' } } }
  /households/{household_id}/probe/items:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    get:
      operationId: getProbeItems
      responses:
        '200': { description: Listed, content: { application/json: { schema: { $ref: '#/components/schemas/ProbeItems' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '402': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
    post:
      operationId: postProbeItems
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProbeItem' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/ProbeItem' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '402': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /households/{household_id}/probe/items/{item_id}:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { name: item_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }]
    delete:
      operationId: deleteProbeItemsByItemId
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Problem' }
        '402': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /households/{household_id}/probe/files:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    post:
      operationId: postProbeFiles
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/Upload' }
      responses:
        '201': { description: Uploaded, content: { application/json: { schema: { $ref: '#/components/schemas/ProbeFile' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /households/{household_id}/probe/files/{item_id}:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }, { name: item_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }]
    get:
      operationId: getProbeFilesByItemId
      parameters: [{ name: variant, in: query, required: false, schema: { type: string } }]
      responses:
        '200': { description: A link, content: { application/json: { schema: { type: object, required: [url, expires_at, content_type, byte_size, disposition, etag] } } } }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteProbeFilesByItemId
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '204': { description: Deleted }
        default: { $ref: '#/components/responses/Problem' }
components:
  parameters:
    HouseholdId: { name: household_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: false, schema: { type: string, minLength: 1, maxLength: 128 } }
  requestBodies:
    Any: { required: true, content: { application/json: { schema: { type: object } } } }
    Upload: { required: true, content: { multipart/form-data: { schema: { type: object } } } }
  responses:
    Problem:
      description: A problem.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
  schemas:
    Uuid:
      type: string
      pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
    ProbeItem:
      type: object
      required: [id, household_id]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        household_id: { $ref: '#/components/schemas/Uuid' }
    ProbeFile:
      type: object
      required: [id, household_id, content_type, byte_size]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        household_id: { $ref: '#/components/schemas/Uuid' }
        content_type: { type: string }
        byte_size: { type: integer }
    ProbeItems:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ProbeItem' } }
    ProblemCode: { type: string }
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { $ref: '#/components/schemas/ProblemCode' }
        request_id: { type: string }
    ValidationProblem:
      allOf:
        - { $ref: '#/components/schemas/Problem' }
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              items:
                type: object
                required: [field, code]
                properties:
                  field: { type: string }
                  code: { type: string }
    FairUseProblem:
      allOf:
        - { $ref: '#/components/schemas/Problem' }
        - type: object
          properties:
            resource: { type: string, enum: [members, rows, objects] }
            ceiling: { type: integer }
            module: { type: string }
