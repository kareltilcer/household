    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Render the caller's dashboard
      description: |
        Resolves each visible widget's provider concurrently with a per-widget timeout. A widget
        that fails returns `{ key, error }` and the screen renders without it — one slow module
        never blanks the dashboard.
      responses:
        '200': { description: The dashboard, content: { application/json: { schema: { $ref: '#/components/schemas/DashboardRender' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

