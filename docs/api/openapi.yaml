  /households/{household_id}/garden/containers:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    get:
      operationId: getGardenContainers
      tags: [garden]
      summary: Containers — the `pots` tier's growing spaces
      responses:
        '200': { description: Containers, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Container' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      operationId: postGardenContainers
